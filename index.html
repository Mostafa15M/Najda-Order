<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر | مصطفى حجازي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-purple: #bc13fe;
            --bg: #050505;
            --surface: #121212;
            --glow: 0 0 15px rgba(0, 242, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg); 
            color: #fff; 
            padding-bottom: 80px; 
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* هيدر صغير ومظبوط لاستغلال الشاشة */
        header { 
            padding: 12px 15px; 
            background: #0a0a0a; 
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-text { font-size: 1.3rem; font-weight: 900; color: var(--neon-cyan); text-shadow: var(--glow); cursor: pointer; }
        .user-tag { font-size: 0.75rem; color: var(--neon-purple); font-weight: 700; border: 1px solid var(--neon-purple); padding: 2px 8px; border-radius: 8px; }

        /* الأقسام: القسم النشط فقط هو المنور */
        .cats-bar { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 10px 15px; 
            background: #080808;
            scrollbar-width: none;
        }
        .cats-bar::-webkit-scrollbar { display: none; }
        .cat-item { 
            padding: 8px 18px; 
            background: #1a1a1a; 
            border-radius: 12px; 
            white-space: nowrap; 
            font-weight: 700; 
            border: 1px solid #333; 
            color: #666; 
            font-size: 0.85rem;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cat-item.active { 
            background: var(--neon-purple); 
            color: #fff; 
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
            transform: scale(1.05);
        }

        /* شبكة المنتجات - استغلال المساحة */
        .products-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            padding: 12px; 
        }
        .p-card { 
            background: var(--surface); 
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid #222; 
            transition: 0.3s;
        }
        .p-card img { width: 100%; height: 130px; object-fit: cover; border-bottom: 2px solid var(--neon-cyan); }
        .p-card-body { padding: 10px; text-align: center; }
        .p-card-body h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; color: #efefef; }
        
        .btn-action { 
            width: 100%; 
            padding: 10px; 
            border-radius: 12px; 
            border: none;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            color: #000; 
            font-weight: 900; 
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0, 242, 255, 0.2);
        }

        /* ناف بار سفلي شيك */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; left: 0; right: 0; 
            background: rgba(10, 10, 10, 0.95); 
            backdrop-filter: blur(10px);
            display: flex; 
            justify-content: space-around; 
            padding: 12px; 
            border-top: 1px solid #222; 
            z-index: 1000;
        }
        .nav-link { color: #555; text-decoration: none; font-weight: 700; font-size: 0.85rem; text-align: center; }
        .nav-link.active { color: var(--neon-cyan); text-shadow: var(--glow); }

        /* المودالات */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.85); 
            z-index: 2000; 
            align-items: flex-end; 
        }
        .modal-box { 
            background: #0f0f0f; 
            width: 100%; 
            border-radius: 25px 25px 0 0; 
            padding: 25px; 
            border-top: 3px solid var(--neon-purple); 
        }
        
        input, select { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            background: #1a1a1a; 
            border: 1px solid #333; 
            color: #fff; 
            margin-bottom: 12px; 
            outline: none; 
            font-size: 0.95rem;
        }

        .admin-section { background: #080808; padding: 15px; border-radius: 15px; border: 1px dashed var(--neon-purple); margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-text" id="logoAdmin">نجدة أوردر</div>
        <div class="user-tag">مصطفى حجازي ⚡</div>
    </header>

    <div id="shopPage" class="page">
        <div class="cats-bar" id="catsContainer"></div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div id="cartPage" class="page" style="display:none; padding:15px;">
        <h2 style="margin-bottom:15px; color: var(--neon-cyan);">طلباتك 🛒</h2>
        <div id="cartItems"></div>
        <div id="orderForm" style="display:none; margin-top:20px;">
            <input type="text" id="uName" placeholder="الاسم بالكامل">
            <input type="tel" id="uPhone" placeholder="رقم الموبايل">
            <input type="text" id="uAddr" placeholder="العنوان بالتفصيل">
            <button class="btn-action" style="padding:18px; font-size:1.1rem;" onclick="sendOrder()">إرسال الطلب لنجدة 🚀</button>
        </div>
    </div>

    <div id="adminPage" class="page" style="display:none; padding:15px;">
        <div class="admin-section">
            <h3 style="margin-bottom:10px;">📂 إضافة قسم</h3>
            <div style="display:flex; gap:5px;">
                <input type="text" id="newCatInput" placeholder="اسم القسم">
                <button onclick="addCategory()" style="background:var(--neon-cyan); border:none; border-radius:12px; padding:0 15px; font-weight:900;">+</button>
            </div>
        </div>
        <div class="admin-section">
            <h3 style="margin-bottom:10px;">✨ إضافة منتج</h3>
            <input type="text" id="pTitle" placeholder="اسم الصنف">
            <select id="pCatSelect"></select>
            <input type="file" id="pImgInput" accept="image/*" onchange="handleImg(this)">
            <button class="btn-action" onclick="saveProduct()">نشر المنتج 🚀</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-link active" id="btnShop" onclick="nav('shop')">🏠 المتجر</a>
        <a href="#" class="nav-link" id="btnCart" onclick="nav('cart')">🛒 السلة</a>
        <a href="#" class="nav-link" id="btnAdmin" style="display:none;" onclick="nav('admin')">🛠 الإدارة</a>
    </nav>

    <div class="modal-overlay" id="orderModal">
        <div class="modal-box">
            <h3 id="mTitle" style="color:var(--neon-cyan); margin-bottom:15px; font-size:1.3rem;"></h3>
            <input type="text" id="mQty" placeholder="الكمية (مثلاً: كيلو، علبة)">
            <input type="text" id="mNote" placeholder="مكان محدد؟ (اختياري)">
            <button class="btn-action" onclick="confirmCart()">أضف للسلة 🛒</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#555; margin-top:15px;">إلغاء</button>
        </div>
    </div>

    <script>
        // تكوين Firebase الخاص بك
        const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cats = [], products = [], cart = [], selectedP = null, tempImg = "";

        // دخول الإدارة السري (4 ثواني)
        let pressTimer;
        document.getElementById('logoAdmin').addEventListener('touchstart', () => {
            pressTimer = setTimeout(() => {
                if(prompt("باسورد الأدمين:") === "135790") {
                    document.getElementById('btnAdmin').style.display = 'block';
                    nav('admin');
                }
            }, 4000);
        });
        document.getElementById('logoAdmin').addEventListener('touchend', () => clearTimeout(pressTimer));

        function init() {
            db.collection("categories").onSnapshot(s => {
                cats = []; s.forEach(d => cats.push({id: d.id, ...d.data()}));
                renderCats();
            });
            db.collection("products").orderBy("createdAt", "desc").onSnapshot(s => {
                products = []; s.forEach(d => products.push({id: d.id, ...d.data()}));
                renderProducts();
            });
        }

        function renderCats() {
            const container = document.getElementById('catsContainer');
            const select = document.getElementById('pCatSelect');
            container.innerHTML = `<div class="cat-item active" onclick="filterBy('الكل', this)">الكل</div>` + 
                                cats.map(c => `<div class="cat-item" onclick="filterBy('${c.name}', this)">${c.name}</div>`).join('');
            select.innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        function filterBy(name, el) {
            document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            renderProducts(name);
        }

        function renderProducts(filter = 'الكل') {
            const grid = document.getElementById('productsGrid'); grid.innerHTML = "";
            products.filter(p => filter === 'الكل' || p.cat === filter).forEach(p => {
                grid.innerHTML += `
                    <div class="p-card">
                        <img src="${p.img}">
                        <div class="p-card-body">
                            <h4>${p.title}</h4>
                            <button class="btn-action" onclick='openM(${JSON.stringify(p)})'>اطلب</button>
                        </div>
                    </div>`;
            });
        }

        function openM(p) { selectedP = p; document.getElementById('mTitle').innerText = p.title; document.getElementById('orderModal').style.display='flex'; }
        function closeModal() { document.getElementById('orderModal').style.display='none'; }

        function confirmCart() {
            cart.push({ title: selectedP.title, qty: document.getElementById('mQty').value, note: document.getElementById('mNote').value });
            document.getElementById('mQty').value = ""; document.getElementById('mNote').value = "";
            closeModal(); alert("تمت الإضافة ✅");
        }

        function sendOrder() {
            const n = document.getElementById('uName').value, p = document.getElementById('uPhone').value, a = document.getElementById('uAddr').value;
            if(!n || !p || !a) return alert("البيانات ناقصة!");

            let msg = `*✨ طلب جديد من نجدة أوردر ✨*\n*بواسطة: مصطفى حجازي ⚡*\n━━━━━━━━━━━━━━\n\n`;
            cart.forEach((item, idx) => {
                msg += `*${idx+1}️⃣ مـنـتـج سـريـع 📦*\n🔹 الصنف: ${item.title}\n⚖️ الكمية: ${item.qty}\n📍 من: ${item.note || 'أي مكان'}\n----------------------------\n`;
            });
            msg += `\n*👤 بيانات العميل:*\n🔸 الاسم: ${n}\n📞 الهاتف: ${p}\n🏠 العنوان: ${a}`;
            
            window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);

            // تصفير الموقع بعد الإرسال
            cart = [];
            document.getElementById('uName').value = ""; document.getElementById('uPhone').value = ""; document.getElementById('uAddr').value = "";
            nav('shop');
            alert("تم إرسال الطلب وتصفير السلة ✅");
        }

        async function addCategory() {
            const val = document.getElementById('newCatInput').value;
            if(val) await db.collection("categories").add({ name: val });
            document.getElementById('newCatInput').value = "";
        }

        function handleImg(el) {
            const reader = new FileReader(); reader.readAsDataURL(el.files[0]);
            reader.onload = (e) => tempImg = e.target.result;
        }

        async function saveProduct() {
            const t = document.getElementById('pTitle').value, c = document.getElementById('pCatSelect').value;
            if(t && tempImg) {
                await db.collection("products").add({ title: t, cat: c, img: tempImg, createdAt: new Date() });
                alert("تم النشر بنجاح 🚀");
                document.getElementById('pTitle').value = "";
            }
        }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display='none');
            document.getElementById(id+'Page').style.display='block';
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById('btn'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('active');
            if(id === 'cart') {
                const list = document.getElementById('cartItems');
                list.innerHTML = cart.map(i => `<div style="background:#1a1a1a; padding:12px; border-radius:12px; margin-bottom:10px; border-right:4px solid var(--neon-purple)"><b>${i.title}</b> - ${i.qty}</div>`).join('');
                document.getElementById('orderForm').style.display = cart.length ? 'block' : 'none';
            }
        }

        init();
    </script>
</body>
</html>
