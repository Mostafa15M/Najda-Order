<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #16161a; --danger: #ff3131; --success: #00ff88; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; overflow-x: hidden; }

        /* أولاً: الهيدر النيون الكامل */
        header { 
            padding: 15px; background: #000; border-bottom: 2px solid var(--main); 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
        .neon-logo { 
            width: 45px; height: 45px; border: 2px solid var(--main); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 0 10px var(--main), inset 0 0 5px var(--main);
            color: var(--main); font-weight: 900; text-shadow: 0 0 5px var(--main);
        }
        .neon-name { 
            color: #fff; text-shadow: 0 0 10px var(--sec), 0 0 20px var(--sec); 
            font-weight: 900; font-size: 1.1rem; cursor: pointer;
        }
        .header-title {
            color: var(--main); font-weight: 900; text-shadow: 0 0 10px var(--main);
        }

        /* ثالثاً: إعلان العرض */
        .promo-banner {
            background: linear-gradient(90deg, var(--main), var(--sec));
            padding: 12px; text-align: center; font-weight: 900; border-radius: 15px;
            margin: 15px; font-size: 0.85rem; box-shadow: 0 0 15px rgba(189, 0, 255, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* الصفحات والـ Modals */
        .page { display: none; padding: 15px; }
        .page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 25px; border: 2px solid var(--main); width: 100%; max-width: 400px; box-shadow: 0 0 25px var(--main); text-align: center; }

        input, textarea, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #222; background: #000; color: #fff; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--main); box-shadow: 0 0 10px var(--main); }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; box-shadow: 0 4px 15px rgba(189, 0, 255, 0.3); }

        /* الكروت */
        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .p-card { background: var(--card); padding: 10px; border-radius: 20px; border: 1px solid #222; text-align: center; position: relative; }
        .p-card img { width: 100%; height: 110px; border-radius: 15px; object-fit: cover; margin-bottom: 8px; }

        /* القائمة السفلية */
        nav { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #222; z-index: 1000; }
        .nav-link { color: #555; text-decoration: none; text-align: center; font-size: 0.75rem; flex: 1; }
        .nav-link.active { color: var(--main); text-shadow: 0 0 5px var(--main); }
        .nav-link span { font-size: 1.5rem; display: block; }

        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }
    </style>
</head>
<body>

<header>
    <div class="header-title">نجدة أوردر ⚡</div>
    <div class="neon-logo">⚡</div>
    <div class="neon-name" id="adminTrigger" onmousedown="startPress()" onmouseup="endPress()" ontouchstart="startPress()" ontouchend="endPress()">مصطفى حجازي</div>
</header>

<div class="promo-banner">🎁 عرض الحجازي: اطلب 9 أوردرات والعاشر توصيله مجاني! 🎁</div>

<div id="orderModal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modalTitle" style="color:var(--main); margin-bottom:15px;"></h3>
        <input type="number" id="modalQty" value="1" min="1" style="text-align:center; font-size:1.3rem;">
        <textarea id="modalNotes" placeholder="اكتب ملاحظاتك هنا (مثلاً: بدون شطة، السكر خفيف...)"></textarea>
        <button class="btn btn-main" onclick="confirmOrder()">إضافة للسلة 🛒</button>
        <button class="btn" style="background:transparent; color:#555;" onclick="closeModal('orderModal')">إلغاء</button>
    </div>
</div>

<div id="passModal" class="modal-overlay">
    <div class="modal-content" style="border-color:var(--sec); box-shadow:0 0 20px var(--sec);">
        <h3 style="color:var(--sec)">🔐 شفرة الإدارة</h3>
        <input type="password" id="adminPass" placeholder="••••" style="text-align:center; font-size:1.5rem; letter-spacing:5px;">
        <button class="btn btn-main" onclick="checkAdmin()">دخول</button>
    </div>
</div>

<div id="home" class="page active">
    <div id="catFilters" style="display:flex; gap:10px; overflow-x:auto; margin-bottom:15px; padding-bottom:5px;"></div>
    <div class="prod-grid" id="prodsHome"></div>
</div>

<div id="special" class="page">
    <div style="background:var(--card); padding:20px; border-radius:25px; border:1px solid var(--main);">
        <h3 style="color:var(--main); text-align:center; margin-bottom:15px;">📦 توصيل مستلزمات شخصية</h3>
        <input type="text" id="spWhat" placeholder="إيه الحاجة اللي هنوصلها؟">
        <input type="text" id="spFrom" placeholder="مكان الاستلام (منين؟)">
        <input type="text" id="spTo" placeholder="مكان التسليم (لفين؟)">
        <input type="tel" id="spPhone" placeholder="رقم موبايلك">
        <button class="btn btn-main" onclick="sendSpecial()">إرسال الطلب الآن 🚀</button>
    </div>
</div>

<div id="cart" class="page">
    <div style="background:var(--card); padding:20px; border-radius:25px; border:1px solid #222;">
        <h3 style="color:var(--main); text-align:center; margin-bottom:15px;">🛒 مراجعة السلة</h3>
        <div id="cartList" style="margin-bottom:20px;"></div>
        
        <input type="text" id="uName" placeholder="الاسم بالكامل">
        <input type="text" id="uAddress" placeholder="العنوان بالتفصيل">
        <input type="tel" id="uPhone" placeholder="رقم الهاتف" oninput="checkLoyalty(this.value)">
        
        <div id="loyaltyStatus" style="text-align:center; margin:10px 0;"></div>
        
        <button class="btn btn-main" onclick="sendFullCart()">تأكيد وإرسال واتساب 💬</button>
    </div>
</div>

<div id="admin" class="page">
    <button class="btn btn-main" style="margin-bottom:15px;" onclick="showOrders()">🔔 الطلبات الواردة</button>
    </div>

<div id="ordersModal" class="modal-overlay" style="align-items:flex-start; overflow-y:auto;">
    <div class="modal-content" style="max-width:500px; margin-top:50px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h3 style="color:var(--sec)">🔔 الطلبات الحديثة</h3>
            <span onclick="closeModal('ordersModal')" style="color:red; cursor:pointer; font-size:1.5rem;">✕</span>
        </div>
        <div id="ordersList"></div>
    </div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><span>🏠</span>الرئيسية</a>
    <a href="#" class="nav-link" onclick="go('special', this)"><span>📦</span>طلب خاص</a>
    <a href="#" class="nav-link" onclick="go('cart', this)"><span>🛒</span>السلة</a>
    <a href="#" class="nav-link admin-only" onclick="go('admin', this)"><span>⚙️</span>الإدارة</a>
</nav>

<script>
    // Firebase Setup
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    let currentProd = "", cart = [], pressTimer, userOrdersCount = 0;

    // التنقل والضغطة المطولة
    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
    }
    function startPress() { pressTimer = setTimeout(() => { document.getElementById('passModal').style.display='flex'; }, 1500); }
    function endPress() { clearTimeout(pressTimer); }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
    function checkAdmin() { if(document.getElementById('adminPass').value==='135790'){ document.body.classList.add('admin-mode'); closeModal('passModal'); } }

    // جلب المنتجات
    db.collection("products").onSnapshot(s => {
        document.getElementById('prodsHome').innerHTML = s.docs.map(d => `
            <div class="p-card" onclick="openOrderModal('${d.data().title}')">
                <img src="${d.data().img}">
                <h5>${d.data().title}</h5>
                <button class="btn-main" style="padding:5px; font-size:0.7rem; margin-top:5px;">اطلب ⚡</button>
            </div>`).join('');
    });

    function openOrderModal(t) { currentProd = t; document.getElementById('modalTitle').innerText = t; document.getElementById('orderModal').style.display='flex'; }
    
    function confirmOrder() {
        const qty = document.getElementById('modalQty').value;
        const note = document.getElementById('modalNotes').value;
        cart.push({t: currentProd, q: qty, n: note});
        closeModal('orderModal');
        document.getElementById('modalNotes').value = "";
        renderCart();
    }

    function renderCart() {
        document.getElementById('cartList').innerHTML = cart.map((i, idx) => `
            <div style="background:#000; padding:10px; border-radius:10px; margin-bottom:5px; text-align:right; border-right:3px solid var(--main);">
                <b>${i.t}</b> (ج${i.q}) <span onclick="cart.splice(${idx},1);renderCart()" style="color:red; float:left;">✕</span>
                ${i.n ? `<div style="font-size:0.75rem; color:#888;">📝 ${i.n}</div>` : ''}
            </div>`).join('');
    }

    // نظام الولاء: فحص عدد الأوردرات
    async function checkLoyalty(phone) {
        if(phone.length >= 11) {
            const snap = await db.collection("orders").where("p", "==", phone).get();
            userOrdersCount = snap.size;
            const statusDiv = document.getElementById('loyaltyStatus');
            statusDiv.innerHTML = `<span style="background:var(--sec); padding:2px 10px; border-radius:10px; font-size:0.8rem;">إجمالي أوردراتك السابقة: ${userOrdersCount}</span>`;
            
            if(userOrdersCount > 0 && (userOrdersCount + 1) % 10 === 0) {
                statusDiv.innerHTML += `<div style="color:var(--success); font-weight:bold; margin-top:5px;">🎉 الأوردر القادم مجاني!</div>`;
            }
        }
    }

    async function sendFullCart() {
        const name = document.getElementById('uName').value, addr = document.getElementById('uAddress').value, phone = document.getElementById('uPhone').value;
        if(!name || !addr || !phone || cart.length === 0) return alert("كمل بياناتك يا درش!");

        let isFree = (userOrdersCount > 0 && (userOrdersCount + 1) % 10 === 0);
        if(isFree) alert("مبروك! التوصيل مجاني لهذا الأوردر 🎁");

        await db.collection("orders").add({ n: name, p: phone, addr: addr, items: cart, isFree: isFree, createdAt: new Date() });

        let msg = `🛒 أوردر جديد ${isFree ? '(توصيل مجاني 🎁)' : ''}\n👤 الاسم: ${name}\n📍 العنوان: ${addr}\n📞 الهاتف: ${phone}\n📦 الأصناف:\n` + cart.map(i=>`- ${i.t} (ج${i.q}) ${i.n?'['+i.n+']':''}`).join('\n');
        if(isFree) msg += `\n\n🆔 كود: 10MostafaHegazyFree10`;

        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
        cart = []; renderCart();
    }

    function showOrders() {
        document.getElementById('ordersModal').style.display='flex';
        db.collection("orders").orderBy("createdAt", "desc").onSnapshot(s => {
            document.getElementById('ordersList').innerHTML = s.docs.map(d => {
                const o = d.data();
                return `<div style="background:#000; border:1px solid ${o.isFree?'var(--success)':'var(--sec)'}; padding:10px; border-radius:15px; margin-bottom:10px; text-align:right;">
                    <b>${o.n}</b> | ${o.p} ${o.isFree?'<span style="color:var(--success)">[مجاني]</span>':''}<br>
                    <small style="color:var(--main)">${o.items.map(i=>i.t).join(', ')}</small>
                    <div style="margin-top:10px; display:flex; gap:5px;">
                        <button class="btn-main" style="padding:5px; font-size:0.7rem;" onclick="db.collection('orders').doc('${d.id}').delete()">موافقة وحذف ✅</button>
                        <button class="btn-danger" style="padding:5px; font-size:0.7rem;" onclick="db.collection('orders').doc('${d.id}').delete()">حذف ❌</button>
                    </div>
                </div>`;
            }).join('');
        });
    }
</script>
</body>
</html>
