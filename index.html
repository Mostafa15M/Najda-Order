<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nagda Order Elite | Mostafa Hegazy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #00d4ff;
            --accent: #ff007a;
            --bg: #08080c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --glow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg); 
            color: #fff; 
            padding-bottom: 120px; 
            overflow-x: hidden;
            background: radial-gradient(circle at top right, #1a1a2e, #08080c);
            min-height: 100vh;
        }

        /* أنيميشن للخلفية */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(125deg, transparent 40%, rgba(138, 43, 226, 0.05) 50%, transparent 60%);
            background-size: 200% 200%; animation: moveBG 8s linear infinite; z-index: -1;
        }
        @keyframes moveBG { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* الهيدر الأسطوري */
        header { 
            padding: 50px 20px; text-align: center; 
            animation: fadeInDown 1s ease;
        }
        .logo h1 { 
            font-size: 3.2rem; font-weight: 900; letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff 30%, var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.4));
        }
        .hegazy-tag { 
            font-size: 0.8rem; letter-spacing: 6px; color: var(--primary); 
            font-weight: 700; margin-top: 10px; text-transform: uppercase;
        }

        /* كارت المشوار المطور */
        .hero-action { 
            margin: 0 20px 30px; padding: 30px; border-radius: 35px; 
            background: linear-gradient(145deg, rgba(138, 43, 226, 0.2), rgba(0, 212, 255, 0.05));
            border: 1px solid var(--border); backdrop-filter: blur(15px);
            box-shadow: var(--glow); position: relative; overflow: hidden;
            transition: 0.3s; cursor: pointer;
        }
        .hero-action:active { transform: scale(0.96); }

        /* الأقسام بشكل رايق */
        .cats-bar { display: flex; gap: 15px; overflow-x: auto; padding: 10px 20px 25px; scrollbar-width: none; }
        .pill { 
            padding: 12px 30px; background: var(--card-bg); border-radius: 20px; 
            font-size: 0.9rem; font-weight: 700; white-space: nowrap; 
            border: 1px solid var(--border); transition: 0.4s; color: rgba(255,255,255,0.6);
        }
        .pill.active { 
            background: var(--primary); color: #fff; border: none;
            box-shadow: 0 10px 20px rgba(138, 43, 226, 0.4); transform: translateY(-3px);
        }

        /* جريد المنتجات */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 20px; }
        .p-card { 
            background: var(--card-bg); border-radius: 30px; overflow: hidden; 
            border: 1px solid var(--border); transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            animation: fadeInUp 0.8s ease backwards;
        }
        .p-card:active { transform: translateY(-10px); border-color: var(--secondary); }
        .p-card img { width: 100%; height: 170px; object-fit: cover; filter: brightness(0.9); transition: 0.5s; }
        .p-card:hover img { filter: brightness(1.1) scale(1.05); }
        .p-card-info { padding: 15px; text-align: center; }
        .p-card-info h4 { font-size: 1.1rem; margin-bottom: 12px; font-weight: 700; letter-spacing: -0.5px; }

        /* أزرار ميتاليك نيون */
        .btn-main { 
            width: 100%; padding: 15px; border-radius: 18px; border: none; 
            font-weight: 900; cursor: pointer; font-size: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #fff; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn-main:active { transform: scale(0.95); opacity: 0.8; }

        /* ناف بار زجاجي سائل */
        .bottom-nav { 
            position: fixed; bottom: 30px; left: 25px; right: 25px; 
            background: rgba(15, 15, 25, 0.7); backdrop-filter: blur(25px);
            border-radius: 30px; display: flex; justify-content: space-around; padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1); z-index: 2000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .nav-item { color: rgba(255,255,255,0.4); font-size: 0.95rem; font-weight: 700; transition: 0.3s; }
        .nav-item.active { color: var(--secondary); transform: translateY(-5px); }

        /* مودال بتصميم فخم */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; align-items: flex-end; }
        .modal-content { 
            background: #0f0f18; width: 100%; border-radius: 45px 45px 0 0; padding: 40px 25px;
            border-top: 3px solid var(--primary); animation: slideUp 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        input, textarea { 
            width: 100%; padding: 18px; border-radius: 22px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border); color: #fff; margin-bottom: 15px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--secondary); background: rgba(255,255,255,0.07); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .badge { background: var(--accent); color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; position: absolute; top: -15px; right: -10px; box-shadow: 0 0 10px var(--accent); }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="logo">
            <h1 onclick="secretLogin()">نجدة<span>.</span>ORDER</h1>
            <p class="hegazy-tag">Mostafa Hegazy | Elite Edition</p>
        </div>
    </header>

    <div id="shopPage" class="page">
        <div class="hero-action" onclick="openSpecial()">
            <h2 style="color:var(--secondary); font-weight: 900;">🚀 مشوار خاص / مستلزمات</h2>
            <p style="color:rgba(255,255,255,0.5); font-size: 0.85rem; margin-top:8px;">توصيل أمان بنظام الـ VIP لأي مكان</p>
        </div>
        
        <div class="cats-bar" id="catsBar"></div>
        
        <div id="loading" style="text-align:center; padding:50px;">
            <div style="width:40px; height:40px; border:3px solid var(--secondary); border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div>
        </div>

        <div class="grid" id="shopGrid"></div>
    </div>

    <div id="cartPage" class="page" style="display:none; padding:20px;">
        <h2 style="margin-bottom:30px; font-weight: 900; font-size: 2rem;">طلباتك الرايقة 🛒</h2>
        <div id="cartList"></div>
        <div id="checkoutForm" style="display:none; margin-top:40px;">
            <input type="text" id="uName" placeholder="👤 اسمك بالكامل">
            <input type="tel" id="uPhone" placeholder="📞 رقم موبايلك">
            <input type="text" id="uAddr" placeholder="📍 عنوانك بالتفصيل">
            <button class="btn-main" style="padding:22px;" onclick="completeOrder()">إرسال الطلب للوحش 🚀</button>
        </div>
    </div>

    <div id="adminPage" class="page" style="display:none; padding:25px;">
        <h2 style="color:var(--primary); margin-bottom:20px;">لوحة الإدارة 🔐</h2>
        <div style="background:var(--card-bg); padding:20px; border-radius:25px; border:1px solid var(--border);">
            <input type="text" id="pTitle" placeholder="اسم المنتج">
            <input type="file" id="pImgInput" accept="image/*" onchange="imgProcess(this)">
            <select id="pCatSelect" style="width:100%; padding:15px; background:#000; color:#fff; border-radius:15px; margin-bottom:15px;"></select>
            <button class="btn-main" onclick="saveProduct()">إضافة المنتج للسوق ✅</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="btnShop" onclick="nav('shop')">🏠 السوق</div>
        <div class="nav-item" id="btnCart" onclick="nav('cart')" style="position:relative;">🛒 السلة <span id="badge" class="badge" style="display:none">0</span></div>
    </nav>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="mTitle" style="color:var(--secondary); margin-bottom:25px; font-weight: 900;"></h2>
            <div id="stdFields">
                <div style="text-align:center; font-size:3rem; color:#fff; font-weight:900; margin-bottom:15px;" id="qtyText">0.25 كيلو</div>
                <input type="range" id="qtySlider" min="0.25" max="10" step="0.25" oninput="handleSlider(this.value)" style="accent-color: var(--primary);">
            </div>
            <div id="spcFields" style="display:none;">
                <input type="text" id="mFrom" placeholder="📍 الاستلام منين؟">
                <input type="text" id="mToWho" placeholder="👤 هنسلمها لمين؟">
                <input type="text" id="mToWhere" placeholder="🏠 العنوان بالتفصيل؟">
                <textarea id="mDesc" placeholder="📦 إيه هي الحاجة؟"></textarea>
            </div>
            <button class="btn-main" onclick="confirmAdd()">أضف للسلة 🛒</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:rgba(255,255,255,0.3); margin-top:25px;">تراجع</button>
        </div>
    </div>

    <script>
        // الكود البرمجي (Firebase)
        const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let products = [], cats = [], cart = [], selectedItem = null, tempImg = "";

        // دخول الإدارة السري (ضغط مطول على اللوجو)
        let pressTimer;
        function secretLogin() { 
            if(prompt("كلمة السر يا درش:") === "135790") {
                document.getElementById('adminPage').style.display='block';
                nav('admin');
            }
        }

        function fetchAll() {
            db.collection("categories").onSnapshot(snap => {
                cats = []; snap.forEach(d => cats.push({id: d.id, ...d.data()}));
                renderCats();
            });
            db.collection("products").orderBy("createdAt", "desc").onSnapshot(snap => {
                products = []; snap.forEach(d => products.push({id: d.id, ...d.data()}));
                document.getElementById('loading').style.display = 'none';
                renderShop();
            });
        }

        function renderCats() {
            const bar = document.getElementById('catsBar');
            bar.innerHTML = `<div class="pill active" onclick="renderShop('الكل')">الكل</div>` + 
                            cats.map(c => `<div class="pill" onclick="renderShop('${c.name}')">${c.name}</div>`).join('');
            document.getElementById('pCatSelect').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        function renderShop(f = 'الكل') {
            const grid = document.getElementById('shopGrid'); grid.innerHTML = "";
            products.filter(p => f === 'الكل' || p.cat === f).forEach((p, idx) => {
                grid.innerHTML += `
                    <div class="p-card" style="animation-delay: ${idx * 0.1}s">
                        <img src="${p.img}">
                        <div class="p-card-info">
                            <h4>${p.title}</h4>
                            <button class="btn-main" onclick='openModal(${JSON.stringify(p)})'>اطلب</button>
                        </div>
                    </div>`;
            });
        }

        function openModal(item) {
            selectedItem = item; document.getElementById('mTitle').innerText = item.title;
            document.getElementById('stdFields').style.display='block'; document.getElementById('spcFields').style.display='none';
            document.getElementById('modal').style.display='flex';
        }

        function openSpecial() {
            selectedItem = null; document.getElementById('mTitle').innerText = "مشوار خاص 🚀";
            document.getElementById('stdFields').style.display='none'; document.getElementById('spcFields').style.display='block';
            document.getElementById('modal').style.display='flex';
        }

        function handleSlider(v) { document.getElementById('qtyText').innerText = v + " " + (selectedItem ? selectedItem.unit : ""); }

        function confirmAdd() {
            let data = selectedItem ? 
                { name: selectedItem.title, qty: document.getElementById('qtyText').innerText } :
                { name: "🚀 مشوار خاص", from: document.getElementById('mFrom').value, toWho: document.getElementById('mToWho').value, toWhere: document.getElementById('mToWhere').value, desc: document.getElementById('mDesc').value };
            cart.push(data);
            updateBadge(); closeModal();
        }

        function updateBadge() { 
            const b = document.getElementById('badge'); b.innerText = cart.length; b.style.display = cart.length ? 'block' : 'none'; 
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            if(!cart.length) { list.innerHTML = "<p style='text-align:center; opacity:0.3'>السلة فاضية..</p>"; document.getElementById('checkoutForm').style.display='none'; return; }
            document.getElementById('checkoutForm').style.display='block';
            list.innerHTML = cart.map((i, idx) => `
                <div style="background:var(--card-bg); padding:20px; border-radius:25px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border)">
                    <div><b>${i.name}</b><br><small style="color:var(--secondary)">${i.qty || 'مشوار خاص'}</small></div>
                    <button onclick="cart.splice(${idx},1); renderCart(); updateBadge();" style="background:none; border:none; color:var(--accent); font-weight:bold;">حذف</button>
                </div>`).join('');
        }

        function completeOrder() {
            const n = document.getElementById('uName').value, p = document.getElementById('uPhone').value, a = document.getElementById('uAddr').value;
            if(!n || !p || !a) return alert("البيانات ناقصة!");

            let msg = `*✨ نـجـدة أوردر | ELITE 🚀*\n*بـإشـراف: مـصـطـفى حـجـازي ⚡*\n━━━━━━━━━━━━━━\n\n`;
            cart.forEach((i, idx) => {
                if(i.name === "🚀 مشوار خاص") {
                    msg += `*${idx+1}️⃣ مشوار خاص 🚀*\n📍 من: ${i.from}\n👤 لـ: ${i.toWho}\n🏠 العنوان: ${i.toWhere}\n📦 الحاجة: ${i.desc}\n`;
                } else {
                    msg += `*${idx+1}️⃣ ${i.name}* 🛒\n⚖️ الكمية: ${i.qty}\n`;
                }
                msg += `----------------------------\n`;
            });
            msg += `\n*👤 بيانات العميل:*\n📝 الاسم: ${n}\n📞 الهاتف: ${p}\n📍 العنوان: ${a}`;
            window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
        }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id + 'Page').style.display = 'block';
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('btn' + id.charAt(0).toUpperCase() + id.slice(1)).classList.add('active');
            if(id === 'cart') renderCart();
        }

        async function imgProcess(el) {
            const reader = new FileReader(); reader.readAsDataURL(el.files[0]);
            reader.onload = (e) => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 300;
                    canvas.getContext('2d').drawImage(img, 0, 0, 400, 300);
                    tempImg = canvas.toDataURL('image/jpeg', 0.6);
                };
            };
        }

        async function saveProduct() {
            const t = document.getElementById('pTitle').value, c = document.getElementById('pCatSelect').value;
            await db.collection("products").add({ title: t, cat: c, img: tempImg, unit: "كيلو", createdAt: new Date() });
            alert("تم النشر ✅");
        }

        function closeModal() { document.getElementById('modal').style.display='none'; }
        fetchAll();
    </script>
</body>
</html>
