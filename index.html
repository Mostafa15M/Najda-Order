<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر | مصطفى حجازي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #9d50bb; --bg: #0a0a0c; --card: #16161a; --danger: #ff3131; --gold: #ffd700; --success: #00c851; --neon: 0 0 15px #00d2ff, 0 0 30px #00d2ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; overflow-x: hidden; }

        /* الهيدر الأسطوري */
        header { padding: 15px 12px; background: #000; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px; }
        .right-brand { font-size: 1.1rem; font-weight: 900; color: var(--main); flex: 1; text-align: right; }
        .left-name { font-size: 0.85rem; color: var(--sec); font-weight: 900; flex: 1; text-align: left; }
        
        /* اللوجو النيون (الصاعقة) */
        .center-logo {
            width: 50px; height: 50px; background: #000; border: 2px solid var(--main); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; font-size: 1.5rem; color: var(--main);
            box-shadow: var(--neon); animation: pulseNeon 2s infinite; cursor: pointer; user-select: none;
        }
        @keyframes pulseNeon { 0%, 100% { box-shadow: var(--neon); transform: scale(1); } 50% { box-shadow: 0 0 25px #00d2ff, 0 0 50px #00d2ff; transform: scale(1.05); } }
        .sub-title-box { text-align: center; border-top: 1px solid #1a1a1a; padding-top: 4px; }
        .sub-title { font-size: 0.8rem; color: #888; font-weight: bold; }

        /* شريط الهدية */
        .gift-ticker { background: linear-gradient(90deg, #b8860b, var(--gold), #b8860b); color: #000; padding: 10px 0; font-weight: 900; font-size: 0.85rem; margin: 10px 0; overflow: hidden; white-space: nowrap; }
        .ticker-text { display: inline-block; animation: scroll 15s linear infinite; }
        @keyframes scroll { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        /* الصفحات */
        .page { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* التحكم في الإدارة */
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }

        /* الكروت والقوائم */
        .card { background: var(--card); padding: 15px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #222; }
        input, select, textarea { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; font-size: 1rem; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; }
        .btn-del { background: var(--danger); color: #fff; padding: 5px 12px; font-size: 0.75rem; border-radius: 8px; }

        /* المتجر */
        .cats-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .cat-chip { padding: 8px 20px; background: var(--card); border-radius: 50px; white-space: nowrap; font-size: 0.8rem; border: 1px solid #333; }
        .cat-chip.active { background: var(--main); color: #000; font-weight: bold; }
        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .p-item { background: var(--card); padding: 12px; border-radius: 20px; text-align: center; border: 1px solid #222; }
        .p-item img { width: 100%; height: 110px; border-radius: 15px; object-fit: cover; }
        .p-item b { color: var(--main); display: block; margin: 8px 0; }

        /* السلة */
        .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #000; border-radius: 10px; margin-bottom: 8px; }

        /* النافيجيشن */
        nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 12px 5px; border-top: 1px solid #222; z-index: 1000; }
        .nav-link { color: #555; text-decoration: none; text-align: center; font-size: 0.7rem; font-weight: bold; }
        .nav-link.active { color: var(--main); }
        .nav-link i { font-size: 1.3rem; display: block; margin-bottom: 4px; }
    </style>
</head>
<body id="mainBody">

<header>
    <div class="header-top">
        <div class="right-brand">نجدة أوردر ⚡</div>
        <div class="center-logo" id="adminTrigger">⚡</div>
        <div class="left-name">مصطفى حجازي</div>
    </div>
    <div class="sub-title-box">
        <span class="sub-title">توصيل مستلزمات شخصية</span>
    </div>
</header>

<div id="home" class="page active">
    <div class="gift-ticker">
        <div class="ticker-text">🎁 اطلب 9 أوردرات وهديتك مجانية في العاشر! — خدمة نجدة أوردر 24 ساعة 🎁</div>
    </div>
    <div class="cats-row" id="catsHome"></div>
    <div class="prod-grid" id="prodsHome"></div>
</div>

<div id="cart" class="page">
    <div class="card">
        <h2>🛒 سلة المشتريات</h2>
        <div id="cartItems"></div>
        <div id="cartTotal" style="margin:15px 0; color:var(--main); font-weight:900;">الإجمالي: 0 ج.م</div>
        <input type="text" id="custName" placeholder="اسمك">
        <input type="tel" id="custPhone" placeholder="رقم الموبايل">
        <textarea id="custAddr" placeholder="العنوان بالتفصيل"></textarea>
        <button class="btn btn-main" onclick="sendOrder()">تأكيد الطلب واتساب ✅</button>
    </div>
</div>

<div id="admin-orders" class="page">
    <h2 style="margin-bottom:15px; color:var(--main);">🔔 طلبات العملاء</h2>
    <div id="ordersList"></div>
</div>

<div id="admin-cats" class="page">
    <div class="card">
        <h2>📂 الأقسام</h2>
        <input type="text" id="catInp" placeholder="اسم القسم">
        <button class="btn btn-main" onclick="addC()">إضافة</button>
        <div id="catsManager" style="margin-top:10px;"></div>
    </div>
</div>

<div id="admin-prods" class="page">
    <div class="card">
        <h2>🛍️ إضافة منتج</h2>
        <input type="text" id="pT" placeholder="اسم المنتج">
        <input type="number" id="pP" placeholder="السعر">
        <select id="pCSel"></select>
        <input type="file" onchange="encode(this)">
        <button class="btn btn-main" onclick="addP()">نشر</button>
    </div>
    <div id="prodsManager"></div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><i>🏠</i>المتجر</a>
    <a href="#" class="nav-link" onclick="go('cart', this)"><i>🛒</i>السلة</a>
    <a href="#" class="nav-link admin-only" onclick="go('admin-orders', this)"><i>🔔</i>الطلبات</a>
    <a href="#" class="nav-link admin-only" onclick="go('admin-cats', this)"><i>📂</i>الأقسام</a>
    <a href="#" class="nav-link admin-only" onclick="go('admin-prods', this)"><i>⚙️</i>المنتجات</a>
</nav>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    let isAdm = false, imgD = "", cart = [];

    // نظام الحماية بكلمة السر (الضغط المطول)
    let timer;
    const trigger = document.getElementById('adminTrigger');
    trigger.addEventListener('mousedown', () => timer = setTimeout(checkPass, 3000));
    trigger.addEventListener('touchstart', () => timer = setTimeout(checkPass, 3000));
    trigger.addEventListener('mouseup', () => clearTimeout(timer));
    trigger.addEventListener('touchend', () => clearTimeout(timer));

    function checkPass() {
        const pass = prompt("أدخل كلمة السر للدخول لوضع الإدارة:");
        if (pass === "135790") {
            isAdm = true;
            document.body.classList.add('admin-mode');
            alert("مرحباً مصطفى! تم تفعيل وضع الإدارة ✅");
        } else {
            isAdm = false;
            document.body.classList.remove('admin-mode');
            alert("كلمة سر خاطئة! تم الرجوع لوضع الزبون ❌");
        }
    }

    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); el.classList.add('active');
    }

    db.collection("categories").onSnapshot(s => {
        const cats = s.docs.map(d=>({id:d.id, ...d.data()}));
        document.getElementById('catsHome').innerHTML = `<div class="cat-chip active">الكل</div>` + cats.map(c=>`<div class="cat-chip">${c.name}</div>`).join('');
        document.getElementById('pCSel').innerHTML = cats.map(c=>`<option>${c.name}</option>`).join('');
        document.getElementById('catsManager').innerHTML = cats.map(c=>`<div style="display:flex; justify-content:space-between; margin-top:10px;"><span>${c.name}</span> <button class="btn-del" onclick="delDoc('categories','${c.id}')">حذف</button></div>`).join('');
    });

    db.collection("products").orderBy("createdAt", "desc").onSnapshot(s => {
        const prods = s.docs.map(d=>({id:d.id, ...d.data()}));
        document.getElementById('prodsHome').innerHTML = prods.map(p=>`<div class="p-item"><img src="${p.img}"><h3>${p.title}</h3><b>${p.price} ج.م</b><button class="btn btn-main" style="padding:5px; font-size:0.7rem;" onclick="addCart('${p.id}')">إضافة 🛒</button></div>`).join('');
        document.getElementById('prodsManager').innerHTML = prods.map(p=>`<div class="card" style="display:flex; justify-content:space-between; align-items:center;"><span>${p.title}</span> <button class="btn-del" onclick="delDoc('products','${p.id}')">حذف</button></div>`).join('');
    });

    function addCart(id) { db.collection("products").doc(id).get().then(doc => { cart.push(doc.data()); updateCartUI(); alert("تمت الإضافة!"); }); }
    function updateCartUI() {
        const cont = document.getElementById('cartItems');
        cont.innerHTML = cart.map((item, idx) => `<div class="cart-row"><span>${item.title}</span> <b>${item.price} ج</b> <button onclick="cart.splice(${idx},1); updateCartUI()">❌</button></div>`).join('');
        const total = cart.reduce((s, i) => s + Number(i.price), 0);
        document.getElementById('cartTotal').innerText = `الإجمالي: ${total} ج.م`;
    }

    async function sendOrder() {
        const n = document.getElementById('custName').value, p = document.getElementById('custPhone').value, a = document.getElementById('custAddr').value;
        if(n && p && cart.length > 0) {
            await db.collection("orders").add({ userName: n, userPhone: p, address: a, items: cart.map(i=>i.title), createdAt: new Date() });
            window.open(`https://wa.me/201140293628?text=${encodeURIComponent("طلب جديد من: "+n+"\nالأصناف: "+cart.map(i=>i.title).join(' + '))}`);
            cart = []; updateCartUI(); go('home', document.querySelectorAll('.nav-link')[0]);
        }
    }

    db.collection("orders").orderBy("createdAt", "desc").onSnapshot(s => {
        const o = s.docs.map(d=>({id:d.id, ...d.data()}));
        document.getElementById('ordersList').innerHTML = o.map(x => `<div class="card"><b>👤 ${x.userName}</b><p>${x.items?.join(' + ')}</p><button class="btn btn-del" style="width:100%" onclick="delDoc('orders','${x.id}')">حذف</button></div>`).join('');
    });

    async function addC() { const n = document.getElementById('catInp').value; if(n) await db.collection("categories").add({name: n}); }
    async function addP() {
        const t = document.getElementById('pT').value, p = document.getElementById('pP').value, c = document.getElementById('pCSel').value;
        if(t && p && imgD) await db.collection("products").add({title: t, price: p, cat: c, img: imgD, createdAt: new Date()});
    }
    function encode(el) { const r = new FileReader(); r.onload = () => imgD = r.result; r.readAsDataURL(el.files[0]); }
    async function delDoc(col, id) { if(confirm("أكيد؟")) await db.collection(col).doc(id).delete(); }
</script>
</body>
</html>
