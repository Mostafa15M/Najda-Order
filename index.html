<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #1c1c1e; --danger: #ff453a; --success: #32d74b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; }

        header { padding: 15px 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo-text { font-weight: 900; font-size: 1.1rem; background: linear-gradient(var(--main), var(--sec)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .gift-banner { background: linear-gradient(45deg, var(--main), var(--sec)); padding: 10px; text-align: center; font-weight: bold; font-size: 0.85rem; border-radius: 12px; margin: 10px 15px; box-shadow: 0 4px 15px rgba(189,0,255,0.3); }

        nav { position: fixed; bottom: 0; width: 100%; background: #0a0a0c; border-top: 1px solid #2c2c2e; display: flex; justify-content: space-around; padding: 10px 0 25px; z-index: 3000; }
        .nav-link { color: #8e8e93; text-decoration: none; text-align: center; flex: 1; font-size: 0.8rem; }
        .nav-link i { font-size: 1.3rem; display: block; margin-bottom: 3px; }
        .nav-link.active { color: var(--main); }

        .page { display: none; padding: 0 15px; animation: slideUp 0.3s; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .p-card { background: var(--card); border-radius: 18px; overflow: hidden; border: 1px solid #2c2c2e; position: relative; }
        .p-card img { width: 100%; height: 120px; object-fit: cover; }
        .delete-btn { position: absolute; top: 8px; left: 8px; background: var(--danger); width: 25px; height: 25px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; z-index: 5; }
        .admin-mode .delete-btn { display: flex; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 4000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 360px; border: 1px solid var(--main); }
        
        .qty-input-group { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0; }
        .qty-control { background: #333; border: none; width: 45px; height: 45px; border-radius: 12px; color: white; font-size: 1.5rem; }
        #customQty { width: 100px; text-align: center; font-size: 1.2rem; font-weight: bold; background: #000; border: 1px solid var(--main); margin: 0; }

        input, textarea, select { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #333; background: #1c1c1e; color: #fff; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: white; }
        
        .admin-section { background: #151517; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px dashed #444; }
        .hidden-admin { display: none !important; }
        .admin-mode .hidden-admin { display: block !important; }
        .cat-tag { background: #333; padding: 4px 10px; border-radius: 8px; font-size: 0.7rem; color: var(--main); margin-bottom: 5px; display: inline-block; }
    </style>
</head>
<body class="">

<header>
    <div class="logo-text">نجدة أوردر ⚡</div>
    <div class="admin-btn" ondblclick="toggleAdmin()">مصطفى حجازي</div>
</header>

<div class="gift-banner">🎁 اطلب 9 أوردرات والعاشر توصيله مجاناً! 🎁</div>

<div id="qtyModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">اسم المنتج</h3>
        <p style="font-size: 0.8rem; color: #8e8e93; margin-top: 5px;">حدد الكمية (مثلاً: 1، نص، ربع)</p>
        <div class="qty-input-group">
            <button class="qty-control" onclick="stepQty(-1)">-</button>
            <input type="text" id="customQty" value="1">
            <button class="qty-control" onclick="stepQty(1)">+</button>
        </div>
        <textarea id="pNote" placeholder="أي ملاحظات؟ (سبايسي، بدون بصل..)"></textarea>
        <button class="btn btn-main" onclick="confirmAdd()">إضافة للسلة ✅</button>
        <p onclick="closeModal()" style="margin-top:15px; color:#8e8e93; font-size:0.8rem; cursor:pointer;">إلغاء</p>
    </div>
</div>

<div id="home" class="page active">
    <div id="categoriesFilter" style="display:flex; gap:10px; overflow-x:auto; padding: 10px 0;"></div>
    <div id="prodsHome" class="prod-grid"></div>
</div>

<div id="special" class="page">
    <h3 style="text-align:center; margin: 20px 0;">📦 شحن وتوصيل خاص</h3>
    <input type="text" id="spDetails" placeholder="الأغراض المطلوب نقلها">
    <input type="text" id="spFrom" placeholder="نقطة الاستلام (منين؟)">
    <input type="text" id="spTo" placeholder="نقطة التسليم (لفين؟)">
    <input type="tel" id="spPhone" placeholder="رقم الموبايل">
    <button class="btn btn-main" onclick="sendSpecialOrder()">طلب مندوب شحن 🚀</button>
</div>

<div id="cart" class="page">
    <h3 style="margin: 20px 0;">🛒 طلباتك</h3>
    <div id="cartList"></div>
    <div id="loyaltyStatus" style="display:none; background:#1c1c1e; padding:15px; border-radius:15px; margin: 15px 0; border: 1px solid var(--success); text-align:center;">
        <p id="loyaltyMsg"></p>
        <div style="background:#333; height:8px; border-radius:4px; margin-top:10px;">
            <div id="loyaltyProgress" style="background:var(--main); height:100%; width:0%; border-radius:4px;"></div>
        </div>
    </div>
    <input type="text" id="uName" placeholder="الاسم">
    <input type="text" id="uAddress" placeholder="العنوان بالتفصيل">
    <input type="tel" id="uPhone" placeholder="رقم الموبايل" oninput="checkLoyalty(this.value)">
    <button class="btn btn-main" onclick="confirmFullOrder()">تأكيد وإرسال واتساب 💬</button>
</div>

<div id="admin-page" class="page">
    <h3 style="margin: 20px 0; color: var(--main);">⚙️ لوحة التحكم</h3>
    
    <div class="admin-section">
        <h4>✨ إضافة منتج جديد</h4>
        <input type="text" id="newPTitle" placeholder="اسم المنتج">
        <select id="newPCat"><option value="عام">اختر القسم</option></select>
        <p style="font-size:0.7rem; color:#8e8e93;">صورة المنتج:</p>
        <input type="file" id="newPImg" accept="image/*" style="background:transparent; border:none;">
        <button class="btn btn-main" onclick="uploadProduct()">حفظ المنتج في المنيو</button>
    </div>

    <div class="admin-section">
        <h4>📁 إدارة الأقسام</h4>
        <div style="display:flex; gap:5px;">
            <input type="text" id="newCatName" placeholder="اسم القسم الجديد">
            <button class="btn btn-main" style="width:80px; padding:10px;" onclick="addCategory()">+</button>
        </div>
        <div id="catsManagerList" style="margin-top:10px;"></div>
    </div>

    <div class="admin-section">
        <h4>📨 الطلبات الواردة</h4>
        <div id="adminOrdersList"></div>
    </div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><i>🏠</i><span>الرئيسية</span></a>
    <a href="#" class="nav-link" onclick="go('special', this)"><i>📦</i><span>توصيل</span></a>
    <a href="#" class="nav-link" onclick="go('cart', this)"><i>🛒</i><span>السلة</span></a>
    <a href="#" class="nav-link hidden-admin" onclick="go('admin-page', this)"><i>⚙️</i><span>الإدارة</span></a>
</nav>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let cart = [], currentProduct = "", userOrdersCount = 0;

    function toggleAdmin() { if(prompt("باسورد الإدارة؟") === "135790") document.body.classList.toggle('admin-mode'); }

    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
        if(id === 'admin-page') { loadAdminData(); }
    }

    // إدارة الكمية
    function stepQty(val) {
        let cur = parseFloat(document.getElementById('customQty').value) || 0;
        document.getElementById('customQty').value = Math.max(1, cur + val);
    }

    function openQtyModal(title) {
        currentProduct = title;
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('customQty').value = "1";
        document.getElementById('pNote').value = "";
        document.getElementById('qtyModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('qtyModal').style.display = 'none'; }

    function confirmAdd() {
        const q = document.getElementById('customQty').value;
        const n = document.getElementById('pNote').value;
        cart.push({ t: currentProduct, q: q, n: n });
        closeModal();
        renderCart();
    }

    // فحص النقاط (الولاء)
    async function checkLoyalty(phone) {
        if(phone.length >= 11) {
            const snap = await db.collection("orders").where("p", "==", phone).where("status", "==", "done").get();
            userOrdersCount = snap.size;
            const sec = document.getElementById('loyaltyStatus');
            sec.style.display = 'block';
            const progress = (userOrdersCount / 9) * 100;
            document.getElementById('loyaltyProgress').style.width = Math.min(progress, 100) + "%";
            document.getElementById('loyaltyMsg').innerHTML = userOrdersCount >= 9 ? "🎊 مبروك! طلبك القادم توصيله مجاني" : `فاضلك ${9 - userOrdersCount} أوردرات وتكسب توصيل مجاني!`;
        }
    }

    // معالجة الصور (تصغير وحفظ)
    async function uploadProduct() {
        const title = document.getElementById('newPTitle').value;
        const cat = document.getElementById('newPCat').value;
        const file = document.getElementById('newPImg').files[0];
        
        if(!title || !file) return alert("اكتب الاسم واختار صورة!");

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const max_w = 400; 
                const scale = max_w / img.width;
                canvas.width = max_w;
                canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const base64 = canvas.toDataURL('image/jpeg', 0.7);

                await db.collection("products").add({ title, cat, img: base64, createdAt: new Date() });
                alert("تمت الإضافة!");
                document.getElementById('newPTitle').value = "";
            };
        };
    }

    // عرض المنتجات
    db.collection("products").orderBy("createdAt", "desc").onSnapshot(s => {
        let h = '';
        s.forEach(d => {
            const p = d.data();
            h += `<div class="p-card">
                <div class="delete-btn" onclick="deleteDoc('products','${d.id}')">✕</div>
                <img src="${p.img}">
                <div style="padding:10px; text-align:center;">
                    <span class="cat-tag">${p.cat}</span>
                    <p style="font-size:0.9rem; font-weight:bold; margin-bottom:8px;">${p.title}</p>
                    <button class="btn btn-main" style="padding:8px; font-size:0.8rem;" onclick="openQtyModal('${p.title}')">اطلب الآن</button>
                </div>
            </div>`;
        });
        document.getElementById('prodsHome').innerHTML = h;
    });

    // إدارة الأقسام
    async function addCategory() {
        const name = document.getElementById('newCatName').value;
        if(name) await db.collection("categories").add({ name });
        document.getElementById('newCatName').value = "";
    }

    db.collection("categories").onSnapshot(s => {
        let opts = '<option value="عام">اختر القسم</option>';
        let list = '';
        s.forEach(d => {
            opts += `<option value="${d.data().name}">${d.data().name}</option>`;
            list += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; background:#222; padding:8px; border-radius:8px;">
                        <span>${d.data().name}</span>
                        <span style="color:red; cursor:pointer;" onclick="deleteDoc('categories','${d.id}')">حذف</span>
                    </div>`;
        });
        document.getElementById('newPCat').innerHTML = opts;
        document.getElementById('catsManagerList').innerHTML = list;
    });

    function renderCart() {
        document.getElementById('cartList').innerHTML = cart.map((i,idx)=>`
            <div style="background:#222; padding:12px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between;">
                <div><b>${i.t}</b> (الكمية: ${i.q})<br><small style="color:var(--main)">${i.n || ''}</small></div>
                <span onclick="cart.splice(${idx},1);renderCart()" style="color:red;">✕</span>
            </div>
        `).join('');
    }

    async function confirmFullOrder() {
        const n = document.getElementById('uName').value, p = document.getElementById('uPhone').value, a = document.getElementById('uAddress').value;
        if(!n || !p || cart.length === 0) return alert("كمل بياناتك!");
        
        let items = cart.map(i => `- ${i.t} (كمية: ${i.q}) ${i.n ? '['+i.n+']' : ''}`).join('\n');
        let loyalty = userOrdersCount >= 9 ? "\n\n🎁 *أوردر الهدية: توصيل مجاني!*" : "";
        let msg = `⚡ *أوردر جديد*\n👤 الاسم: ${n}\n📞 الهاتف: ${p}\n📍 العنوان: ${a}\n\n📦 الطلبات:\n${items}${loyalty}`;

        await db.collection("orders").add({ n, p, a, items: cart, status: "pending", createdAt: new Date() });
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
        cart = []; renderCart();
    }

    function loadAdminData() {
        db.collection("orders").orderBy("createdAt", "desc").onSnapshot(s => {
            let h = '';
            s.forEach(d => {
                const o = d.data();
                h += `<div style="background:#222; padding:10px; border-radius:10px; margin-bottom:10px; border-right:3px solid ${o.status=='done'?'green':'orange'}">
                    <p><b>${o.n}</b> - ${o.p}</p>
                    <p style="font-size:0.75rem;">${o.a || 'توصيل خاص'}</p>
                    <div style="display:flex; gap:5px; margin-top:5px;">
                        <button class="btn" style="background:green; padding:5px; font-size:0.7rem;" onclick="db.collection('orders').doc('${d.id}').update({status:'done'})">تأكيد بنجاح</button>
                        <button class="btn" style="background:red; padding:5px; font-size:0.7rem;" onclick="deleteDoc('orders','${d.id}')">حذف</button>
                    </div>
                </div>`;
            });
            document.getElementById('adminOrdersList').innerHTML = h;
        });
    }

    async function sendSpecialOrder() {
        const det = document.getElementById('spDetails').value, ph = document.getElementById('spPhone').value, 
              from = document.getElementById('spFrom').value, to = document.getElementById('spTo').value;
        if(!det || !ph) return alert("اكتب التفاصيل!");
        let msg = `📦 *طلب شحن خاص*\n📝 الحاجة: ${det}\n🏠 من: ${from}\n📍 إلى: ${to}\n📞 المستلم: ${ph}`;
        await db.collection("orders").add({ n: "شحن خاص", p: ph, sp: det, status: "pending", createdAt: new Date() });
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
    }

    function deleteDoc(col, id) { if(confirm("أكيد حذف؟")) db.collection(col).doc(id).delete(); }
</script>
</body>
</html>
