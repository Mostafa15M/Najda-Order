<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نجدة أوردر | النسخة الكاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --neon: #00f2ff; --royal: #bc13fe; --dark: #050505; --card: #121212; --success: #00ff88; --error: #ff4444; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background: var(--dark); color: #fff; padding-bottom: 70px; }
        
        /* الهيدر */
        header { background: #000; padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--neon); text-shadow: 0 0 10px var(--neon); cursor: pointer; }

        /* الصفحات */
        .page { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* الكروت */
        .card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #222; }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-main { background: linear-gradient(45deg, var(--neon), var(--royal)); color: #000; }
        
        /* لوحة الإدارة */
        .admin-stat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #1a1a1a; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid var(--royal); }
        .order-item { border-right: 4px solid var(--neon); position: relative; }
        .order-item.done { border-right-color: var(--success); opacity: 0.8; }
        .badge { position: absolute; top: 10px; left: 10px; font-size: 0.7rem; padding: 2px 8px; border-radius: 5px; }

        /* السلة */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #222; }
        .nav-link { color: #666; font-size: 0.8rem; cursor: pointer; text-align: center; text-decoration: none; }
        .nav-link.active { color: var(--neon); }
        
        input, textarea { width: 100%; padding: 12px; border-radius: 10px; background: #000; border: 1px solid #333; color: #fff; margin: 10px 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="adminTrigger">نجدة أوردر ⚡</div>
        <div style="font-size: 0.7rem; color: var(--royal);">مصطفى حجازي ✨</div>
    </header>

    <div id="shopPage" class="page active">
        <h3 style="margin-bottom: 15px;">اطلب الآن 📦</h3>
        <div id="productsList"></div>
        <div class="card" style="border: 1px dashed var(--neon); margin-top: 20px;">
            <h4>🚀 طلب توصيل خاص</h4>
            <p style="font-size: 0.8rem; color: #aaa;">لأي حاجة مش موجودة في القائمة</p>
            <button class="btn btn-main" onclick="nav('deliveryPage')">اطلب توصيل خاص</button>
        </div>
    </div>

    <div id="deliveryPage" class="page">
        <h3>تفاصيل التوصيل 🚀</h3>
        <textarea id="dWhat" placeholder="عايز تجيب إيه؟ (مثلاً: فطار، دواء، طلب من مكان معين)"></textarea>
        <input type="text" id="dFrom" placeholder="هنجيبه منين؟">
        <input type="text" id="dTo" placeholder="العنوان بالتفصيل">
        <button class="btn btn-main" onclick="addDeliveryToCart()">إضافة للسلة 🛒</button>
    </div>

    <div id="cartPage" class="page">
        <h3>مراجعة الطلب 🛒</h3>
        <div id="cartContent" style="margin: 20px 0;"></div>
        <div id="orderForm" style="display: none;">
            <input type="text" id="uName" placeholder="الاسم">
            <input type="number" id="uPhone" placeholder="رقم الموبايل">
            <input type="text" id="uAddr" placeholder="العنوان">
            <button class="btn btn-main" onclick="confirmFinalOrder()">تأكيد وإرسال الأوردر ⚡</button>
        </div>
    </div>

    <div id="adminPage" class="page">
        <h2 style="color: var(--neon); margin-bottom: 20px;">لوحة الإدارة ⚙️</h2>
        <div class="admin-stat">
            <div class="stat-box">جديد <span id="newCount" style="display:block; font-weight:900;">0</span></div>
            <div class="stat-box">مكتمل <span id="doneCount" style="display:block; font-weight:900;">0</span></div>
        </div>
        <div id="adminOrders"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-link active" onclick="nav('shopPage')">🏠 المتجر</div>
        <div class="nav-link" onclick="nav('cartPage')">🛒 السلة (<span id="cartCount">0</span>)</div>
    </div>

    <script>
        // --- الإعدادات والربط ---
        const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cart = [];

        // --- وظائف التنقل ---
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'cartPage') renderCart();
        }

        // --- إدارة المتجر ---
        db.collection("products").onSnapshot(snap => {
            const list = document.getElementById('productsList');
            list.innerHTML = "";
            snap.forEach(doc => {
                const p = doc.data();
                list.innerHTML += `<div class="card">
                    <h4>${p.name}</h4>
                    <p style="color:var(--neon)">${p.price} ج.م</p>
                    <button class="btn btn-main" onclick="addToCart('${p.name}')">إضافة 🛒</button>
                </div>`;
            });
        });

        function addToCart(name) {
            cart.push({ type: 'product', t: name, q: 1 });
            updateUI();
            alert("تمت الإضافة!");
        }

        function addDeliveryToCart() {
            const w = document.getElementById('dWhat').value, f = document.getElementById('dFrom').value, t = document.getElementById('dTo').value;
            if(!w || !f) return alert("كمل البيانات!");
            cart.push({ type: 'delivery', w, f, t });
            updateUI();
            nav('cartPage');
        }

        function updateUI() {
            document.getElementById('cartCount').innerText = cart.length;
        }

        function renderCart() {
            const cont = document.getElementById('cartContent');
            const form = document.getElementById('orderForm');
            if(cart.length === 0) {
                cont.innerHTML = "السلة فاضية  !";
                form.style.display = "none";
            } else {
                form.style.display = "block";
                cont.innerHTML = cart.map((i, x) => `
                    <div class="card" style="display:flex; justify-content:space-between;">
                        <span>${i.type === 'delivery' ? '🚀 توصيل خاص' : '📦 ' + i.t}</span>
                        <span style="color:var(--error)" onclick="cart.splice(${x},1); renderCart(); updateUI();">حذف</span>
                    </div>`).join('');
            }
        }

        // --- إرسال الأوردر ---
        async function confirmFinalOrder() {
            const name = document.getElementById('uName').value, phone = document.getElementById('uPhone').value, addr = document.getElementById('uAddr').value;
            if(!name || !phone) return alert("الاسم والموبايل مهمين!");

            try {
                await db.collection("orders").add({
                    userName: name, userPhone: phone, address: addr,
                    items: cart, status: "pending",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // إرسال واتساب
                let msg = `أوردر جديد: ${name}\nالطلبات:\n` + cart.map(i => i.type==='delivery' ? `- توصيل: ${i.w}` : `- ${i.t}`).join('\n');
                window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);

                alert("وصل ! سيتم التواصل معك.");
                cart = []; updateUI(); nav('shopPage');
            } catch(e) { alert("خطأ في الربط!"); }
        }

        // --- لوحة الإدارة (نظام الصح والغلط) ---
        document.getElementById('adminTrigger').onclick = () => {
            if(prompt("كلمة السر؟") === "135790") nav('adminPage');
        };

        db.collection("orders").orderBy("createdAt", "desc").onSnapshot(snap => {
            const list = document.getElementById('adminOrders');
            let n = 0, d = 0;
            list.innerHTML = "";
            snap.forEach(doc => {
                const o = doc.data();
                const isDone = o.status === 'confirmed';
                if(!isDone) n++; else d++;

                let itemsHtml = o.items.map(i => i.type==='delivery' ? `<div style="color:#ffd700">🚀 ${i.w} (من:${i.f})</div>` : `<div>📦 ${i.t}</div>`).join('');

                list.innerHTML += `
                    <div class="card order-item ${isDone ? 'done' : ''}">
                        <div class="badge" style="background:${isDone ? 'var(--success)' : 'var(--neon)'}; color:#000;">${isDone ? 'مكتمل' : 'جديد'}</div>
                        <b>${o.userName}</b> | ${o.userPhone}
                        <div style="background:#000; padding:10px; border-radius:10px; margin:10px 0;">${itemsHtml}</div>
                        <p style="font-size:0.8rem; color:#888;">📍 ${o.address}</p>
                        ${!isDone ? `
                            <div style="display:flex; gap:10px;">
                                <button class="btn" style="background:var(--success); color:#000;" onclick="updateStatus('${doc.id}', '${o.userPhone}')">صح (موافقة) ✅</button>
                                <button class="btn" style="background:var(--error); color:#fff;" onclick="deleteOrder('${doc.id}')">حذف ❌</button>
                            </div>
                        ` : `<button class="btn" style="background:#333; color:#fff;" onclick="deleteOrder('${doc.id}')">مسح السجل 🗑️</button>`}
                    </div>`;
            });
            document.getElementById('newCount').innerText = n;
            document.getElementById('doneCount').innerText = d;
        });

        async function updateStatus(id, phone) {
            await db.collection("orders").doc(id).update({ status: "confirmed" });
            // بونص
            const ref = db.collection("users_stats").doc(phone);
            const doc = await ref.get();
            let c = doc.exists ? (doc.data().count || 0) : 0;
            await ref.set({ count: c + 1 }, { merge: true });
            alert("تم التأكيد!");
        }

        async function deleteOrder(id) { if(confirm("حذف؟")) await db.collection("orders").doc(id).delete(); }

    </script>
</body>
</html>
