<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر | مصطفى حجازي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #9d50bb; --bg: #0a0a0c; --card: #16161a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: #fff; }

        header {
            padding: 15px; text-align: center; background: #000;
            border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000;
        }
        .brand-name { font-size: 0.8rem; color: var(--sec); font-weight: bold; letter-spacing: 1px; margin-bottom: 2px; display: block; }
        .logo-main { font-size: 1.5rem; font-weight: 900; color: var(--main); display: block; line-height: 1.2; }
        .sub-logo { font-size: 0.85rem; color: #aaa; margin-top: 4px; font-weight: 400; display: block; }

        /* الأقسام */
        .cats { display: flex; gap: 10px; overflow-x: auto; padding: 15px; scrollbar-width: none; }
        .cat-item { 
            padding: 8px 18px; background: var(--card); border: 1px solid #333; 
            border-radius: 50px; white-space: nowrap; font-size: 0.8rem;
        }
        .cat-item.active { background: var(--main); color: #000; font-weight: bold; }

        /* عرض المنتجات */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .card { 
            background: var(--card); border-radius: 20px; padding: 10px; 
            border: 1px solid #222; text-align: center;
        }
        .card img { width: 100%; height: 110px; border-radius: 15px; object-fit: cover; }
        .card h3 { font-size: 0.85rem; margin: 10px 0 5px; height: 35px; overflow: hidden; }
        .card .price { color: var(--main); font-weight: 900; display: block; margin-bottom: 10px; }

        .btn-buy {
            width: 100%; padding: 12px; border-radius: 12px; border: none;
            background: linear-gradient(45deg, var(--main), var(--sec));
            color: #fff; font-weight: bold; cursor: pointer;
        }

        #giftBar {
            background: #ffd700; color: #000; padding: 12px; text-align: center;
            font-weight: 900; display: none; margin: 10px; border-radius: 10px;
        }

        nav {
            position: fixed; bottom: 0; width: 100%; background: #000;
            display: flex; justify-content: space-around; padding: 10px;
            border-top: 1px solid #222; z-index: 1000;
        }
        .nav-link { color: #666; text-decoration: none; font-size: 0.75rem; text-align: center; }
        .nav-link.active { color: var(--main); }

        .form-box { background: var(--card); padding: 20px; border-radius: 20px; margin: 15px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; }
    </style>
</head>
<body>

<header>
    <span class="brand-name">✨ مصطفى حجازي ✨</span>
    <span class="logo-main">نجدة أوردر ⚡</span>
    <span class="sub-logo">توصيل مستلزمات شخصية</span>
</header>

<div id="giftBar">🎁 أوردر الهدية العاشر! طلبك ده مجاني!</div>

<main id="view" style="padding-bottom: 80px;"></main>

<nav>
    <a href="#" class="nav-link active" onclick="go('home')">🏠<br>المتجر</a>
    <a href="#" class="nav-link" onclick="go('cart')">🛒<br>السلة (<span id="cCount">0</span>)</a>
    <a href="#" class="nav-link" id="admBtn" style="display:none;" onclick="go('admin')">🛡️<br>الإدارة</a>
</nav>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    let cart = [], products = [], categories = [];

    // دخول الإدارة السري
    let t; document.querySelector('.logo-main').ontouchstart = () => t = setTimeout(() => {
        if(prompt("Pass?") === "135790") { document.getElementById('admBtn').style.display = 'block'; go('admin'); }
    }, 2000);
    document.querySelector('.logo-main').ontouchend = () => clearTimeout(t);

    function init() {
        db.collection("categories").onSnapshot(s => { categories = s.docs.map(d=>({id:d.id, ...d.data()})); });
        db.collection("products").orderBy("createdAt", "desc").onSnapshot(s => { 
            products = s.docs.map(d=>({id:d.id, ...d.data()})); 
            go('home'); 
        });
    }

    function go(page) {
        const v = document.getElementById('view');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        
        if(page === 'home') {
            v.innerHTML = `
                <div class="cats"><div class="cat-item active">الكل</div>${categories.map(c=>`<div class="cat-item">${c.name}</div>`).join('')}</div>
                <div class="grid">${products.map(p => `
                    <div class="card">
                        <img src="${p.img || 'https://via.placeholder.com/150'}">
                        <h3>${p.title}</h3>
                        <span class="price">${p.price || 0} ج.م</span>
                        <button class="btn-buy" onclick="add('${p.id}')">إضافة 🛒</button>
                    </div>`).join('')}</div>`;
        } 
        else if(page === 'cart') {
            v.innerHTML = `
                <div class="form-box">
                    <h3>🛒 محتويات السلة</h3>
                    <div id="cartItems" style="margin:15px 0;"></div>
                    <input type="text" id="uName" placeholder="الاسم">
                    <input type="tel" id="uPhone" placeholder="رقم الموبايل" onkeyup="check(this.value)">
                    <input type="text" id="uAddr" placeholder="العنوان">
                    <button class="btn-buy" onclick="order()">تأكيد الطلب ✅</button>
                </div>`;
            renderCart();
        }
        else if(page === 'admin') {
            v.innerHTML = `<div class="form-box">
                <h3>🛡️ إضافة منتج جديد</h3>
                <input type="text" id="pTitle" placeholder="اسم المنتج">
                <input type="number" id="pPrice" placeholder="السعر">
                <select id="pCat">${categories.map(c=>`<option>${c.name}</option>`).join('')}</select>
                <input type="file" id="pImg" onchange="encode(this)">
                <button class="btn-buy" onclick="saveP()">حفظ المنتج</button>
                <div id="ordersList" style="margin-top:20px;"></div>
            </div>`;
            renderOrders();
        }
    }

    function add(id) { cart.push(products.find(p=>p.id===id)); document.getElementById('cCount').innerText = cart.length; }

    function renderCart() {
        document.getElementById('cartItems').innerHTML = cart.map((i,x)=>`<div style="padding:10px; background:#000; margin-bottom:5px; border-radius:10px; border:1px solid #333;">${i.title} <span onclick="cart.splice(${x},1); go('cart')" style="color:red; float:left;">❌</span></div>`).join('');
    }

    async function check(ph) {
        if(ph.length >= 11) {
            const d = await db.collection("users_stats").doc(ph).get();
            document.getElementById('giftBar').style.display = (d.exists && d.data().count >= 9) ? 'block' : 'none';
        }
    }

    async function order() {
        const n = document.getElementById('uName').value, ph = document.getElementById('uPhone').value;
        if(!n || !ph) return alert("البيانات!");
        await db.collection("orders").add({ userName: n, userPhone: ph, items: cart.map(i=>i.title), status: "pending", createdAt: new Date() });
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent("*طلب جديد - مصطفى حجازي*\nالعميل: " + n + "\nالطلبات: " + cart.map(i=>i.title).join(", "))}`);
        cart = []; document.getElementById('cCount').innerText = "0"; go('home');
    }

    function renderOrders() {
        db.collection("orders").where("status","==","pending").onSnapshot(s => {
            document.getElementById('ordersList').innerHTML = s.docs.map(d => {
                const o = d.data();
                return `<div class="card" style="margin-bottom:10px; text-align:right;">
                    <b>${o.userName}</b> (${o.userPhone})<br><small>${o.items.join(' - ')}</small>
                    <button class="btn-buy" style="margin-top:10px;" onclick="approve('${d.id}','${o.userPhone}')">تأكيد الأوردر ✅</button>
                </div>`;
            }).join('');
        });
    }

    async function approve(id, ph) {
        await db.collection("orders").doc(id).update({status: "confirmed"});
        const r = db.collection("users_stats").doc(ph);
        const u = await r.get();
        let c = (u.exists ? u.data().count : 0) + 1;
        await r.set({count: c}, {merge: true});
        alert("تم التأكيد! العداد الآن: " + c);
    }

    let tmpImg = ""; 
    function encode(el) { const r = new FileReader(); r.onload = () => tmpImg = r.result; r.readAsDataURL(el.files[0]); }
    async function saveP() {
        await db.collection("products").add({ title: document.getElementById('pTitle').value, price: document.getElementById('pPrice').value, cat: document.getElementById('pCat').value, img: tmpImg, createdAt: new Date() });
        alert("تم الحفظ!");
    }

    init();
</script>
</body>
</html>
