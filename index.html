<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مصطفى حجازي | نجدة أوردر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --main-color: #00d2ff;
            --accent-color: #9d50bb;
            --bg-dark: #0a0a0c;
            --card-bg: #16161a;
            --text-gray: #888;
            --danger: #ff4b2b;
            --gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            line-height: 1.6;
            padding-bottom: 90px;
        }

        /* الهيدر الرئيسي */
        header {
            background: #000;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 2px solid var(--main-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .top-name { font-size: 0.9rem; color: var(--accent-color); font-weight: 900; letter-spacing: 3px; display: block; margin-bottom: 5px; }
        .main-logo { font-size: 1.8rem; font-weight: 900; color: var(--main-color); line-height: 1.1; }
        .sub-slogan { font-size: 0.85rem; color: var(--text-gray); display: block; margin-top: 5px; }

        /* شريط العرض والهدية */
        .promo-banner {
            background: linear-gradient(90deg, #b8860b, var(--gold), #b8860b);
            color: #000;
            padding: 12px;
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            margin: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.2);
        }

        /* التنقل بين الصفحات */
        .page { display: none; padding: 15px; animation: slideUp 0.4s ease; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ستايل الكروت والأزرار */
        .admin-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #222;
        }
        .admin-card h2 {
            font-size: 1.2rem;
            color: var(--main-color);
            margin-bottom: 20px;
            border-right: 5px solid var(--accent-color);
            padding-right: 12px;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #000;
            color: #fff;
            font-size: 0.95rem;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary { background: linear-gradient(45deg, var(--main-color), var(--accent-color)); color: #fff; }
        .btn-danger { background: var(--danger); font-size: 0.8rem; padding: 8px 15px; width: auto; color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--main-color); color: var(--main-color); }

        /* عرض المنتجات */
        .cats-bar { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0 20px; scrollbar-width: none; }
        .cat-item { padding: 8px 22px; background: var(--card-bg); border-radius: 50px; border: 1px solid #333; white-space: nowrap; font-size: 0.85rem; }
        .cat-item.active { background: var(--main-color); color: #000; font-weight: bold; border-color: var(--main-color); }

        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .p-card { background: var(--card-bg); border-radius: 25px; padding: 12px; border: 1px solid #222; text-align: center; }
        .p-card img { width: 100%; height: 130px; border-radius: 18px; object-fit: cover; margin-bottom: 10px; }
        .p-card h3 { font-size: 0.9rem; height: 40px; overflow: hidden; margin-bottom: 5px; }
        .p-card .price { color: var(--main-color); font-weight: 900; font-size: 1.1rem; display: block; margin-bottom: 10px; }

        /* النافيجيشن السفلي */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 5px;
            border-top: 1px solid #222;
            z-index: 2000;
        }
        .nav-item { color: #555; text-decoration: none; text-align: center; font-size: 0.7rem; font-weight: bold; transition: 0.3s; }
        .nav-item.active { color: var(--main-color); }
        .nav-item i { font-size: 1.5rem; display: block; margin-bottom: 4px; }

        /* صفوف قوائم الإدارة */
        .list-row {
            background: #000;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border: 1px solid #1a1a1a;
        }

        /* سلة التسوق */
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #000; border-radius: 10px; margin-bottom: 10px; border-right: 4px solid var(--main-color); }
    </style>
</head>
<body>

<header>
    <span class="top-name">✨ مصطفى حجازي ✨</span>
    <span class="main-logo">نجدة أوردر ⚡</span>
    <span class="sub-slogan">توصيل مستلزمات شخصية</span>
</header>

<div id="home-page" class="page active">
    <div class="promo-banner">🎁 عرض الـ 10 أوردرات: اطلب 9 والعاشر هدية مجاناً! 🎁</div>
    <div class="cats-bar" id="catsHome"></div>
    <div class="products-grid" id="productsHome"></div>
</div>

<div id="cart-page" class="page">
    <div class="admin-card">
        <h2>🛒 سلة المشتريات</h2>
        <div id="cartItems"></div>
        <div id="cartTotal" style="text-align: left; padding: 10px; font-weight: 900; font-size: 1.2rem; color: var(--main-color);"></div>
        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
        <input type="text" id="custName" placeholder="الاسم الكامل">
        <input type="tel" id="custPhone" placeholder="رقم الموبايل">
        <textarea id="custAddr" placeholder="العنوان بالتفصيل (مثال: شيبين القناطر - كفر سعد)"></textarea>
        <button class="btn btn-primary" onclick="confirmOrder()">تأكيد الطلب عبر واتساب ✅</button>
    </div>
</div>

<div id="orders-page" class="page">
    <div class="admin-card">
        <h2>🔔 الأوردرات الجديدة</h2>
        <div id="adminOrdersList"></div>
    </div>
</div>

<div id="cats-page" class="page">
    <div class="admin-card">
        <h2>📂 إضافة قسم جديد</h2>
        <input type="text" id="newCatTitle" placeholder="مثلاً: مشروبات، بقالة، صيدلية...">
        <button class="btn btn-primary" onclick="createNewCat()">حفظ القسم الجديد</button>
    </div>
    <div class="admin-card">
        <h2>🛠️ تعديل / حذف الأقسام</h2>
        <div id="adminCatsList"></div>
    </div>
</div>

<div id="products-page" class="page">
    <div class="admin-card">
        <h2>🛍️ إضافة منتج للمتجر</h2>
        <input type="text" id="pTitleInp" placeholder="اسم المنتج">
        <input type="number" id="pPriceInp" placeholder="السعر">
        <select id="pCatInp"></select>
        <label style="font-size: 0.8rem; color: #888; display: block; margin-bottom: 5px;">صورة المنتج:</label>
        <input type="file" accept="image/*" id="pFileInp" onchange="processImage(this)">
        <button class="btn btn-primary" onclick="uploadNewProduct()">نشر المنتج الآن</button>
    </div>
    <div class="admin-card">
        <h2>📦 التحكم في المنتجات</h2>
        <div id="adminProdsList"></div>
    </div>
</div>

<nav>
    <a href="javascript:void(0)" class="nav-item active" onclick="navTo('home-page', this)"><i>🏠</i>المتجر</a>
    <a href="javascript:void(0)" class="nav-item" onclick="navTo('cart-page', this)"><i>🛒</i>السلة</a>
    <a href="javascript:void(0)" class="nav-item" onclick="navTo('orders-page', this)"><i>🔔</i>الطلبات</a>
    <a href="javascript:void(0)" class="nav-item" onclick="navTo('cats-page', this)"><i>📂</i>الأقسام</a>
    <a href="javascript:void(0)" class="nav-item" onclick="navTo('products-page', this)"><i>⚙️</i>المنتجات</a>
</nav>

<script>
    // إعدادات Firebase
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    let allProds = [], allCats = [], cart = [], base64Img = "";

    function navTo(pageId, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        el.classList.add('active');
    }

    // مزامنة البيانات
    function startSync() {
        db.collection("categories").onSnapshot(snap => {
            allCats = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderCatsSystem();
        });
        db.collection("products").orderBy("createdAt", "desc").onSnapshot(snap => {
            allProds = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderProdsSystem();
        });
        db.collection("orders").orderBy("createdAt", "desc").onSnapshot(snap => {
            renderOrdersSystem(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
    }

    // ريندر المتجر والأقسام
    function renderCatsSystem() {
        const homeBar = document.getElementById('catsHome');
        const adminList = document.getElementById('adminCatsList');
        const pSelect = document.getElementById('pCatInp');

        homeBar.innerHTML = `<div class="cat-item active">الكل</div>` + allCats.map(c => `<div class="cat-item">${c.name}</div>`).join('');
        pSelect.innerHTML = allCats.map(c => `<option>${c.name}</option>`).join('');
        adminList.innerHTML = allCats.map(c => `
            <div class="list-row">
                <span>📂 ${c.name}</span>
                <div>
                    <button class="btn-danger" style="background:#ffb100; color:#000; margin-left:5px;" onclick="editCat('${c.id}','${c.name}')">تعديل</button>
                    <button class="btn-danger" onclick="deleteEntry('categories','${c.id}')">حذف</button>
                </div>
            </div>`).join('');
    }

    function renderProdsSystem() {
        const homeGrid = document.getElementById('productsHome');
        const adminGrid = document.getElementById('adminProdsList');

        homeGrid.innerHTML = allProds.map(p => `
            <div class="p-card">
                <img src="${p.img || 'https://via.placeholder.com/150'}">
                <h3>${p.title}</h3>
                <span class="price">${p.price} ج.م</span>
                <button class="btn btn-primary" style="padding:8px; font-size:0.8rem;" onclick="addToCart('${p.id}')">إضافة 🛒</button>
            </div>`).join('');

        adminGrid.innerHTML = allProds.map(p => `
            <div class="list-row">
                <span style="font-size:0.8rem;">📦 ${p.title} (${p.price} ج)</span>
                <button class="btn-danger" onclick="deleteEntry('products','${p.id}')">حذف</button>
            </div>`).join('');
    }

    function renderOrdersSystem(orders) {
        document.getElementById('adminOrdersList').innerHTML = orders.map(o => `
            <div class="admin-card" style="border-right: 5px solid var(--main-color);">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <b>👤 ${o.userName}</b>
                    <small>${new Date(o.createdAt?.toDate()).toLocaleTimeString('ar-EG')}</small>
                </div>
                <p style="font-size:0.85rem;">📞 ${o.userPhone} | 📍 ${o.address}</p>
                <div style="background:#000; padding:10px; border-radius:10px; margin:10px 0; font-size:0.8rem; border:1px solid #222;">
                    🛒 الأصناف: ${o.items.join(' + ')}
                </div>
                <button class="btn btn-danger" style="width:100%" onclick="deleteEntry('orders','${o.id}')">تم التوصيل ومسح الطلب ✅</button>
            </div>`).join('');
    }

    // وظائف العمليات
    async function createNewCat() {
        const n = document.getElementById('newCatTitle').value;
        if(n) { await db.collection("categories").add({name: n}); document.getElementById('newCatTitle').value = ""; }
    }

    async function editCat(id, old) {
        const n = prompt("تعديل اسم القسم:", old);
        if(n) await db.collection("categories").doc(id).update({name: n});
    }

    function processImage(input) {
        const r = new FileReader(); r.onload = () => base64Img = r.result; r.readAsDataURL(input.files[0]);
    }

    async function uploadNewProduct() {
        const t = document.getElementById('pTitleInp').value, p = document.getElementById('pPriceInp').value, c = document.getElementById('pCatInp').value;
        if(t && p && base64Img) {
            await db.collection("products").add({ title: t, price: p, cat: c, img: base64Img, createdAt: new Date() });
            alert("تم النشر!");
            document.getElementById('pTitleInp').value = ""; document.getElementById('pPriceInp').value = "";
        }
    }

    function addToCart(id) {
        const item = allProds.find(p => p.id === id);
        cart.push(item);
        alert("تمت الإضافة للسلة!");
        updateCartUI();
    }

    function updateCartUI() {
        const container = document.getElementById('cartItems');
        container.innerHTML = cart.map((item, idx) => `
            <div class="cart-item">
                <span>${item.title}</span>
                <b>${item.price} ج.م</b>
                <button onclick="cart.splice(${idx},1); updateCartUI()" style="background:none; border:none; color:red;">❌</button>
            </div>`).join('');
        const total = cart.reduce((sum, item) => sum + Number(item.price), 0);
        document.getElementById('cartTotal').innerText = "الإجمالي: " + total + " ج.م";
    }

    async function confirmOrder() {
        const n = document.getElementById('custName').value, p = document.getElementById('custPhone').value, a = document.getElementById('custAddr').value;
        if(n && p && a && cart.length > 0) {
            await db.collection("orders").add({ userName: n, userPhone: p, address: a, items: cart.map(i=>i.title), createdAt: new Date() });
            const msg = `طلب جديد - مصطفى حجازي\nالاسم: ${n}\nالطلبات: ${cart.map(i=>i.title).join(' + ')}\nالإجمالي: ${document.getElementById('cartTotal').innerText}`;
            window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
            cart = []; updateCartUI(); navTo('home-page', document.querySelectorAll('.nav-item')[0]);
        } else { alert("كمل بياناتك وضيف منتجات!"); }
    }

    async function deleteEntry(col, id) { if(confirm("حذف نهائي؟")) await db.collection(col).doc(id).delete(); }

    startSync();
</script>
</body>
</html>
