<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #16161a; --danger: #ff3131; --success: #00ff88; --neon: 0 0 10px var(--main); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; }

        header { padding: 15px; background: #000; border-bottom: 2px solid var(--main); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3); }
        .neon-logo { width: 45px; height: 45px; border: 2px solid var(--main); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: var(--neon); color: var(--main); font-weight: 900; }
        .neon-name { color: #fff; text-shadow: 0 0 10px var(--sec); font-weight: 900; }

        .promo-banner { background: linear-gradient(90deg, var(--main), var(--sec)); padding: 10px; text-align: center; font-weight: bold; border-radius: 10px; margin: 10px; font-size: 0.9rem; }

        .cat-chip { background: #222; padding: 8px 18px; border-radius: 20px; white-space: nowrap; border: 1px solid #333; font-size: 0.85rem; color: #bbb; cursor: pointer; transition: 0.3s; margin-bottom: 5px; }
        .cat-chip.active { background: var(--main); color: #000; font-weight: bold; border-color: var(--main); box-shadow: var(--neon); }

        .page { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        input, textarea, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #222; background: #000; color: #fff; outline: none; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--main); color: var(--main); margin-top: 5px; font-size: 0.8rem; padding: 10px; }

        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .p-card { background: var(--card); padding: 10px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .p-card img { width: 100%; height: 110px; border-radius: 15px; object-fit: cover; border: 1px solid #333; }

        nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #222; z-index: 1000; }
        .nav-link { color: #555; text-decoration: none; text-align: center; font-size: 0.75rem; flex: 1; }
        .nav-link.active { color: var(--main); }
        .nav-link span { font-size: 1.5rem; display: block; }

        .admin-item-card { background: #111; padding: 10px; border-radius: 10px; margin-bottom: 8px; border-right: 4px solid var(--main); display: flex; justify-content: space-between; align-items: center; }
        .hidden-admin { display: none; }
        .admin-mode .hidden-admin { display: block !important; }
    </style>
</head>
<body>

<header>
    <div style="color:var(--main); font-weight:900;">نجدة أوردر ⚡</div>
    <div class="neon-logo">⚡</div>
    <div class="neon-name" id="adminTrigger" onmousedown="startPress()" onmouseup="endPress()" ontouchstart="startPress()" ontouchend="endPress()">مصطفى حجازي</div>
</header>

<div class="promo-banner">🔥 اطلب 9 أوردرات والعاشر توصيله مجاناً! 🔥</div>

<div id="home" class="page active">
    <div id="catsHeader" style="display:flex; gap:10px; overflow-x:auto; padding:5px 0 15px;"></div>
    <div class="prod-grid" id="prodsHome"></div>
</div>

<div id="special" class="page">
    <div style="background:var(--card); padding:20px; border-radius:25px; border:1px solid var(--sec);">
        <h3 style="color:var(--sec); text-align:center;">📦 توصيل مستلزمات شخصية</h3>
        <input type="text" id="spDetails" placeholder="تفاصيل الحاجة (مثلاً: مفاتيح، شنطة هدوم)">
        <input type="text" id="spFrom" placeholder="هجيبها منين؟ (العنوان بالتفصيل)">
        <input type="text" id="spTo" placeholder="هوديها فين؟ (العنوان بالتفصيل)">
        <input type="text" id="spReceiver" placeholder="اسم المستلم">
        <input type="tel" id="spPhone" placeholder="رقم هاتف المستلم">
        <button class="btn btn-main" onclick="sendSpecialOrder()">إرسال الطلب الآن 🚀</button>
    </div>
</div>

<div id="cart" class="page">
    <div style="background:var(--card); padding:20px; border-radius:25px; border:1px solid #222;">
        <h3 style="color:var(--main); text-align:center;">🛒 مراجعة السلة</h3>
        <div id="cartList" style="margin:15px 0;"></div>
        <input type="text" id="uName" placeholder="اسمك">
        <input type="text" id="uAddress" placeholder="عنوانك">
        <input type="tel" id="uPhone" placeholder="رقم موبايلك" oninput="checkUserHistory(this.value)">
        <div id="loyaltyInfo" style="text-align:center; margin:10px 0;"></div>
        <button class="btn btn-main" onclick="confirmFullOrder()">تأكيد وإرسال 💬</button>
    </div>
</div>

<div id="admin" class="page">
    <div style="background:var(--card); padding:15px; border-radius:20px; border: 1px solid var(--sec);">
        <h3 style="color:var(--sec); text-align:center;">⚙️ لوحة التحكم</h3>
        
        <h4>📈 الطلبات الواردة</h4>
        <input type="tel" id="searchPhone" placeholder="بحث برقم الهاتف..." oninput="renderOrders(this.value)">
        <div id="ordersDashboard" style="margin-top:10px; max-height: 400px; overflow-y: auto;"></div>

        <hr style="margin:20px 0; border:0.5px solid #333;">

        <h4>📁 إدارة الأقسام</h4>
        <input type="text" id="newCatInput" placeholder="اسم القسم الجديد">
        <button class="btn btn-main" style="padding:10px;" onclick="addCategory()">إضافة قسم +</button>
        <div id="adminCatsList" style="margin-top:10px;"></div>

        <hr style="margin:20px 0; border:0.5px solid #333;">

        <h4>➕ إضافة منتج</h4>
        <input type="text" id="pTitle" placeholder="اسم المنتج">
        <input type="file" id="pImage" accept="image/*" onchange="handleImage(this)">
        <select id="pCatSelect"></select>
        <button class="btn btn-main" onclick="saveNewProd()">حفظ المنتج</button>
        
        <h4 style="margin-top:15px;">🛒 المنتجات الحالية</h4>
        <div id="adminProdsList" style="margin-top:10px;"></div>
    </div>
</div>

<div id="orderModal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modalTitle" style="color:var(--main);"></h3>
        <input type="number" id="modalQty" value="1" min="1">
        <textarea id="modalNotes" placeholder="أي ملاحظات؟"></textarea>
        <button class="btn btn-main" onclick="addToCart()">إضافة للسلة</button>
        <button class="btn" style="background:transparent;" onclick="closeModal('orderModal')">إلغاء</button>
    </div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><span>🏠</span>الرئيسية</a>
    <a href="#" class="nav-link" onclick="go('special', this)"><span>📦</span>توصيل خاص</a>
    <a href="#" class="nav-link" onclick="go('cart', this)"><span>🛒</span>السلة</a>
    <a href="#" class="nav-link hidden-admin" id="adminLink" onclick="go('admin', this)"><span>⚙️</span>الإدارة</a>
</nav>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    let cart = [], tempImg = "", pressTimer, ordersCount = 0, selectedCat = "الكل";

    function startPress() { pressTimer = setTimeout(() => { if(prompt("شفرة الإدارة؟") === "135790") document.body.classList.add('admin-mode'); }, 1500); }
    function endPress() { clearTimeout(pressTimer); }

    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
    }

    // --- إدارة الأقسام ---
    function addCategory() {
        const val = document.getElementById('newCatInput').value;
        if(val) db.collection("categories").add({ n: val }).then(() => document.getElementById('newCatInput').value = "");
    }

    db.collection("categories").onSnapshot(s => {
        let chips = `<div class="cat-chip ${selectedCat === 'الكل' ? 'active' : ''}" onclick="filterCat('الكل')">الكل</div>`;
        let opts = '';
        let list = '';
        s.forEach(d => {
            const name = d.data().n;
            chips += `<div class="cat-chip ${selectedCat === name ? 'active' : ''}" onclick="filterCat('${name}')">${name}</div>`;
            opts += `<option value="${name}">${name}</option>`;
            list += `<div class="admin-item-card"><span>${name}</span><button class="btn" style="background:red; padding:5px; width:auto;" onclick="deleteDoc('categories','${d.id}')">حذف</button></div>`;
        });
        document.getElementById('catsHeader').innerHTML = chips;
        document.getElementById('pCatSelect').innerHTML = opts;
        document.getElementById('adminCatsList').innerHTML = list;
    });

    // --- إدارة المنتجات ---
    function handleImage(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const max = 400;
                let w = img.width, h = img.height;
                if (w > h) { if (w > max) { h *= max/w; w = max; } } else { if (h > max) { w *= max/h; h = max; } }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                tempImg = canvas.toDataURL('image/jpeg', 0.7);
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    function saveNewProd() {
        const t = document.getElementById('pTitle').value, c = document.getElementById('pCatSelect').value;
        if(t && tempImg) db.collection("products").add({ title: t, img: tempImg, cat: c }).then(() => { alert("تم الحفظ!"); tempImg = ""; document.getElementById('pImage').value = ""; });
    }

    function filterCat(c) { selectedCat = c; renderHomeProds(); }

    function renderHomeProds() {
        db.collection("products").onSnapshot(s => {
            let h = '', list = '';
            s.forEach(d => {
                const p = d.data();
                if(selectedCat === 'الكل' || p.cat === selectedCat) {
                    h += `<div class="p-card" onclick="openModal('${p.title}')"><img src="${p.img}"><h5>${p.title}</h5><button class="btn-main" style="padding:5px; font-size:0.7rem;">اطلب</button></div>`;
                }
                list += `<div class="admin-item-card"><span>${p.title}</span><button class="btn" style="background:red; padding:5px; width:auto;" onclick="deleteDoc('products','${d.id}')">حذف</button></div>`;
            });
            document.getElementById('prodsHome').innerHTML = h;
            document.getElementById('adminProdsList').innerHTML = list;
        });
    }
    renderHomeProds();

    function deleteDoc(col, id) { if(confirm("هل تريد الحذف نهائياً؟")) db.collection(col).doc(id).delete(); }

    // --- إدارة الطلبات والولاء ---
    async function checkUserHistory(phone) {
        if(phone.length >= 11) {
            const snap = await db.collection("orders").where("p", "==", phone).get();
            ordersCount = snap.size;
            const info = document.getElementById('loyaltyInfo');
            if(ordersCount === 9) info.innerHTML = `<div style="background:var(--success); color:#000; padding:10px; border-radius:10px; font-weight:bold;">🎁 مبروك! الأوردر الجاي مجاني!</div>`;
            else info.innerHTML = `<span class="cat-chip active">أوردراتك السابقة: ${ordersCount}</span>`;
        }
    }

    function confirmFullOrder() {
        const n = document.getElementById('uName').value, p = document.getElementById('uPhone').value, a = document.getElementById('uAddress').value;
        if(!n || !p || cart.length === 0) return alert("البيانات ناقصة!");
        sendToWA(n, p, a, cart, false);
    }

    function sendSpecialOrder() {
        const det = document.getElementById('spDetails').value, fr = document.getElementById('spFrom').value, to = document.getElementById('spTo').value, rec = document.getElementById('spReceiver').value, ph = document.getElementById('spPhone').value;
        if(!det || !ph) return alert("كمل البيانات!");
        sendToWA(rec, ph, to, det, true, fr);
    }

    async function sendToWA(name, phone, addr, content, isSpecial, from = "") {
        const isFree = (ordersCount === 9 && !isSpecial);
        let msg = `⚡ *أوردر جديد من نجدة أوردر*\n\n👤 العميل: ${name}\n📞 الهاتف: ${phone}\n📍 العنوان: ${addr}\n`;
        if(isSpecial) msg += `📦 طلب خاص: ${content}\n🏠 من: ${from}`;
        else msg += `🛒 الطلبات:\n` + content.map(i => `- ${i.t} (ج${i.q})`).join('\n');
        
        if(isFree) msg += `\n\n🎁 *هذا هو الأوردر العاشر - مجاني!*\n*10MostafaHegazy10*`;

        await db.collection("orders").add({ n: name, p: phone, address: addr, items: isSpecial ? null : content, spDetails: isSpecial ? content : null, isFree: isFree, createdAt: new Date() });
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
        if(!isSpecial) { cart = []; renderCart(); }
    }

    // --- الطلبات في الإدارة ---
    function renderOrders(filter = "") {
        db.collection("orders").orderBy("createdAt", "desc").onSnapshot(s => {
            let h = '';
            s.forEach(d => {
                const o = d.data();
                if(!filter || o.p.includes(filter)) {
                    h += `<div class="admin-order-card" style="border: 1px solid var(--main); padding: 10px; border-radius: 15px; margin-bottom: 10px;">
                        <small>${o.createdAt?.toDate().toLocaleString('ar-EG')}</small>
                        <p>👤 ${o.n} | 📞 ${o.p}</p>
                        <p>📍 ${o.address || o.spTo || 'غير محدد'}</p>
                        <div style="background:#111; padding:5px; border-radius:5px; margin:5px 0;">
                            ${o.items ? o.items.map(i=>i.t).join(', ') : '📦 طلب خاص: ' + o.spDetails}
                        </div>
                        <div style="display:flex; gap:5px;">
                            <button class="btn-outline" style="border-color:var(--success); color:var(--success); flex:1;" onclick="deleteDoc('orders','${d.id}')">تأكيد ✅</button>
                            <button class="btn-outline" style="border-color:var(--danger); color:var(--danger); flex:1;" onclick="deleteDoc('orders','${d.id}')">حذف 🗑️</button>
                        </div>
                    </div>`;
                }
            });
            document.getElementById('ordersDashboard').innerHTML = h || '<p>لا يوجد طلبات</p>';
        });
    }
    renderOrders();

    function openModal(t) { currentProd = t; document.getElementById('modalTitle').innerText = t; document.getElementById('orderModal').style.display='flex'; }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
    function addToCart() {
        cart.push({ t: currentProd, q: document.getElementById('modalQty').value, n: document.getElementById('modalNotes').value });
        closeModal('orderModal'); renderCart();
    }
    function renderCart() {
        document.getElementById('cartList').innerHTML = cart.map((i, idx) => `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #333;"><span>${i.t} (ج${i.q})</span><span onclick="cart.splice(${idx},1);renderCart()" style="color:red">✕</span></div>`).join('');
    }
</script>
</body>
</html>
