<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nagda Order Elite | مصطفى حجازي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --accent: #00f2ff; --bg: #030712; --card: #111827;
            --text: #f9fafb; --dim: #9ca3af; --neon-pink: #ff007a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 120px; overflow-x: hidden; }

        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .logo h1 { font-size: 2.2rem; font-weight: 900; background: linear-gradient(to bottom, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hegazy-tag { color: var(--accent); font-weight: 900; font-size: 0.9rem; margin-top: 5px; }

        .hero-action { 
            margin: 20px; padding: 25px; border-radius: 24px; 
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border: 1px solid rgba(0, 242, 255, 0.2); cursor: pointer;
        }

        .cats-bar { display: flex; gap: 12px; overflow-x: auto; padding: 20px; scrollbar-width: none; }
        .pill { 
            padding: 10px 28px; background: var(--card); border-radius: 50px; 
            font-size: 0.9rem; font-weight: 700; white-space: nowrap; border: 1px solid rgba(255,255,255,0.05); cursor: pointer;
        }
        .pill.active { background: var(--accent); color: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .p-card { background: var(--card); border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,0.03); position: relative; }
        .p-card img { width: 100%; height: 160px; object-fit: cover; background: #222; }
        .p-card-info { padding: 15px; text-align: center; }

        .btn-main { 
            width: 100%; padding: 14px; border-radius: 14px; border: none; 
            font-weight: 900; cursor: pointer; background: var(--accent); color: #000;
        }

        .bottom-nav { 
            position: fixed; bottom: 25px; left: 20px; right: 20px; 
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px);
            border-radius: 24px; display: flex; justify-content: space-around; padding: 18px;
            border: 1px solid rgba(255,255,255,0.1); z-index: 2000;
        }
        .nav-item { color: var(--dim); font-size: 0.85rem; font-weight: 700; cursor: pointer; position: relative; }
        .nav-item.active { color: var(--accent); }
        .badge { 
            position: absolute; top: -12px; right: -12px; background: var(--neon-pink); 
            color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem;
            display: flex; align-items: center; justify-content: center;
        }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000; align-items: flex-end; justify-content: center;
        }
        .modal-content { 
            background: var(--card); width: 100%; border-radius: 32px 32px 0 0; padding: 35px;
            border-top: 3px solid var(--accent); animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        input, select, textarea { 
            width: 100%; padding: 16px; border-radius: 16px; background: #000;
            border: 1px solid rgba(255,255,255,0.1); color: #fff; margin-bottom: 15px; outline: none;
        }

        .admin-box { background: #1f2937; padding: 25px; border-radius: 24px; margin-bottom: 30px; border: 1px dashed var(--accent); }
        .admin-item { background: #000; padding: 15px; margin-top: 10px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; }
        .cat-tag-admin { background: var(--accent); color: #000; padding: 5px 12px; border-radius: 8px; font-size: 12px; margin: 5px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="logo">
            <h1>نجدة<span>.</span>ORDER</h1>
            <p class="hegazy-tag">MOSTAFA HEGAZY</p>
        </div>
    </header>

    <div id="shopPage" class="page">
        <div class="hero-action" onclick="openSpecial()">
            <h3 style="color:#fff">🚀 مشوار نجدة الخاص</h3>
            <p style="color:var(--dim); font-size: 0.85rem;">وصل أي طرد لأي مكان</p>
        </div>
        <div class="cats-bar" id="catsBar"></div>
        <div id="loading" style="text-align:center; padding:20px; color:var(--accent);">جاري التحميل من جوجل...</div>
        <div class="grid" id="shopGrid"></div>
    </div>

    <div id="cartPage" class="page" style="display:none; padding:20px;">
        <h2 style="margin-bottom:25px; font-weight: 900;">قائمة طلباتك 🛒</h2>
        <div id="cartList"></div>
        <div id="checkoutForm" style="display:none; margin-top:30px;">
            <input type="text" id="uName" placeholder="الاسم بالكامل">
            <input type="tel" id="uPhone" placeholder="رقم الموبايل">
            <input type="text" id="uAddr" placeholder="العنوان بالتفصيل">
            <button class="btn-main" style="padding:20px;" onclick="completeOrder()">إرسال الطلب واتساب ✅</button>
        </div>
    </div>

    <div id="adminPage" class="page" style="display:none; padding:20px;">
        <h2 style="color:var(--accent); margin-bottom:25px;">لوحة التحكم ⚙️</h2>
        
        <div class="admin-box">
            <h4>📁 إدارة الأقسام</h4>
            <div style="display:flex; gap:8px; margin-top:10px;">
                <input type="text" id="newCatName" placeholder="اسم القسم الجديد">
                <button class="btn-main" style="width:100px;" onclick="addCategory()">إضافة</button>
            </div>
            <div id="adminCatsList" style="margin-top:15px;"></div>
        </div>

        <div class="admin-box">
            <h4>🍕 إضافة صنف جديد</h4>
            <input type="text" id="pTitle" placeholder="اسم الصنف">
            <input type="file" id="pImgInput" accept="image/*" onchange="imgProcess(this)">
            <select id="pUnit"><option value="كيلو">كيلو</option><option value="قطعة">قطعة</option><option value="ربطة">ربطة</option></select>
            <select id="pCatSelect"></select>
            <button class="btn-main" id="saveBtn" onclick="saveProduct()">حفظ في جوجل ☁️</button>
        </div>

        <h4>📦 المنتجات الحالية (للمسح)</h4>
        <div id="adminProductList"></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="btnShop" onclick="nav('shop')">🏠 السوق</div>
        <div class="nav-item" id="btnCart" onclick="nav('cart')">🛒 السلة <div id="badge" class="badge" style="display:none">0</div></div>
        <div class="nav-item" id="btnAdmin" style="display:none" onclick="nav('admin')">⚙️ الإدارة</div>
    </nav>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="mTitle" style="color:var(--accent); margin-bottom:20px;"></h2>
            <div id="stdFields">
                <div style="text-align:center; font-size:2.5rem; color:var(--accent); font-weight:900;" id="qtyText">0.25 كيلو</div>
                <input type="range" id="qtySlider" min="0.25" max="10" step="0.25" oninput="handleSlider(this.value)">
                <input type="text" id="mSource" placeholder="من مكان محدد؟">
            </div>
            <div id="spcFields" style="display:none;">
                <textarea id="mDesc" placeholder="تفاصيل المشوار.."></textarea>
            </div>
            <button class="btn-main" onclick="confirmAdd()">إضافة للسلة</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:var(--dim); margin-top:20px;">إلغاء</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY",
            authDomain: "nagdaorder.firebaseapp.com",
            projectId: "nagdaorder",
            storageBucket: "nagdaorder.firebasestorage.app",
            messagingSenderId: "99058164922",
            appId: "1:99058164922:web:7063d1686dc82a7ac30e83"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let products = [];
        let cats = [];
        let cart = [];
        let tempImg = "";
        let selectedItem = null;
        let pressTimer;

        // --- نظام الدخول السري (ضغط مطول 2 ثانية) ---
        const header = document.getElementById('mainHeader');
        header.addEventListener('mousedown', startPress);
        header.addEventListener('touchstart', startPress);
        header.addEventListener('mouseup', endPress);
        header.addEventListener('touchend', endPress);

        function startPress() {
            pressTimer = setTimeout(() => {
                if(prompt("كلمة سر الإدارة:") === "135790") {
                    document.getElementById('btnAdmin').style.display = 'block';
                    alert("مرحباً مصطفى! تم فتح لوحة التحكم ✅");
                    nav('admin');
                }
            }, 2000);
        }
        function endPress() { clearTimeout(pressTimer); }

        // --- الأقسام ---
        function fetchCats() {
            db.collection("categories").onSnapshot(snap => {
                cats = [];
                snap.forEach(doc => cats.push({id: doc.id, ...doc.data()}));
                renderCats();
            });
        }

        function addCategory() {
            const name = document.getElementById('newCatName').value;
            if(name) {
                db.collection("categories").add({ name }).then(() => {
                    document.getElementById('newCatName').value = "";
                });
            }
        }

        function deleteCat(id) {
            if(confirm("حذف القسم؟")) db.collection("categories").doc(id).delete();
        }

        function renderCats() {
            const bar = document.getElementById('catsBar');
            const adminList = document.getElementById('adminCatsList');
            const select = document.getElementById('pCatSelect');
            
            bar.innerHTML = `<div class="pill active" onclick="renderShop('الكل')">الكل</div>` + 
                cats.map(c => `<div class="pill" onclick="renderShop('${c.name}')">${c.name}</div>`).join('');
            
            adminList.innerHTML = cats.map(c => `<span class="cat-tag-admin">${c.name} <b onclick="deleteCat('${c.id}')" style="color:red;cursor:pointer">×</b></span>`).join('');
            
            select.innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        // --- المنتجات والرفع ---
        async function imgProcess(el) {
            const file = el.files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 400;
                    const scale = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    tempImg = canvas.toDataURL('image/jpeg', 0.7); // ضغط الصورة
                };
            };
        }

        async function saveProduct() {
            const t = document.getElementById('pTitle').value;
            const c = document.getElementById('pCatSelect').value;
            const u = document.getElementById('pUnit').value;
            const btn = document.getElementById('saveBtn');

            if(!t || !tempImg || !c) return alert("املا البيانات يا بطل!");

            btn.disabled = true; btn.innerText = "جاري الحفظ...";
            
            await db.collection("products").add({
                title: t, cat: c, unit: u, img: tempImg, createdAt: new Date()
            });

            alert("تم الحفظ بنجاح! ✅");
            document.getElementById('pTitle').value = "";
            document.getElementById('pImgInput').value = "";
            tempImg = "";
            btn.disabled = false; btn.innerText = "حفظ في جوجل ☁️";
        }

        function fetchProducts() {
            db.collection("products").orderBy("createdAt", "desc").onSnapshot(snap => {
                products = [];
                snap.forEach(doc => products.push({id: doc.id, ...doc.data()}));
                document.getElementById('loading').style.display = 'none';
                renderShop();
                renderAdminProducts();
            });
        }

        function renderShop(filter = 'الكل') {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = "";
            products.filter(p => filter === 'الكل' || p.cat === filter).forEach(p => {
                grid.innerHTML += `
                    <div class="p-card">
                        <img src="${p.img}">
                        <div class="p-card-info">
                            <h4>${p.title}</h4>
                            <p style="font-size:10px; color:var(--accent)">${p.cat}</p>
                            <button class="btn-main" style="margin-top:10px" onclick="openModal(${JSON.stringify(p).replace(/"/g, '&quot;')})">اطلب</button>
                        </div>
                    </div>`;
            });
        }

        function renderAdminProducts() {
            const list = document.getElementById('adminProductList');
            list.innerHTML = products.map(p => `
                <div class="admin-item">
                    <span>${p.title} (${p.cat})</span>
                    <button class="del-btn" onclick="deleteProduct('${p.id}')">مسح 🗑️</button>
                </div>
            `).join('');
        }

        async function deleteProduct(id) {
            if(confirm("حذف الصنف نهائياً؟")) await db.collection("products").doc(id).delete();
        }

        // --- السلة والمودال ---
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id + 'Page').style.display = 'block';
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('btn' + id.charAt(0).toUpperCase() + id.slice(1)).classList.add('active');
        }

        function openModal(item) {
            selectedItem = item;
            document.getElementById('mTitle').innerText = item.title;
            document.getElementById('stdFields').style.display = 'block';
            document.getElementById('spcFields').style.display = 'none';
            document.getElementById('modal').style.display = 'flex';
            handleSlider(0.25);
        }

        function openSpecial() {
            selectedItem = null;
            document.getElementById('mTitle').innerText = "مشوار خاص 🚀";
            document.getElementById('stdFields').style.display = 'none';
            document.getElementById('spcFields').style.display = 'block';
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function handleSlider(v) { document.getElementById('qtyText').innerText = v + " " + selectedItem.unit; }

        function confirmAdd() {
            const qty = selectedItem ? document.getElementById('qtyText').innerText : "مشوار";
            const desc = document.getElementById('mDesc').value;
            const src = document.getElementById('mSource').value || "أي مكان";
            
            cart.push({
                name: selectedItem ? selectedItem.title : "مشوار خاص",
                qty: qty,
                source: src,
                desc: desc
            });
            updateBadge();
            closeModal();
            document.getElementById('mDesc').value = "";
        }

        function updateBadge() {
            document.getElementById('badge').innerText = cart.length;
            document.getElementById('badge').style.display = cart.length ? 'flex' : 'none';
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            if(!cart.length) { 
                list.innerHTML = "<p style='text-align:center; color:var(--dim)'>السلة فاضية.. اطلب حاجة يا بطل!</p>";
                document.getElementById('checkoutForm').style.display = 'none';
                return;
            }
            document.getElementById('checkoutForm').style.display = 'block';
            list.innerHTML = cart.map((i, idx) => `
                <div class="admin-item">
                    <div><b>${i.name}</b><br><small>${i.qty} - ${i.source}</small></div>
                    <div onclick="cart.splice(${idx},1); renderCart(); updateBadge();" style="cursor:pointer">❌</div>
                </div>
            `).join('');
        }

        function completeOrder() {
            const n = document.getElementById('uName').value, p = document.getElementById('uPhone').value, a = document.getElementById('uAddr').value;
            if(!n || !p || !a) return alert("كمل بيانات التوصيل يا مصطفى");

            let msg = `*✨ طلب جديد من نجدة أوردر ✨*%0A━━━━━━━━━━━━━━%0A`;
            cart.forEach((i, idx) => {
                msg += `*${idx+1}️⃣ ${i.name}*%0A⚖️ الكمية: ${i.qty}%0A📍 المصدر: ${i.source}%0A${i.desc ? `📝 ملاحظات: ${i.desc}%0A` : ''}----------------------------%0A`;
            });
            msg += `%0A*👤 العميل:* ${n}%0A📞 الموبايل: ${p}%0A🏠 العنوان: ${a}`;
            
            window.open(`https://wa.me/201140293628?text=${msg}`);
            cart = []; updateBadge(); nav('shop');
        }

        // تشغيل البداية
        fetchCats();
        fetchProducts();
        nav('shop');
    </script>
</body>
</html>
