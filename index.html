<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #1c1c1e; --danger: #ff453a; --success: #32d74b; --neon: 0 0 15px rgba(0, 210, 255, 0.4); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; overflow-x: hidden; }

        header { padding: 15px 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo-text { font-weight: 900; font-size: 1.1rem; background: linear-gradient(var(--main), var(--sec)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-btn { font-size: 0.75rem; opacity: 0.6; cursor: pointer; }

        nav { position: fixed; bottom: 0; width: 100%; background: rgba(10,10,12,0.98); border-top: 1px solid #2c2c2e; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 3000; }
        .nav-link { color: #8e8e93; text-decoration: none; text-align: center; flex: 1; transition: 0.3s; }
        .nav-link i { font-size: 1.4rem; display: block; margin-bottom: 2px; }
        .nav-link span { font-size: 0.8rem; font-weight: 700; }
        .nav-link.active { color: var(--main); }

        .page { display: none; padding: 0 15px; animation: slideUp 0.4s ease; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .p-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #2c2c2e; position: relative; }
        .p-card img { width: 100%; height: 110px; object-fit: cover; }
        .delete-p-btn { position: absolute; top: 5px; left: 5px; background: var(--danger); border-radius: 50%; width: 24px; height: 24px; display: none; align-items: center; justify-content: center; font-size: 0.8rem; z-index: 10; }
        .admin-mode .delete-p-btn { display: flex; }

        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #333; background: #2c2c2e; color: #fff; font-size: 0.9rem; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; }
        
        .order-card { background: var(--card); border-radius: 15px; padding: 12px; margin-bottom: 12px; border-right: 4px solid var(--main); }
        .cat-item { display: flex; justify-content: space-between; background: #222; padding: 10px; border-radius: 10px; margin-bottom: 8px; font-size: 0.9rem; }
        .hidden-admin { display: none !important; }
        .admin-mode .hidden-admin { display: block !important; }
    </style>
</head>
<body>

<header>
    <div class="logo-text">نجدة أوردر ⚡</div>
    <div class="admin-btn" ondblclick="toggleAdmin()">مصطفى حجازي</div>
</header>

<div id="home" class="page active">
    <div id="prodsHome" class="prod-grid"></div>
</div>

<div id="special" class="page">
    <h3 style="text-align:center; margin: 15px 0;">📦 طلب توصيل خاص</h3>
    <input type="text" id="spDetails" placeholder="إيه الحاجة اللي هنوصلها؟">
    <input type="text" id="spFrom" placeholder="مكان الاستلام (منين؟)">
    <input type="text" id="spTo" placeholder="مكان التسليم (لفين؟)">
    <input type="tel" id="spPhone" placeholder="رقم موبايل المستلم">
    <button class="btn btn-main" onclick="sendSpecialOrder()">إرسال طلب التوصيل 🚀</button>
</div>

<div id="cart" class="page">
    <h3 style="margin: 15px 0;">🛒 السلة</h3>
    <div id="cartList" style="margin-bottom: 15px;"></div>
    <input type="text" id="uName" placeholder="الاسم">
    <input type="text" id="uAddress" placeholder="العنوان بالتفصيل">
    <input type="tel" id="uPhone" placeholder="رقم الموبايل" oninput="checkUserHistory(this.value)">
    <div id="loyaltySection" style="display:none; background:#1c1c1e; padding:12px; border-radius:12px; margin-bottom:12px; border:1px solid #333;">
        <p id="loyaltyText" style="font-size:0.85rem; font-weight: bold;"></p>
    </div>
    <button class="btn btn-main" id="confirmBtn" onclick="confirmFullOrder()">تأكيد وإرسال واتساب 💬</button>
</div>

<div id="admin-orders" class="page">
    <h3 style="text-align:center; margin: 15px 0; color: var(--main);">📈 الطلبات الجديدة</h3>
    <div id="ordersDashboard"></div>
</div>

<div id="admin-settings" class="page">
    <h3 style="text-align:center; margin: 15px 0; color: var(--sec);">⚙️ الإدارة</h3>
    <h4>📂 الأقسام</h4>
    <div style="display:flex; gap:5px; margin-bottom:10px;">
        <input type="text" id="newCatName" placeholder="اسم القسم" style="margin:0;">
        <button class="btn btn-main" style="width:80px; padding:0;" onclick="addCategory()">+</button>
    </div>
    <div id="catsListAdmin"></div>
    <hr style="border:0.5px solid #333; margin:20px 0;">
    <h4>🍕 إضافة منتج</h4>
    <input type="text" id="pTitle" placeholder="اسم المنتج">
    <select id="pCatSelect"></select>
    <input type="file" id="pImage" accept="image/*" onchange="handleImage(this)">
    <button class="btn btn-main" onclick="saveNewProd()">حفظ ✅</button>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><i>🏠</i><span>الرئيسية</span></a>
    <a href="#" class="nav-link" onclick="go('special', this)"><i>📦</i><span>توصيل</span></a>
    <a href="#" class="nav-link" onclick="go('cart', this)"><i>🛒</i><span>السلة</span></a>
    <a href="#" class="nav-link hidden-admin" onclick="go('admin-orders', this)"><i>🔔</i><span>طلبات</span></a>
    <a href="#" class="nav-link hidden-admin" onclick="go('admin-settings', this)"><i>⚙️</i><span>إدارة</span></a>
</nav>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); 
    const db = firebase.firestore();

    let cart = [], tempImg = "", ordersCount = 0;

    function toggleAdmin() { if(prompt("كود الإدارة؟") === "135790") document.body.classList.toggle('admin-mode'); }

    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
        if(id === 'admin-orders') renderOrders();
    }

    async function checkUserHistory(phone) {
        if(phone.length >= 11) {
            const snap = await db.collection("orders").where("p", "==", phone).where("status", "==", "confirmed").get();
            ordersCount = snap.size;
            const sec = document.getElementById('loyaltySection');
            const txt = document.getElementById('loyaltyText');
            sec.style.display = 'block';
            txt.innerHTML = ordersCount >= 9 ? "🎁 مبروك! ده الأوردر العاشر (هدية)" : `عدد أوردراتك السابقة: ${ordersCount}`;
            txt.style.color = ordersCount >= 9 ? "var(--success)" : "#fff";
        }
    }

    async function updateOrderStatus(id, phone) {
        await db.collection("orders").doc(id).update({ status: "confirmed" });
        const snap = await db.collection("orders").where("p", "==", phone).where("status", "==", "confirmed").get();
        if(snap.size >= 10) {
            const batch = db.batch();
            snap.forEach(doc => batch.update(doc.ref, { status: "archived" }));
            await batch.commit();
            alert("تم إتمام الأوردر العاشر وتصفير عداد العميل! 🎁");
        } else {
            alert("تم التأكيد! رصيد العميل: " + snap.size);
        }
    }

    function renderOrders() {
        db.collection("orders").where("status", "==", "pending").onSnapshot(s => {
            let h = '';
            s.forEach(d => {
                const o = d.data();
                h += `<div class="order-card">
                    <p>👤 <b>${o.n}</b> | 📞 ${o.p}</p>
                    <p style="font-size:0.8rem; color:var(--main); margin-top:5px;">📦 ${o.items ? o.items.map(i=>i.t).join(', ') : o.spDetails}</p>
                    <p style="font-size:0.75rem; color:#8e8e93;">📍 ${o.a || 'توصيل خاص'}</p>
                    <div style="display:flex; gap:10px; margin-top:8px;">
                        <button class="btn" style="background:var(--success); color:#000; padding:8px; flex:1;" onclick="updateOrderStatus('${d.id}', '${o.p}')">تأكيد ✅</button>
                        <button class="btn" style="background:var(--danger); padding:8px; flex:1;" onclick="deleteDoc('orders','${d.id}')">حذف 🗑️</button>
                    </div>
                </div>`;
            });
            document.getElementById('ordersDashboard').innerHTML = h || '<p style="text-align:center; padding:20px;">لا توجد طلبات معلقة</p>';
        });
    }

    function addCategory() {
        const n = document.getElementById('newCatName').value;
        if(n) db.collection("categories").add({ n }).then(() => document.getElementById('newCatName').value = "");
    }

    db.collection("categories").onSnapshot(s => {
        let opts = '', list = '';
        s.forEach(d => {
            const name = d.data().n;
            opts += `<option value="${name}">${name}</option>`;
            list += `<div class="cat-item"><span>${name}</span><span style="color:red;" onclick="deleteDoc('categories','${d.id}')">حذف</span></div>`;
        });
        document.getElementById('pCatSelect').innerHTML = opts;
        document.getElementById('catsListAdmin').innerHTML = list;
    });

    function handleImage(input) { const reader = new FileReader(); reader.onload = (e) => tempImg = e.target.result; reader.readAsDataURL(input.files[0]); }
    function saveNewProd() {
        const t = document.getElementById('pTitle').value, c = document.getElementById('pCatSelect').value;
        if(t && tempImg) db.collection("products").add({ title: t, img: tempImg, cat: c, createdAt: new Date() }).then(()=>alert("تم الحفظ"));
    }
    function deleteDoc(col, id) { if(confirm("حذف؟")) db.collection(col).doc(id).delete(); }

    db.collection("products").onSnapshot(s => {
        let h = '';
        s.forEach(d => {
            const p = d.data();
            h += `<div class="p-card">
                    <div class="delete-p-btn" onclick="deleteDoc('products','${d.id}')">✕</div>
                    <img src="${p.img}">
                    <div style="padding:8px; text-align:center;">
                        <p style="font-size:0.85rem; margin-bottom:5px;">${p.title}</p>
                        <button class="btn btn-main" style="padding:6px; font-size:0.75rem;" onclick="addToCart('${p.title}')">إضافة</button>
                    </div>
                </div>`;
        });
        document.getElementById('prodsHome').innerHTML = h;
    });

    function addToCart(t) { cart.push({ t }); renderCart(); }
    function renderCart() { document.getElementById('cartList').innerHTML = cart.map((i,idx)=>`<div class="cat-item"><span>${i.t}</span><span onclick="cart.splice(${idx},1);renderCart()">✕</span></div>`).join(''); }

    async function confirmFullOrder() {
        const n = document.getElementById('uName').value, p = document.getElementById('uPhone').value, a = document.getElementById('uAddress').value;
        if(!n || !p || cart.length === 0) return alert("كمل البيانات والطلبات يا درش!");
        
        let itemsList = cart.map((i, index) => `${index + 1}- ${i.t}`).join('\n');
        let giftText = ordersCount >= 9 ? "\n\n🎁 *هذا الطلب العاشر: هدية توصيل مجاني!*" : "";
        
        let msg = `⚡ *أوردر جديد من نجدة أوردر*\n\n` +
                  `👤 *الاسم:* ${n}\n` +
                  `📞 *الموبايل:* ${p}\n` +
                  `📍 *العنوان:* ${a}\n\n` +
                  `📦 *الطلبات:*\n${itemsList}` +
                  giftText;

        await db.collection("orders").add({ n, p, a, items: cart, status: "pending", createdAt: new Date() });
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
        cart = []; renderCart();
    }

    async function sendSpecialOrder() {
        const det = document.getElementById('spDetails').value, ph = document.getElementById('spPhone').value, 
              from = document.getElementById('spFrom').value, to = document.getElementById('spTo').value;
        
        if(!det || !ph || !from || !to) return alert("اكتب كل تفاصيل التوصيل!");
        
        let msg = `📦 *طلب شحن خاص*\n\n` +
                  `📝 *الحاجة:* ${det}\n` +
                  `🏠 *من:* ${from}\n` +
                  `📍 *إلى:* ${to}\n` +
                  `📞 *رقم المستلم:* ${ph}`;

        await db.collection("orders").add({ n: "توصيل خاص", p: ph, spDetails: det, spFrom: from, spTo: to, status: "pending", createdAt: new Date() });
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
    }
</script>
</body>
</html>
