<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nagda Order Elite | مصطفى حجازي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff; --bg: #030712; --card: #111827;
            --text: #f9fafb; --dim: #9ca3af; --neon-pink: #ff007a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 120px; overflow-x: hidden; }

        /* خلفية متحركة خفيفة */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.05), transparent);
            z-index: -1;
        }

        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo h1 { font-size: 2.2rem; font-weight: 900; background: linear-gradient(to bottom, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .dev-tag { font-size: 0.7rem; letter-spacing: 2px; color: var(--accent); font-weight: 700; opacity: 0.8; }

        .hero-action { 
            margin: 20px; padding: 25px; border-radius: 20px; 
            background: linear-gradient(45deg, #1e1b4b, #312e81);
            border-left: 5px solid var(--accent); position: relative; cursor: pointer;
            transition: 0.3s;
        }
        .hero-action:active { transform: scale(0.97); }

        .cats-bar { display: flex; gap: 10px; overflow-x: auto; padding: 20px; scrollbar-width: none; }
        .pill { 
            padding: 8px 25px; background: var(--card); border-radius: 50px; 
            font-size: 0.85rem; font-weight: 700; white-space: nowrap; border: 1px solid rgba(255,255,255,0.05);
        }
        .pill.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .p-card { background: var(--card); border-radius: 20px; overflow: hidden; position: relative; transition: 0.3s; }
        .p-card img { width: 100%; height: 150px; object-fit: cover; filter: brightness(0.8); }
        .p-card-info { padding: 12px; text-align: center; }
        .btn-main { 
            width: 100%; padding: 12px; border-radius: 12px; border: none; 
            font-weight: 900; cursor: pointer; transition: 0.3s;
            background: var(--accent); color: #000;
        }

        .bottom-nav { 
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(15px);
            border-radius: 20px; display: flex; justify-content: space-around; padding: 15px;
            border: 1px solid rgba(255,255,255,0.1); z-index: 2000;
        }
        .nav-item { color: var(--dim); font-size: 0.8rem; font-weight: 700; cursor: pointer; position: relative; }
        .nav-item.active { color: var(--accent); }
        .badge { 
            position: absolute; top: -10px; right: -10px; background: var(--neon-pink); 
            color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 0.6rem;
            display: flex; align-items: center; justify-content: center;
        }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; align-items: flex-end; justify-content: center;
        }
        .modal-content { 
            background: var(--card); width: 100%; border-radius: 30px 30px 0 0; padding: 30px;
            border-top: 2px solid var(--accent); animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        input, select, textarea { 
            width: 100%; padding: 15px; border-radius: 12px; background: #000;
            border: 1px solid rgba(255,255,255,0.1); color: #fff; margin-bottom: 12px; outline: none;
        }

        .qty-display { font-size: 2.5rem; font-weight: 900; color: var(--accent); text-align: center; margin: 15px 0; }
        input[type=range] { -webkit-appearance: none; height: 6px; background: #333; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 25px; height: 25px; background: var(--accent); border-radius: 50%; }

        .footer-credit { text-align: center; color: var(--dim); font-size: 0.7rem; margin-top: 20px; opacity: 0.5; }
    </style>
</head>
<body>

    <header onclick="adminCheck()">
        <div class="logo">
            <p class="dev-tag">DESIGNED BY</p>
            <h1>نجدة<span>.</span>ORDER</h1>
            <p style="color:var(--accent); font-weight: 900; font-size: 0.8rem;">MOSTAFA HEGAZY</p>
        </div>
    </header>

    <div id="shopPage" class="page">
        <div class="hero-action" onclick="openSpecial()">
            <h3 style="color:#fff">مشوار نجدة الخاص ⚡</h3>
            <p style="color:var(--dim); font-size: 0.8rem;">وصل أماناتك، مفاتيحك، أو أي طرد لأي مكان</p>
        </div>
        <div class="cats-bar" id="catsBar"></div>
        <div class="grid" id="shopGrid"></div>
    </div>

    <div id="cartPage" class="page" style="display:none; padding:20px;">
        <h2 style="margin-bottom:20px;">سلة طلباتك 🛒</h2>
        <div id="cartList"></div>
        <div id="checkoutForm" style="display:none; margin-top:20px;">
            <input type="text" id="uName" placeholder="اسمك">
            <input type="tel" id="uPhone" placeholder="رقم الهاتف">
            <input type="text" id="uAddr" placeholder="العنوان بالتفصيل">
            <button class="btn-main" style="padding:18px; background:var(--accent);" onclick="completeOrder()">إرسال واتساب وانهاء الطلب ✅</button>
        </div>
    </div>

    <div id="adminPage" class="page" style="display:none; padding:20px;">
        <h2 style="color:var(--accent)">لوحة التحكم ⚙️</h2>
        <div style="background:var(--card); padding:20px; border-radius:20px; margin:20px 0;">
            <input type="text" id="pTitle" placeholder="اسم المنتج">
            <input type="file" accept="image/*" onchange="imgProcess(this)">
            <select id="pUnit"><option value="كيلو">كيلو</option><option value="قطعة">قطعة</option></select>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                <input type="checkbox" id="pAllowPrice" style="width:20px; height:20px;">
                <label>تفعيل خيار "اطلب بالسعر"</label>
            </div>
            <select id="pCatSelect"></select>
            <button class="btn-main" onclick="saveProduct()">إضافة المنتج للسوق</button>
        </div>
        <div id="adminProductList"></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="btnShop" onclick="nav('shop')">🏠 السوق</div>
        <div class="nav-item" id="btnCart" onclick="nav('cart')">🛒 السلة <div id="badge" class="badge" style="display:none">0</div></div>
        <div class="nav-item" id="btnAdmin" style="display:none" onclick="nav('admin')">⚙️ الإدارة</div>
    </nav>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="mTitle" style="color:var(--accent); margin-bottom:15px;"></h2>
            
            <div id="stdFields">
                <div class="qty-display" id="qtyText">0.25 كيلو</div>
                <input type="range" id="qtySlider" min="0.25" max="10" step="0.25" value="0.25" oninput="handleSlider(this.value)">
                
                <div id="priceSection" style="display:none; margin-top:20px;">
                    <p style="font-size:0.8rem; color:var(--dim); margin-bottom:5px;">أو اطلب بمبلغ محدد:</p>
                    <input type="text" id="manualQty" placeholder="مثلاً: بـ 50 جنيه">
                </div>
                <input type="text" id="mSource" placeholder="مكان معين نجيب منه؟ (اختياري)" style="margin-top:20px;">
            </div>

            <div id="spcFields" style="display:none;">
                <textarea id="mDesc" placeholder="اكتب طلبك بالتفصيل هنا.."></textarea>
                <input type="text" id="mFrom" placeholder="نستلم منين؟">
                <input type="text" id="mTo" placeholder="نسلم فين؟">
            </div>

            <button class="btn-main" style="padding:15px; margin-top:10px;" onclick="confirmAdd()">إضافة للسلة</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:var(--dim); margin-top:15px;">إلغاء</button>
        </div>
    </div>

    <p class="footer-credit">Developed by: Mostafa Hegazy & Mostafa Abdel-Moneim</p>

    <script>
        const demoData = [
            { id: 1, title: 'طماطم بلدي', cat: 'خضروات', unit: 'كيلو', allowPrice: true, img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400' },
            { id: 2, title: 'كريب زنجر', cat: 'مطاعم', unit: 'قطعة', allowPrice: false, img: 'https://images.unsplash.com/photo-1626074353765-517a681e40be?w=400' }
        ];

        let products = JSON.parse(localStorage.getItem('n_final_p')) || (localStorage.getItem('n_final_p') ? [] : demoData);
        let cats = ['الكل', 'خضروات', 'مطاعم', 'بقالة', 'صيدلية'];
        let cart = [];
        let tempImg = "";
        let selectedItem = null;
        let isSpecialOrder = false;
        let adminClicks = 0;

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id + 'Page').style.display = 'block';
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('btn' + id.charAt(0).toUpperCase() + id.slice(1)).classList.add('active');
            if(id === 'shop') renderShop();
            if(id === 'cart') renderCart();
            if(id === 'admin') renderAdmin();
        }

        function adminCheck() {
            adminClicks++;
            if(adminClicks > 5) { if(prompt("أدخل الكود:")==="135790") { document.getElementById('btnAdmin').style.display='block'; nav('admin'); } adminClicks=0; }
        }

        function renderShop(f = 'الكل') {
            const bar = document.getElementById('catsBar');
            bar.innerHTML = cats.map(c => `<div class="pill ${f===c?'active':''}" onclick="renderShop('${c}')">${c}</div>`).join('');
            const grid = document.getElementById('shopGrid'); grid.innerHTML = "";
            products.filter(p => f === 'الكل' || p.cat === f).forEach(p => {
                grid.innerHTML += `<div class="p-card"><img src="${p.img}"><div class="p-card-info"><h4>${p.title}</h4><button class="btn-main" style="margin-top:10px" onclick="openModal(${JSON.stringify(p).replace(/"/g, '&quot;')})">اطلب</button></div></div>`;
            });
        }

        function openModal(item) {
            isSpecialOrder = false; selectedItem = item;
            document.getElementById('mTitle').innerText = item.title;
            document.getElementById('manualQty').value = "";
            document.getElementById('mSource').value = "";
            document.getElementById('priceSection').style.display = item.allowPrice ? 'block' : 'none';
            const s = document.getElementById('qtySlider');
            if(item.unit === 'كيلو') { s.min = 0.25; s.step = 0.25; s.value = 0.25; } else { s.min = 1; s.step = 1; s.value = 1; }
            handleSlider(s.value);
            document.getElementById('stdFields').style.display = 'block';
            document.getElementById('spcFields').style.display = 'none';
            document.getElementById('modal').style.display = 'flex';
        }

        function handleSlider(v) {
            document.getElementById('qtyText').innerText = v + " " + (selectedItem ? selectedItem.unit : "");
        }

        function openSpecial() {
            isSpecialOrder = true;
            document.getElementById('mTitle').innerText = "مشوار نجدة 🚀";
            document.getElementById('stdFields').style.display = 'none';
            document.getElementById('spcFields').style.display = 'block';
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function confirmAdd() {
            if(isSpecialOrder) {
                const desc = document.getElementById('mDesc').value;
                if(!desc) return alert("اكتب تفاصيل طلبك");
                cart.push({ type: 'مشوار', desc, from: document.getElementById('mFrom').value, to: document.getElementById('mTo').value });
            } else {
                let m = document.getElementById('manualQty').value.trim();
                let finalQty = m !== "" ? m : (document.getElementById('qtySlider').value + " " + selectedItem.unit);
                cart.push({ type: 'منتج', name: selectedItem.title, qty: finalQty, source: document.getElementById('mSource').value.trim() || "أي مكان" });
            }
            closeModal(); updateBadge();
        }

        function updateBadge() {
            const b = document.getElementById('badge');
            b.innerText = cart.length; b.style.display = cart.length ? 'flex' : 'none';
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            if(!cart.length) { list.innerHTML = "<p style='text-align:center; padding:50px; color:var(--dim)'>سلتك فاضية يا بطل</p>"; document.getElementById('checkoutForm').style.display='none'; return; }
            document.getElementById('checkoutForm').style.display='block';
            list.innerHTML = cart.map((i, idx) => `
                <div style="background:var(--card); padding:15px; border-radius:15px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center;">
                    <div>${i.type==='مشوار'? `<b>🚀 ${i.desc}</b>` : `<b>📦 ${i.name}</b><br><small>${i.qty} | ${i.source}</small>`}</div>
                    <div style="color:var(--neon-pink); cursor:pointer;" onclick="cart.splice(${idx},1); renderCart(); updateBadge();">حذف</div>
                </div>
            `).join('');
        }

        function completeOrder() {
            const n = document.getElementById('uName').value;
            const p = document.getElementById('uPhone').value;
            const a = document.getElementById('uAddr').value;
            if(!n || !p || !a) return alert("اكمل بياناتك");

            let msg = `*طلب نجدة أوردر (By مصطفى حجازي)*%0A━━━━━━━━━━━━━━%0A`;
            cart.forEach(i => {
                if(i.type === 'مشوار') msg += `• *مشوار:* ${i.desc}%0A   - من: ${i.from} | لـ: ${i.to}%0A`;
                else msg += `• *${i.name}*%0A   - الكمية: ${i.qty}%0A   - المكان: ${i.source}%0A`;
            });
            msg += `━━━━━━━━━━━━━━%0A👤 *العميل:* ${n}%0A📞 *الهاتف:* ${p}%0A📍 *العنوان:* ${a}`;
            
            window.open(`https://wa.me/201140293628?text=${msg}`);

            // الجزء الخاص بمسح كل شيء تلقائياً بعد الطلب
            cart = []; 
            updateBadge();
            nav('shop');
            alert("تم إرسال طلبك بنجاح! السلة الآن فارغة.");
        }

        function imgProcess(el) {
            const r = new FileReader(); r.onload = (e) => tempImg = e.target.result;
            r.readAsDataURL(el.files[0]);
        }

        function saveProduct() {
            const t = document.getElementById('pTitle').value;
            const u = document.getElementById('pUnit').value;
            const c = document.getElementById('pCatSelect').value;
            const ap = document.getElementById('pAllowPrice').checked;
            if(!t || !tempImg) return alert("بيانات ناقصة");
            products.push({ id: Date.now(), title: t, unit: u, allowPrice: ap, cat: c, img: tempImg });
            localStorage.setItem('n_final_p', JSON.stringify(products));
            renderAdmin(); renderShop();
            alert("تمت الإضافة!");
        }

        function renderAdmin() {
            document.getElementById('pCatSelect').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('adminProductList').innerHTML = products.map((p, idx) => `
                <div style="background:#000; padding:10px; margin-top:5px; border-radius:10px; display:flex; justify-content:space-between;">
                    <span>${p.title}</span>
                    <span style="color:red; cursor:pointer;" onclick="products.splice(${idx},1); localStorage.setItem('n_final_p',JSON.stringify(products)); renderAdmin();">مسح</span>
                </div>
            `).join('');
        }

        renderShop();
    </script>
</body>
</html>
