<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر | مصطفى حجازي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --neon: #00f2ff; --royal: #bc13fe; --dark: #050505; --card: #121212; --success: #00ff88; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--dark); color: #fff; padding-bottom: 90px; }

        header { padding: 15px; background: #000; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: 900; color: var(--neon); text-shadow: 0 0 10px var(--neon); }
        .owner-name { font-size: 0.8rem; color: var(--royal); border: 1px solid var(--royal); padding: 2px 10px; border-radius: 8px; font-weight: bold; }

        .hero-fixed { 
            margin: 15px; padding: 20px; background: linear-gradient(135deg, #121212, #000);
            border: 2px solid var(--royal); border-radius: 20px; box-shadow: 0 0 15px rgba(188, 19, 254, 0.3);
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }

        .cats-bar { display: flex; gap: 10px; overflow-x: auto; padding: 10px 15px; background: #080808; position: sticky; top: 60px; z-index: 999; scrollbar-width: none; }
        .cat-item { padding: 8px 18px; background: #1a1a1a; border-radius: 50px; white-space: nowrap; font-size: 0.85rem; border: 1px solid #333; color: #777; transition: 0.3s; }
        .cat-item.active { background: var(--neon); color: #000; border-color: var(--neon); font-weight: bold; }

        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #222; position: relative; }
        .p-card img { width: 100%; height: 120px; object-fit: cover; }
        .p-info { padding: 10px; text-align: center; }
        .p-info h4 { font-size: 0.85rem; height: 35px; overflow: hidden; margin-bottom: 10px; }

        .btn-order { width: 100%; padding: 12px; border-radius: 12px; border: none; background: linear-gradient(45deg, var(--neon), var(--royal)); color: #fff; font-weight: 900; font-size: 0.85rem; cursor: pointer; }

        .admin-section { background: #111; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px dashed var(--royal); }
        .order-card { background: #000; border: 1px solid #222; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-right: 4px solid var(--neon); }
        .order-card.done { border-right-color: var(--success); opacity: 0.6; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: #0a0a0a; width: 100%; border-radius: 25px; padding: 25px; border: 1px solid var(--royal); max-width: 400px; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; margin-bottom: 10px; outline: none; font-size: 1rem; }

        .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #222; }
        .nav-link { color: #555; text-decoration: none; font-weight: 700; font-size: 0.85rem; }
        .nav-link.active { color: var(--neon); }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="logoAdmin">نجدة أوردر</div>
        <div class="owner-name">مصطفى حجازي ⚡</div>
    </header>

    <div id="shopPage" class="page">
        <div class="hero-fixed" onclick="openModal('deliveryModal')">
            <div class="hero-text">
                <h2>🚀 توصيل مستلزمات شخصية</h2>
                <p>اطلب وهنوصل لأي حد في أي مكان</p>
            </div>
            <button class="btn-order" style="width:auto; padding:8px 15px;">اطلب</button>
        </div>
        <div class="cats-bar" id="catsList"></div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div id="cartPage" class="page" style="display:none; padding:15px;">
        <h2 style="color:var(--neon); margin-bottom:15px; text-align:center;">سلة الطلبات 🛒</h2>
        <div id="cartItems"></div>
        <div id="orderForm" style="display:none; margin-top:20px; background:#111; padding:15px; border-radius:15px;">
            <input type="text" id="uName" placeholder="اسمك أنت">
            <input type="tel" id="uPhone" placeholder="رقم موبايلك">
            <input type="text" id="uAddr" placeholder="عنوانك بالتفصيل">
            <button class="btn-order" style="padding:15px;" onclick="confirmOrder()">تأكيد الطلب 🚀</button>
        </div>
    </div>

    <div id="adminPage" class="page" style="display:none; padding:15px;">
        <div class="admin-section">
            <h3 style="color:var(--neon); margin-bottom:15px;">🔔 إدارة الطلبات</h3>
            <button class="btn-order" style="background: #444; margin-bottom: 15px; border: 1px solid red; font-size: 0.75rem;" onclick="clearAllConfirmedOrders()">🗑️ مسح كل السجل المؤكد</button>
            <div id="adminOrdersList"></div>
        </div>

        <div class="admin-section">
            <h3 style="color:var(--royal); margin-bottom:10px;">📂 الإعدادات</h3>
            <input type="text" id="catInput" placeholder="اسم القسم الجديد">
            <button class="btn-order" onclick="saveCat()">حفظ القسم</button>
            <hr style="margin:15px 0; border-color:#222;">
            <input type="text" id="pTitle" placeholder="اسم المنتج">
            <select id="pCatSelect"></select>
            <input type="file" onchange="handleImg(this)">
            <button class="btn-order" onclick="saveProd()">حفظ المنتج</button>
        </div>
    </div>

    <nav class="nav-bottom">
        <a href="#" class="nav-link active" id="btnShop" onclick="nav('shop')">🏠 المتجر</a>
        <a href="#" class="nav-link" id="btnCart" onclick="nav('cart')">🛒 السلة</a>
        <a href="#" id="adminLink" class="nav-link" style="display:none;" onclick="nav('admin')">⚙️ الإدارة</a>
    </nav>

    <div class="modal" id="deliveryModal"><div class="modal-box"><h3>توصيل خاص</h3><textarea id="dWhat" placeholder="هنجيب إيه؟"></textarea><input type="text" id="dFrom" placeholder="منين؟"><input type="text" id="dTo" placeholder="لمين؟"><input type="text" id="dAddr" placeholder="العنوان"><input type="tel" id="dPhone" placeholder="التليفون"><button class="btn-order" onclick="addDelivery()">إضافة للسلة</button><button onclick="closeModal('deliveryModal')">إلغاء</button></div></div>
    <div class="modal" id="pModal"><div class="modal-box"><h3 id="mTitle"></h3><input type="text" id="mQty" placeholder="الكمية"><input type="text" id="mNote" placeholder="ملاحظة"><button class="btn-order" onclick="addP()">إضافة للسلة</button><button onclick="closeModal('pModal')">إلغاء</button></div></div>

    <script>
        const conf = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
        firebase.initializeApp(conf); const db = firebase.firestore();
        let cats=[], prods=[], cart=[], tempImg="", selectedP=null, isAdmin=false;

        // الدخول للإدارة
        let timer; document.getElementById('logoAdmin').addEventListener('touchstart',()=> timer=setTimeout(()=>{if(prompt("Pass?")==="135790"){isAdmin=true; document.getElementById('adminLink').style.display='block'; nav('admin');}},4000));
        document.getElementById('logoAdmin').addEventListener('touchend',()=>clearTimeout(timer));

        function init() {
            db.collection("categories").onSnapshot(s=>{cats=[]; s.forEach(d=>cats.push({id:d.id, ...d.data()})); renderCats();});
            db.collection("products").orderBy("createdAt","desc").onSnapshot(s=>{prods=[]; s.forEach(d=>prods.push({id:d.id, ...d.data()})); renderProducts();});
            db.collection("orders").orderBy("createdAt","desc").onSnapshot(s=>renderAdminOrders(s));
        }

        function renderAdminOrders(snap) {
            const list = document.getElementById('adminOrdersList'); list.innerHTML = "";
            snap.forEach(doc => {
                const o = doc.data(); const isDone = o.status === 'confirmed';
                list.innerHTML += `<div class="order-card ${isDone?'done':''}">
                    <b>👤 ${o.userName}</b> | <small>${o.createdAt?.toDate().toLocaleTimeString('ar-EG')}</small>
                    <div style="font-size:0.8rem; margin:10px 0;">${o.items.map(i=>i.type==='delivery'?`🛵 توصيل: ${i.w}`:`📦 ${i.t} (ج:${i.q})`).join('<br>')}</div>
                    <p style="font-size:0.7rem; color:#888;">📍 ${o.address} | 📞 ${o.userPhone}</p>
                    ${!isDone ? `<div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn-order" style="background:var(--success); color:#000;" onclick="approveOrder('${doc.id}', '${o.userPhone}', '${o.userName}')">صح ✅</button>
                        <button class="btn-order" style="background:red;" onclick="delDoc('orders','${doc.id}')">حذف ❌</button>
                    </div>` : `<button class="btn-order" style="background:#333;" onclick="delDoc('orders','${doc.id}')">مسح من السجل</button>`}
                </div>`;
            });
        }

        async function approveOrder(id, phone, name) {
            await db.collection("orders").doc(id).update({ status: "confirmed" });
            const ref = db.collection("users_stats").doc(phone);
            const doc = await ref.get();
            let newCount = (doc.exists ? (doc.data().count || 0) : 0) + 1;
            await ref.set({ count: newCount }, { merge: true });

            if(newCount % 10 === 0) {
                let msg = `*🎊 مبروك يا ${name}! 🎊*\n\nأنت كملت ${newCount} أوردرات مع *نجدة أوردر* ⚡\nوليك عندنا هدية مجانية بمناسبة أوردرك رقم 10! 🎁\n\nابعت الرسالة دي عشان نفعل الهدية.`;
                window.open(`https://wa.me/20${phone}?text=${encodeURIComponent(msg)}`);
                alert("تم التأكيد! العميل وصل للهدية والواتساب فتح بالرسالة ✅");
            } else { alert(`تم التأكيد! العميل أتم ${newCount} أوردرات.`); }
        }

        async function clearAllConfirmedOrders() {
            if(confirm("مسح كل السجل المؤكد؟ (مش بيأثر على عدد أوردرات العملاء)")) {
                const snap = await db.collection("orders").where("status","==","confirmed").get();
                const b = db.batch(); snap.forEach(d=>b.delete(d.ref)); await b.commit();
                alert("تم تنظيف السجل! 🧹");
            }
        }

        async function confirmOrder() {
            const n=document.getElementById('uName').value, ph=document.getElementById('uPhone').value, ad=document.getElementById('uAddr').value;
            if(!n || !ph || !ad) return alert("كمل بياناتك!");
            await db.collection("orders").add({ userName:n, userPhone:ph, address:ad, items:cart, status:"pending", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            let msg = `*✨ أوردر جديد - نجدة أوردر ⚡*\n\n${cart.map(i=>i.type==='delivery'?`🛵 توصيل: ${i.w}`:`📦 منتج: ${i.t} (ج:${i.q})`).join('\n')}\n\n*العميل:* ${n}\n📞 تليفون: ${ph}`;
            window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
            cart=[]; nav('shop');
        }

        // باقي الوظائف
        function renderCats() { document.getElementById('catsList').innerHTML = `<div class="cat-item active" onclick="filter('الكل',this)">الكل</div>` + cats.map(c=>`<div class="cat-item" onclick="filter('${c.name}',this)">${c.name}</div>`).join(''); document.getElementById('pCatSelect').innerHTML = cats.map(c=>`<option>${c.name}</option>`).join(''); }
        function renderProducts(f='الكل') { const g = document.getElementById('productsGrid'); g.innerHTML=""; prods.filter(p=> f==='الكل' || p.cat===f).forEach(p=>{ g.innerHTML += `<div class="p-card"><img src="${p.img}"><div class="p-info"><h4>${p.title}</h4><button class="btn-order" onclick='openPModal(${JSON.stringify(p)})'>طلب</button></div></div>`; }); }
        function openModal(id){ document.getElementById(id).style.display='flex'; }
        function closeModal(id){ document.getElementById(id).style.display='none'; }
        function openPModal(p){ selectedP=p; document.getElementById('mTitle').innerText=p.title; openModal('pModal'); }
        function addDelivery() { cart.push({type:'delivery', w:document.getElementById('dWhat').value}); closeModal('deliveryModal'); alert("تم ✅"); }
        function addP() { cart.push({type:'product', t:selectedP.title, q:document.getElementById('mQty').value}); closeModal('pModal'); alert("تم ✅"); }
        function nav(id) { document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById(id+'Page').style.display='block'; document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active')); if(id!=='admin') document.getElementById('btn'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('active'); if(id==='cart') renderCart(); }
        function renderCart() { const list = document.getElementById('cartItems'); list.innerHTML = cart.map((i,x)=>`<div style="background:#1a1a1a; padding:10px; margin-bottom:5px;">${i.type==='delivery'?`🛵 توصيل: ${i.w}`:`📦 ${i.t} (ج:${i.q})`}<button onclick="cart.splice(${x},1); renderCart()" style="float:left; color:red; background:none; border:none;">X</button></div>`).join(''); document.getElementById('orderForm').style.display = cart.length ? 'block' : 'none'; }
        async function saveCat() { await db.collection("categories").add({name:document.getElementById('catInput').value}); }
        function handleImg(el){ const r=new FileReader(); r.readAsDataURL(el.files[0]); r.onload=(e)=>tempImg=e.target.result; }
        async function saveProd() { await db.collection("products").add({title:document.getElementById('pTitle').value, cat:document.getElementById('pCatSelect').value, img:tempImg, createdAt: new Date()}); alert("تم الحفظ ✅"); }
        async function delDoc(col,id){ if(confirm("حذف؟")) await db.collection(col).doc(id).delete(); }
        function filter(n,el){ document.querySelectorAll('.cat-item').forEach(i=>i.classList.remove('active')); el.classList.add('active'); renderProducts(n); }
        init();
    </script>
</body>
</html>
