<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم نجدة أوردر - Nagda Order</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --main-color: #00adb5; --bg-dark: #121212; --card-bg: #1e1e1e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 20px; }
        h2 { color: var(--main-color); border-bottom: 2px solid var(--main-color); padding-bottom: 10px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; box-sizing: border-box; }
        input, select { background: #252525; color: white; }
        button { cursor: pointer; border: none; font-weight: bold; transition: 0.3s; }
        .save-btn { background-color: var(--main-color); color: white; }
        .save-btn:hover { background-color: #008f96; }
        .delete-btn { background-color: #ff4d4d; color: white; width: auto; padding: 5px 15px; }
        .product-item { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .product-info { display: flex; align-items: center; gap: 15px; }
        .product-img { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; background: #444; }
        .loader { color: #888; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 إضافة منتج لـ نجدة أوردر</h2>
    <div class="card">
        <input type="text" id="pName" placeholder="اسم المنتج (مثلاً: بصل أحمر)">
        <input type="number" id="pPrice" placeholder="السعر (ج.م)">
        
        <select id="pUnit">
            <option value="كيلو">كيلو</option>
            <option value="قطعة">قطعة</option>
            <option value="ربطة">ربطة</option>
            <option value="كرتونة">كرتونة</option>
        </select>

        <input type="text" id="pCategory" placeholder="القسم (مثلاً: خضروات)">
        
        <label style="font-size: 12px; color: #aaa;">صورة المنتج (بتتصغر تلقائي):</label>
        <input type="file" id="pImage" accept="image/*">
        
        <button class="save-btn" id="saveBtn" onclick="handleSave()">حفظ في جوجل ☁️</button>
    </div>

    <h2>📦 المنتجات الموجودة (مسح وتعديل)</h2>
    <div id="productsDisplay">
        <p class="loader">جارِ جلب المنتجات من السيرفر...</p>
    </div>
</div>

<script>
    // إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
        apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY",
        authDomain: "nagdaorder.firebaseapp.com",
        projectId: "nagdaorder",
        storageBucket: "nagdaorder.firebasestorage.app",
        messagingSenderId: "99058164922",
        appId: "1:99058164922:web:7063d1686dc82a7ac30e83"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // دالة سحرية لضغط الصورة عشان جوجل ما يرفضهاش
    async function processImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 300; 
                    const scale = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6)); // جودة 60% عشان الحجم يبقى صغير
                };
            };
        });
    }

    // حفظ المنتج
    async function handleSave() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const unit = document.getElementById('pUnit').value;
        const category = document.getElementById('pCategory').value;
        const imageFile = document.getElementById('pImage').files[0];
        const btn = document.getElementById('saveBtn');

        if (!name || !price) {
            alert("يا درش لازم تكتب الاسم والسعر!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "جاري الحفظ...";

        try {
            let finalImg = "";
            if (imageFile) {
                finalImg = await processImage(imageFile);
            }

            await db.collection("products").add({
                name: name,
                price: price,
                unit: unit,
                category: category || "عام",
                img: finalImg,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("تم الحفظ في قلب جوجل بنجاح! ✅");
            document.getElementById('pName').value = "";
            document.getElementById('pPrice').value = "";
            document.getElementById('pImage').value = "";
        } catch (error) {
            alert("حصل غلط: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "حفظ في جوجل ☁️";
        }
    }

    // عرض المنتجات والمسح (Live Update)
    db.collection("products").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const display = document.getElementById('productsDisplay');
        display.innerHTML = "";
        
        if (snapshot.empty) {
            display.innerHTML = "<p style='text-align:center;'>مفيش منتجات لسه..</p>";
            return;
        }

        snapshot.forEach((doc) => {
            const data = doc.data();
            display.innerHTML += `
                <div class="product-item">
                    <div class="product-info">
                        ${data.img ? `<img src="${data.img}" class="product-img">` : `<div class="product-img"></div>`}
                        <div>
                            <strong>${data.name}</strong><br>
                            <span style="color:var(--main-color)">${data.price} ج.م / ${data.unit}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteItem('${doc.id}')">مسح 🗑️</button>
                </div>
            `;
        });
    });

    // دالة المسح
    function deleteItem(id) {
        if (confirm("هتمسح المنتج ده خالص من السيرفر؟")) {
            db.collection("products").doc(id).delete()
            .then(() => console.log("Deleted"))
            .catch(err => alert("متمسحش ليه؟: " + err.message));
        }
    }
</script>

</body>
</html>
