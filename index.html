<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #1c1c1e; --danger: #ff453a; --success: #32d74b; --neon: 0 0 15px rgba(0, 210, 255, 0.4); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

        header { padding: 15px 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo-text { font-weight: 900; font-size: 1.2rem; background: linear-gradient(var(--main), var(--sec)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-btn { font-size: 0.8rem; opacity: 0.6; cursor: pointer; }

        .promo-banner { background: linear-gradient(90deg, var(--main), var(--sec)); padding: 12px; text-align: center; font-weight: 700; border-radius: 15px; margin: 15px; box-shadow: var(--neon); font-size: 0.85rem; }

        .cats-wrapper { display: flex; gap: 10px; overflow-x: auto; padding: 0 15px 15px; scrollbar-width: none; }
        .cat-chip { background: #2c2c2e; padding: 8px 20px; border-radius: 25px; white-space: nowrap; font-size: 0.85rem; transition: 0.3s; cursor: pointer; }
        .cat-chip.active { background: var(--main); color: #000; font-weight: bold; }

        .page { display: none; padding: 0 15px; animation: slideUp 0.4s ease; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .p-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #2c2c2e; text-align: center; }
        .p-card img { width: 100%; height: 130px; object-fit: cover; }
        .p-info { padding: 10px; }

        input, textarea, select { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #333; background: #2c2c2e; color: #fff; outline: none; }
        .btn { width: 100%; padding: 16px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; }
        
        /* Progress Bar Style */
        .progress-container { background: #222; border-radius: 10px; height: 10px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: var(--main); height: 100%; width: 0%; transition: 0.5s; }

        nav { position: fixed; bottom: 0; width: 100%; background: rgba(10,10,12,0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 10px 5px 25px; border-top: 1px solid #2c2c2e; z-index: 3000; }
        .nav-link { color: #8e8e93; text-decoration: none; text-align: center; font-size: 0.7rem; flex: 1; }
        .nav-link.active { color: var(--main); }

        .order-card { background: var(--card); border-radius: 20px; padding: 15px; margin-bottom: 15px; border-right: 5px solid var(--main); }
        .order-actions { display: flex; gap: 10px; margin-top: 10px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 4000; display: none; align-items: flex-end; }
        .modal-content { background: var(--card); width: 100%; padding: 30px 20px; border-radius: 30px 30px 0 0; border-top: 2px solid var(--main); }

        .hidden-admin { display: none !important; }
        .admin-mode .hidden-admin { display: block !important; }
    </style>
</head>
<body>

<header>
    <div class="logo-text">نجدة أوردر ⚡</div>
    <div class="admin-btn" id="adminTrigger" onmousedown="startPress()" onmouseup="endPress()" ontouchstart="startPress()" ontouchend="endPress()">مصطفى حجازي</div>
</header>

<div class="promo-banner">🎁 اطلب 9 أوردرات والعاشر توصيله مجاناً! 🎁</div>

<div id="home" class="page active">
    <div class="cats-wrapper" id="catsHeader"></div>
    <div class="prod-grid" id="prodsHome"></div>
</div>

<div id="special" class="page">
    <input type="text" id="spDetails" placeholder="إيه الحاجة اللي هنوصلها؟">
    <input type="text" id="spFrom" placeholder="مكان الاستلام">
    <input type="text" id="spTo" placeholder="مكان التسليم">
    <input type="tel" id="spPhone" placeholder="رقم هاتف المستلم">
    <button class="btn btn-main" onclick="sendSpecialOrder()">إرسال طلب شحن خاص 🚀</button>
</div>

<div id="cart" class="page">
    <div id="cartList"></div>
    <input type="text" id="uName" placeholder="الاسم">
    <input type="text" id="uAddress" placeholder="العنوان">
    <input type="tel" id="uPhone" placeholder="رقم الموبايل" oninput="checkUserHistory(this.value)">
    
    <div id="loyaltySection" style="display:none; background:#1c1c1e; padding:15px; border-radius:15px; margin-bottom:15px; border:1px solid #333;">
        <p id="loyaltyText" style="font-size:0.85rem; margin-bottom:5px;"></p>
        <div class="progress-container"><div id="loyaltyBar" class="progress-bar"></div></div>
    </div>

    <button class="btn btn-main" id="confirmBtn" onclick="confirmFullOrder()">تأكيد الطلب 💬</button>
</div>

<div id="admin" class="page">
    <h3 style="text-align:center; margin-bottom:20px;">⚙️ الإدارة</h3>
    <div id="ordersDashboard"></div>
    <hr style="border:0.5px solid #333; margin:20px 0;">
    <input type="text" id="pTitle" placeholder="اسم المنتج">
    <select id="pCatSelect"></select>
    <input type="file" id="pImage" accept="image/*" onchange="handleImage(this)">
    <button class="btn btn-main" onclick="saveNewProd()">إضافة للمنيو</button>
</div>

<div id="orderModal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 id="modalTitle"></h3>
        <input type="number" id="modalQty" value="1" min="1">
        <textarea id="modalNotes" placeholder="ملاحظات.."></textarea>
        <button class="btn btn-main" onclick="addToCart()">أضف للسلة</button>
    </div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><i>🏠</i>الرئيسية</a>
    <a href="#" class="nav-link" onclick="go('special', this)"><i>📦</i>شحن خاص</a>
    <a href="#" class="nav-link" onclick="go('cart', this)"><i>🛒</i>السلة</a>
    <a href="#" class="nav-link hidden-admin" id="adminLink" onclick="go('admin', this)"><i>⚙️</i>الإدارة</a>
</nav>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); 
    const db = firebase.firestore();

    let cart = [], tempImg = "", pressTimer, ordersCount = 0, currentProd = "";

    function startPress() { pressTimer = setTimeout(() => { if(prompt("شفرة الإدارة؟") === "135790") document.body.classList.add('admin-mode'); }, 1500); }
    function endPress() { clearTimeout(pressTimer); }

    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
        if(id === 'admin') renderOrders();
    }

    async function checkUserHistory(phone) {
        if(phone.length >= 11) {
            const snap = await db.collection("orders").where("p", "==", phone).get();
            ordersCount = snap.size;
            const sec = document.getElementById('loyaltySection');
            const bar = document.getElementById('loyaltyBar');
            const txt = document.getElementById('loyaltyText');
            const btn = document.getElementById('confirmBtn');

            sec.style.display = 'block';
            let percent = (ordersCount / 9) * 100;
            bar.style.width = Math.min(percent, 100) + '%';

            if(ordersCount >= 9) {
                txt.innerHTML = "🎁 مبروك! وصلت للأوردر الهدية (التوصيل مجاناً)";
                txt.style.color = "var(--success)";
                bar.style.background = "var(--success)";
                btn.innerHTML = "تأكيد طلب الهدية المجاني 🎁";
            } else {
                txt.innerHTML = `فاضلك ${9 - ordersCount} أوردرات وتكسب توصيل مجاني!`;
                txt.style.color = "#fff";
                bar.style.background = "var(--main)";
                btn.innerHTML = "تأكيد وإرسال واتساب 💬";
            }
        }
    }

    async function confirmFullOrder() {
        const n = document.getElementById('uName').value, p = document.getElementById('uPhone').value, a = document.getElementById('uAddress').value;
        if(!n || !p || cart.length === 0) return alert("البيانات ناقصة يا درش!");

        const isFree = (ordersCount >= 9);
        let msg = `🛒 *أوردر جديد*\n`;
        msg += `👤 الاسم: ${n}\n📞 الهاتف: ${p}\n📍 العنوان: ${a}\n\n`;
        msg += `📦 *الطلبات:*\n` + cart.map(i => `- ${i.t} (عدد: ${i.q})`).join('\n');

        if(isFree) msg += `\n\n🎁 *أوردر هدية (التوصيل مجاني)*\n*10MostafaHegazy10*`;

        await db.collection("orders").add({ n, p, a, items: cart, isFree, createdAt: new Date() });
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
        cart = []; renderCart();
        alert("تم إرسال طلبك بنجاح! ✅");
    }

    function renderOrders() {
        db.collection("orders").orderBy("createdAt", "desc").limit(15).onSnapshot(s => {
            let h = '';
            s.forEach(d => {
                const o = d.data();
                h += `<div class="order-card">
                    <p>👤 ${o.n} | 📞 ${o.p}</p>
                    <p style="font-size:0.8rem; color:var(--main)">${o.items ? o.items.map(i=>i.t).join(', ') : 'طلب خاص'}</p>
                    ${o.isFree ? '<b style="color:var(--success)">🎁 هدية</b>' : ''}
                    <div class="order-actions">
                        <button class="btn" style="background:var(--success); color:#000; flex:1; padding:8px;" onclick="confirmOrderAdmin()">تأكيد ✅</button>
                        <button class="btn" style="background:var(--danger); color:#fff; flex:1; padding:8px;" onclick="deleteOrderAdmin('${d.id}')">حذف 🗑️</button>
                    </div>
                </div>`;
            });
            document.getElementById('ordersDashboard').innerHTML = h || 'لا يوجد طلبات حالياً';
        });
    }

    function confirmOrderAdmin() { alert("تم التأكيد! الأوردر ده هيفضل في حساب العميل ✅"); }
    function deleteOrderAdmin(id) { if(confirm("حذف نهائي؟")) db.collection("orders").doc(id).delete(); }

    // دوال المنيو والصور
    function handleImage(input) { const reader = new FileReader(); reader.onload = (e) => tempImg = e.target.result; reader.readAsDataURL(input.files[0]); }
    function saveNewProd() { const t = document.getElementById('pTitle').value; if(t && tempImg) db.collection("products").add({ title: t, img: tempImg, createdAt: new Date() }).then(()=>alert("تمت الإضافة")); }
    function openModal(t) { currentProd = t; document.getElementById('modalTitle').innerText = t; document.getElementById('orderModal').style.display='flex'; }
    function closeModal() { document.getElementById('orderModal').style.display='none'; }
    function addToCart() { cart.push({ t: currentProd, q: document.getElementById('modalQty').value }); closeModal(); renderCart(); }
    function renderCart() { document.getElementById('cartList').innerHTML = cart.map((i,idx)=>`<div style="padding:10px; background:#222; margin-bottom:5px; border-radius:10px; display:flex; justify-content:space-between;"><span>${i.t}</span><span onclick="cart.splice(${idx},1);renderCart()">✕</span></div>`).join(''); }
    
    // لود المنتجات
    db.collection("products").onSnapshot(s => {
        let h = ''; s.forEach(d => { const p = d.data(); h += `<div class="p-card" onclick="openModal('${p.title}')"><img src="${p.img}"><div class="p-info"><h5>${p.title}</h5></div></div>`; });
        document.getElementById('prodsHome').innerHTML = h;
    });
</script>
</body>
</html>
