<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #16161a; --danger: #ff3131; --success: #00ff88; --neon-text: 0 0 10px var(--main), 0 0 20px var(--main); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; }

        /* أولاً: الهيدر النيون المطور مع ميزة الإخفاء */
        header { 
            padding: 15px; background: #000; border-bottom: 2px solid var(--main); 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }
        .neon-logo { 
            width: 45px; height: 45px; border: 2px solid var(--main); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: var(--neon-text); color: var(--main); font-weight: 900; text-shadow: var(--neon-text);
        }
        .neon-name { 
            color: #fff; text-shadow: 0 0 10px var(--sec), 0 0 20px var(--sec); 
            font-weight: 900; font-size: 1.1rem; user-select: none;
        }

        /* ثالثاً: إعلان العرض */
        .promo-banner {
            background: linear-gradient(90deg, var(--main), var(--sec));
            padding: 10px; text-align: center; font-weight: bold; border-radius: 10px;
            margin: 10px; font-size: 0.9rem; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

        .page { display: none; padding: 15px; }
        .page.active { display: block; }

        /* تنسيق المدخلات والكروت */
        input, textarea, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #222; background: #000; color: #fff; outline: none; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; }
        .admin-only { display: none; }
        .admin-mode .admin-only { display: block !important; }

        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .p-card { background: var(--card); padding: 10px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .p-card img { width: 100%; height: 110px; border-radius: 15px; object-fit: cover; }

        nav { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #222; }
        .nav-link { color: #555; text-decoration: none; text-align: center; font-size: 0.75rem; flex: 1; }
        .nav-link.active { color: var(--main); }
        .nav-link span { font-size: 1.5rem; display: block; }
        
        .order-count-badge { background: var(--sec); color: #fff; padding: 4px 12px; border-radius: 15px; font-size: 0.85rem; margin-top: 5px; display: inline-block; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 25px; border: 2px solid var(--main); width: 100%; max-width: 400px; box-shadow: 0 0 25px var(--main); }
    </style>
</head>
<body class="">

<header>
    <div style="color:var(--main); font-weight:900; text-shadow: var(--neon-text);">نجدة أوردر ⚡</div>
    <div class="neon-logo">⚡</div>
    <div class="neon-name" id="adminTrigger" onmousedown="startPress()" onmouseup="endPress()" ontouchstart="startPress()" ontouchend="endPress()">مصطفى حجازي</div>
</header>

<div class="promo-banner">🔥 اطلب 9 أوردرات والعاشر توصيله مجاناً! 🔥</div>

<div id="orderModal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modalTitle" style="color:var(--main); margin-bottom:15px; text-shadow: var(--neon-text);"></h3>
        <input type="number" id="modalQty" value="1" min="1" placeholder="الكمية">
        <textarea id="modalNotes" placeholder="أضف ملاحظاتك هنا (مثل: بدون شطة، السكر خفيف...)"></textarea>
        <button class="btn btn-main" onclick="confirmOrder()">إضافة للسلة 🛒</button>
        <button class="btn" style="background:transparent; color:#555;" onclick="closeModal('orderModal')">إلغاء</button>
    </div>
</div>

<div id="home" class="page active">
    <div id="catsHeader" style="display:flex; gap:10px; overflow-x:auto; margin-bottom:15px; padding-bottom:10px;"></div>
    <div class="prod-grid" id="prodsHome"></div>
</div>

<div id="cart" class="page">
    <div style="background:var(--card); padding:20px; border-radius:25px; border:1px solid #222;">
        <h3 style="color:var(--main); text-align:center; margin-bottom:15px;">🛒 مراجعة السلة</h3>
        <div id="cartList" style="margin-bottom:20px;"></div>
        
        <input type="text" id="uName" placeholder="الاسم بالكامل">
        <input type="text" id="uAddress" placeholder="العنوان بالتفصيل">
        <input type="tel" id="uPhone" placeholder="رقم الهاتف" oninput="checkLoyalty(this.value)">
        
        <div id="loyaltyBadgeContainer" style="text-align:center; margin:10px 0;"></div>
        
        <button class="btn btn-main" onclick="sendFullCart()">تأكيد الطلب 💬</button>
    </div>
</div>

<div id="admin" class="page">
    <div style="background:var(--card); padding:20px; border-radius:25px; border:1px solid var(--sec);">
        <h3 style="color:var(--sec); text-align:center; margin-bottom:15px;">⚙️ لوحة التحكم</h3>
        
        <h4>📂 إدارة الأقسام</h4>
        <input type="text" id="cName" placeholder="اسم القسم">
        <input type="text" id="cImg" placeholder="رابط صورة القسم">
        <button class="btn btn-main" onclick="addCat()">إضافة قسم +</button>
        <div id="manageCats" style="margin-top:10px;"></div>

        <hr style="margin:20px 0; border:0.5px solid #333;">

        <h4>🍔 إدارة المنتجات</h4>
        <input type="text" id="pTitle" placeholder="اسم المنتج">
        <input type="text" id="pImg" placeholder="رابط صورة المنتج">
        <select id="pCatSelect"></select>
        <button class="btn btn-main" onclick="addProd()">إضافة منتج +</button>
        <div id="manageProds" style="margin-top:10px;"></div>
    </div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><span>🏠</span>الرئيسية</a>
    <a href="#" class="nav-link" onclick="go('cart', this)"><span>🛒</span>السلة</a>
    <a href="#" class="nav-link admin-only" id="adminNavLink" onclick="go('admin', this)"><span>⚙️</span>الإدارة</a>
</nav>

<script>
    // Firebase Init
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    let currentProd = "", cart = [], pressTimer, userOrdersCount = 0;

    // ميزة الضغطة المطولة (1.5 ثانية) لفتح الإدارة
    function startPress() { pressTimer = setTimeout(() => { 
        let pass = prompt("أدخل شفرة الإدارة:");
        if(pass === "135790") {
            document.body.classList.add('admin-mode');
            alert("تم تفعيل وضع الإدارة ✅ (الزرار ظهر تحت)");
        }
    }, 1500); }
    function endPress() { clearTimeout(pressTimer); }

    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
    }

    // --- إدارة البيانات ---
    function addCat() {
        const n = document.getElementById('cName').value, i = document.getElementById('cImg').value;
        if(n) db.collection("categories").add({ n, i }).then(() => document.getElementById('cName').value="");
    }

    function addProd() {
        const t = document.getElementById('pTitle').value, i = document.getElementById('pImg').value, c = document.getElementById('pCatSelect').value;
        if(t && c) db.collection("products").add({ t, i, c }).then(() => document.getElementById('pTitle').value="");
    }

    db.collection("categories").onSnapshot(s => {
        let h = '', a = '', o = '<option value="">اختر القسم</option>';
        s.forEach(d => {
            const data = d.data();
            h += `<div style="text-align:center; min-width:80px;"><img src="${data.i}" style="width:55px; height:55px; border-radius:50%; border:2px solid var(--main);"><br><small>${data.n}</small></div>`;
            a += `<div style="display:flex; justify-content:space-between; background:#000; padding:10px; border-radius:10px; margin-bottom:5px;"><span>${data.n}</span><button onclick="del('categories','${d.id}')" style="color:red; background:none; border:none;">حذف</button></div>`;
            o += `<option value="${d.id}">${data.n}</option>`;
        });
        document.getElementById('catsHeader').innerHTML = h;
        document.getElementById('manageCats').innerHTML = a;
        document.getElementById('pCatSelect').innerHTML = o;
    });

    db.collection("products").onSnapshot(s => {
        let h = '', a = '';
        s.forEach(d => {
            const data = d.data();
            h += `<div class="p-card" onclick="openOrderModal('${data.t}')"><img src="${data.i}"><h5>${data.t}</h5><button class="btn-main" style="padding:5px; font-size:0.7rem; margin-top:5px;">اطلب الآن ⚡</button></div>`;
            a += `<div style="display:flex; justify-content:space-between; background:#000; padding:10px; border-radius:10px; margin-bottom:5px;"><span>${data.t}</span><button onclick="del('products','${d.id}')" style="color:red; background:none; border:none;">حذف</button></div>`;
        });
        document.getElementById('prodsHome').innerHTML = h;
        document.getElementById('manageProds').innerHTML = a;
    });

    function del(col, id) { if(confirm("حذف؟")) db.collection(col).doc(id).delete(); }

    // --- السلة والولاء ---
    function openOrderModal(t) { currentProd = t; document.getElementById('modalTitle').innerText = t; document.getElementById('orderModal').style.display='flex'; }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
    
    function confirmOrder() {
        const qty = document.getElementById('modalQty').value, note = document.getElementById('modalNotes').value;
        cart.push({t: currentProd, q: qty, n: note});
        closeModal('orderModal'); renderCart();
        document.getElementById('modalNotes').value = "";
    }

    function renderCart() {
        document.getElementById('cartList').innerHTML = cart.map((i, idx) => `
            <div style="background:#000; padding:10px; border-radius:12px; margin-bottom:8px; border-right:4px solid var(--main);">
                <div style="display:flex; justify-content:space-between;"><b>${i.t} (ج${i.q})</b><span onclick="cart.splice(${idx},1);renderCart()" style="color:red">✕</span></div>
                ${i.n ? `<small style="color:#888;">📝 ${i.n}</small>` : ''}
            </div>`).join('');
    }

    async function checkLoyalty(phone) {
        if(phone.length >= 11) {
            const snap = await db.collection("orders").where("p", "==", phone).get();
            userOrdersCount = snap.size;
            const badge = document.getElementById('loyaltyBadgeContainer');
            badge.innerHTML = `<span class="order-count-badge">عدد أوردراتك السابقة: ${userOrdersCount}</span>`;
            if((userOrdersCount + 1) % 10 === 0 && userOrdersCount > 0) {
                badge.innerHTML += `<div style="color:var(--success); font-weight:bold; margin-top:5px;">🎁 مبروك! الأوردر ده توصيله مجاني!</div>`;
            }
        }
    }

    async function sendFullCart() {
        const name = document.getElementById('uName').value, addr = document.getElementById('uAddress').value, phone = document.getElementById('uPhone').value;
        if(!name || !addr || !phone || cart.length === 0) return alert("كمل بياناتك يا درش!");

        let isFree = (userOrdersCount > 0 && (userOrdersCount + 1) % 10 === 0);
        if(isFree) alert("مبروك! التوصيل مجاني 🎁");

        await db.collection("orders").add({ n: name, p: phone, address: addr, items: cart, isFree: isFree, createdAt: new Date() });

        let msg = `🛒 أوردر جديد ${isFree ? '(مجاني 🎁)' : ''}\n👤 الاسم: ${name}\n📍 العنوان: ${addr}\n📞 الهاتف: ${phone}\n📦 الأصناف:\n` + cart.map(i => `- ${i.t} (ج${i.q}) ${i.n ? '['+i.n+']' : ''}`).join('\n');
        if(isFree) msg += `\n\n🆔 كود الخصم: 10MostafaHegazyFree10`;

        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
        cart = []; renderCart();
    }
</script>
</body>
</html>
