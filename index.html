<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nagda Order | نجدة أوردر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --surface: #161b2b;
            --primary: #6366f1;
            --secondary: #0ea5e9;
            --accent: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
            --success-color: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: var(--text-main); line-height: 1.6; overflow-x: hidden; padding-bottom: 90px; }

        /* --- Header --- */
        header { padding: 30px 20px 20px; background: linear-gradient(180deg, rgba(99, 102, 241, 0.15) 0%, transparent 100%); }
        .logo-box h1 { font-weight: 900; font-size: 2rem; letter-spacing: -1px; }
        .logo-box h1 span { color: var(--primary); text-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
        .logo-box p { color: var(--text-dim); font-size: 0.85rem; font-weight: 700; margin-top: -5px; }

        /* --- Navigation --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(22, 27, 43, 0.9);
            backdrop-filter: blur(20px); display: flex; justify-content: space-around;
            padding: 12px 0; border-top: 1px solid var(--glass-border); z-index: 1000;
        }
        .nav-item { color: var(--text-dim); cursor: pointer; text-align: center; flex: 1; transition: 0.3s; position: relative; }
        .nav-item.active { color: var(--primary); }
        .nav-item .icon { font-size: 1.4rem; display: block; }
        .nav-item span { font-size: 0.75rem; font-weight: 700; }
        .badge { position: absolute; top: -5px; right: 25%; background: var(--accent); color: #fff; font-size: 0.65rem; padding: 2px 7px; border-radius: 50px; font-weight: 900; border: 2px solid var(--surface); }

        /* --- Pages --- */
        .page { display: none; padding: 0 20px; animation: slideUp 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Shop Styling --- */
        .cats-bar { display: flex; gap: 10px; overflow-x: auto; padding: 15px 0 25px; scrollbar-width: none; }
        .cats-bar::-webkit-scrollbar { display: none; }
        .pill { padding: 8px 24px; background: var(--surface); border-radius: 100px; font-size: 0.85rem; font-weight: 700; white-space: nowrap; cursor: pointer; border: 1px solid var(--glass-border); transition: 0.3s; }
        .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .p-card { background: var(--surface); border-radius: 24px; overflow: hidden; border: 1px solid var(--glass-border); transition: 0.3s; }
        .p-card img { width: 100%; height: 160px; object-fit: cover; background: #111; }
        .p-card-content { padding: 15px; text-align: center; }
        .p-card-content h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 5px; }
        .unit-tag { font-size: 0.7rem; color: var(--secondary); background: rgba(14, 165, 233, 0.1); padding: 3px 10px; border-radius: 8px; font-weight: 700; }
        .add-btn { width: 100%; padding: 12px; margin-top: 15px; border-radius: 16px; border: none; background: var(--primary); color: #fff; font-weight: 900; cursor: pointer; }

        /* --- Admin Panel --- */
        .admin-form { background: var(--surface); padding: 25px; border-radius: 30px; border: 1px solid var(--primary); margin-bottom: 30px; }
        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 6px; }
        input, select { width: 100%; padding: 14px; border-radius: 15px; background: #080a12; border: 1px solid var(--glass-border); color: #fff; outline: none; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th { color: var(--text-dim); font-size: 0.8rem; text-align: center; padding: 10px; border-bottom: 1px solid var(--glass-border); }
        .admin-table td { padding: 15px 10px; border-bottom: 1px solid var(--glass-border); text-align: center; font-size: 0.85rem; }
        .delete-icon { color: var(--accent); cursor: pointer; font-weight: bold; }

        /* --- Cart Styling --- */
        .cart-row { background: var(--surface); padding: 20px; border-radius: 24px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--glass-border); }
        .cart-row h4 { font-weight: 800; font-size: 1.1rem; }
        .cart-row p { font-size: 0.8rem; color: var(--text-dim); }
        .whatsapp-send { width: 100%; padding: 20px; border-radius: 20px; border: none; background: #25d366; color: #fff; font-weight: 900; font-size: 1.1rem; cursor: pointer; margin-top: 30px; box-shadow: 0 10px 25px rgba(37, 211, 102, 0.2); }

        /* --- Modal --- */
        .modal-wrap { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 5000; align-items: center; justify-content: center; padding: 20px; }
        .modal-body { background: var(--surface); width: 100%; max-width: 380px; border-radius: 35px; padding: 35px; border: 1px solid var(--primary); text-align: center; }

        @media (max-width: 450px) { .grid { grid-template-columns: 1fr 1fr; gap: 12px; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-box" id="logoArea" onmousedown="startAdminLock()" onmouseup="endAdminLock()" ontouchstart="startAdminLock()" ontouchend="endAdminLock()">
            <h1>نجدة<span>.</span>ORDER</h1>
            <p>أسرع دليفري في شبين القناطر • مصطفى حجازي</p>
        </div>
    </header>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="goPage('shop', this)">
            <span class="icon">🏠</span><span>المتجر</span>
        </div>
        <div class="nav-item" onclick="goPage('cart', this)">
            <span class="icon">🛒</span><span>السلة</span>
            <div id="cartCount" class="badge" style="display:none">0</div>
        </div>
        <div id="adminTab" class="nav-item" style="display:none" onclick="goPage('admin', this)">
            <span class="icon">⚙️</span><span>الإدارة</span>
        </div>
    </nav>

    <div id="shopPage" class="page active">
        <div class="cats-bar">
            <div class="pill active" onclick="filterData('الكل', this)">الكل</div>
            <div class="pill" onclick="filterData('خضار وفواكه', this)">🥦 خضار وفاكهة</div>
            <div class="pill" onclick="filterData('بقالة', this)">🏪 بقالة</div>
            <div class="pill" onclick="filterData('مطاعم', this)">🍔 مطاعم</div>
        </div>
        <div class="grid" id="shopGrid"></div>
    </div>

    <div id="cartPage" class="page">
        <h2 style="margin-bottom:20px; font-weight:900;">طلباتك المختارة 🛍️</h2>
        <div id="cartContainer"></div>
        <div id="checkoutArea" style="display:none; margin-top:30px;">
            <div class="field"><input type="text" id="userName" placeholder="الاسم بالكامل"></div>
            <div class="field"><input type="text" id="userAddr" placeholder="العنوان بالتفصيل في شبين"></div>
            <button class="whatsapp-send" onclick="finishOrder()">إرسال الطلب للواتساب ✅</button>
        </div>
    </div>

    <div id="adminPage" class="page">
        <h2 style="margin-bottom:20px; color:var(--primary); font-weight:900;">لوحة التحكم 🛠️</h2>
        <div class="admin-form">
            <div class="field"><label>اسم المنتج</label><input type="text" id="admName"></div>
            <div class="field"><label>الصورة</label><input type="file" id="admImg" accept="image/*" onchange="handleImg(this)"></div>
            <div class="field">
                <label>القسم</label>
                <select id="admCat">
                    <option value="خضار وفواكه">خضار وفواكه</option>
                    <option value="بقالة">بقالة</option>
                    <option value="مطاعم">مطاعم</option>
                </select>
            </div>
            <div class="field">
                <label>الوحدة</label>
                <select id="admUnit">
                    <option value="بالكيلو">بالكيلو</option>
                    <option value="بالقطعة">بالقطعة</option>
                    <option value="بالعلبة">بالعلبة</option>
                </select>
            </div>
            <button class="add-btn" onclick="saveItem()">نشر المنتج في المتجر</button>
        </div>
        <table class="admin-table">
            <thead><tr><th>صورة</th><th>المنتج</th><th>حذف</th></tr></thead>
            <tbody id="adminGrid"></tbody>
        </table>
        <button onclick="location.reload()" style="width:100%; background:none; border:1px solid #333; color:var(--text-dim); margin-top:30px; padding:10px; border-radius:15px;">تسجيل خروج</button>
    </div>

    <div class="modal-wrap" id="itemModal">
        <div class="modal-body">
            <h3 id="modalName" style="color:var(--primary); font-weight:900; font-size:1.4rem;"></h3>
            <div class="field" style="margin-top:25px;">
                <label>المكان المفضل (اختياري)</label>
                <input type="text" id="optPlace" placeholder="مثلاً: ماركت الفلاني">
            </div>
            <div class="field">
                <label>الكمية المطلوبة</label>
                <input type="number" id="optCount" value="1" min="1">
            </div>
            <button class="add-btn" onclick="confirmCart()">تأكيد الإضافة</button>
            <button onclick="closeModal()" style="background:none; border:none; color:var(--text-dim); margin-top:15px; cursor:pointer; font-weight:700;">رجوع</button>
        </div>
    </div>

    <script>
        // داتا التخزين
        let products = JSON.parse(localStorage.getItem('nagda_final_db')) || [];
        let cartItems = [];
        let currentImgBase64 = "";
        let selectedItem = "";
        let adminTimer;

        // نظام الصفحات
        function goPage(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id + 'Page').classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            if(id === 'shop') renderShop();
            if(id === 'cart') renderCart();
            if(id === 'admin') renderAdmin();
        }

        // قفل الأدمن السرّي
        function startAdminLock() { adminTimer = setTimeout(() => {
            const code = prompt("كود الدخول للوحة:");
            if(code === "135790") {
                document.getElementById('adminTab').style.display = 'block';
                goPage('admin', document.getElementById('adminTab'));
            }
        }, 2000); }
        function endAdminLock() { clearTimeout(adminTimer); }

        // تحويل الصور
        function handleImg(el) {
            const reader = new FileReader();
            reader.onload = (e) => currentImgBase64 = e.target.result;
            reader.readAsDataURL(el.files[0]);
        }

        // حفظ وحذف
        function saveItem() {
            const name = document.getElementById('admName').value;
            const cat = document.getElementById('admCat').value;
            const unit = document.getElementById('admUnit').value;
            if(!name || !currentImgBase64) return alert("اكمل البيانات");
            products.push({ id: Date.now(), name, cat, unit, img: currentImgBase64 });
            localStorage.setItem('nagda_final_db', JSON.stringify(products));
            renderAdmin();
            document.getElementById('admName').value = "";
        }

        function delItem(id) {
            if(confirm("مسح المنتج نهائياً؟")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('nagda_final_db', JSON.stringify(products));
                renderAdmin();
            }
        }

        // عرض المتجر
        function renderShop(f = 'الكل') {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = products.length === 0 ? "<p style='grid-column:1/-1; text-align:center; padding:100px 0; color:#555'>لا توجد منتجات حالياً</p>" : "";
            products.forEach(p => {
                if(f === 'الكل' || p.cat === f) {
                    grid.innerHTML += `
                        <div class="p-card">
                            <img src="${p.img}">
                            <div class="p-card-content">
                                <h3>${p.name}</h3>
                                <span class="unit-tag">${p.unit}</span>
                                <button class="add-btn" onclick="openModal('${p.name}')">أضف للسلة</button>
                            </div>
                        </div>`;
                }
            });
        }

        function filterData(c, el) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            renderShop(c);
        }

        // سلة المشتريات
        function openModal(name) {
            selectedItem = name;
            document.getElementById('modalName').innerText = name;
            document.getElementById('itemModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('itemModal').style.display = 'none'; }

        function confirmCart() {
            const place = document.getElementById('optPlace').value || "حسب المتوفر";
            const qty = document.getElementById('optCount').value;
            cartItems.push({ name: selectedItem, place, qty });
            closeModal();
            updateCartBadge();
            if(navigator.vibrate) navigator.vibrate(50);
        }

        function updateCartBadge() {
            const b = document.getElementById('cartCount');
            if(cartItems.length > 0) { b.innerText = cartItems.length; b.style.display = 'block'; }
            else { b.style.display = 'none'; }
        }

        function renderCart() {
            const cont = document.getElementById('cartContainer');
            const area = document.getElementById('checkoutArea');
            if(cartItems.length === 0) {
                cont.innerHTML = "<div style='text-align:center; padding:100px 0;'><span style='font-size:3rem;'>🛒</span><p style='color:#555'>السلة فاضية.. مستنيين طلبك!</p></div>";
                area.style.display = 'none';
                return;
            }
            area.style.display = 'block';
            cont.innerHTML = cartItems.map((i, idx) => `
                <div class="cart-row">
                    <div>
                        <h4>${i.name}</h4>
                        <p>الكمية: ${i.qty} • المكان: ${i.place}</p>
                    </div>
                    <span class="delete-icon" onclick="removeCart(${idx})">مسح</span>
                </div>
            `).join('');
        }

        function removeCart(idx) {
            cartItems.splice(idx, 1);
            renderCart();
            updateCartBadge();
        }

        function renderAdmin() {
            const list = document.getElementById('adminGrid');
            list.innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.img}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;"></td>
                    <td>${p.name}</td>
                    <td class="delete-icon" onclick="delItem(${p.id})">مسح</td>
                </tr>
            `).join('');
        }

        function finishOrder() {
            const name = document.getElementById('userName').value;
            const addr = document.getElementById('userAddr').value;
            if(!name || !addr) return alert("فضلاً، ادخل الاسم والعنوان لنتمكن من توصيل طلبك");
            
            let text = `*طلب دليفري جديد (نجدة أوردر) ⚡*%0A━━━━━━━━━━━━━━%0A`;
            cartItems.forEach(i => { text += `• *${i.name}* (الكمية: ${i.qty})%0A   (المكان: ${i.place})%0A`; });
            text += `━━━━━━━━━━━━━━%0A👤 *الاسم:* ${name}%0A📍 *العنوان:* ${addr}`;
            
            window.open(`https://wa.me/201140293628?text=${text}`);
        }

        // تشغيل أولي
        renderShop();
    </script>
</body>
</html>
