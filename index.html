<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #1c1c1e; --danger: #ff453a; --success: #32d74b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; overflow-x: hidden; }

        header { padding: 15px 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo-text { font-weight: 900; font-size: 1.1rem; background: linear-gradient(var(--main), var(--sec)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-btn { font-size: 0.75rem; opacity: 0.6; cursor: pointer; }

        nav { position: fixed; bottom: 0; width: 100%; background: rgba(10,10,12,0.98); border-top: 1px solid #2c2c2e; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 3000; }
        .nav-link { color: #8e8e93; text-decoration: none; text-align: center; flex: 1; transition: 0.3s; }
        .nav-link i { font-size: 1.4rem; display: block; margin-bottom: 2px; }
        .nav-link span { font-size: 0.8rem; font-weight: 700; }
        .nav-link.active { color: var(--main); }

        .page { display: none; padding: 0 15px; animation: slideUp 0.4s ease; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .p-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #2c2c2e; position: relative; }
        .p-card img { width: 100%; height: 110px; object-fit: cover; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 4000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; border: 1px solid var(--main); box-shadow: 0 0 20px rgba(0,210,255,0.2); }
        .qty-btns { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; }
        .qty-btn { background: #333; color: white; border: none; width: 45px; height: 45px; border-radius: 12px; font-size: 1.4rem; cursor: pointer; }

        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #333; background: #2c2c2e; color: #fff; font-size: 0.9rem; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; }
        
        .cat-item { background: #222; padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-right: 3px solid var(--main); }
        .hidden-admin { display: none !important; }
        .admin-mode .hidden-admin { display: block !important; }
        .delete-p-btn { position: absolute; top: 5px; left: 5px; background: var(--danger); border-radius: 50%; width: 24px; height: 24px; display: none; align-items: center; justify-content: center; z-index: 10; }
        .admin-mode .delete-p-btn { display: flex; }
    </style>
</head>
<body>

<header>
    <div class="logo-text">نجدة أوردر ⚡</div>
    <div class="admin-btn" ondblclick="toggleAdmin()">مصطفى حجازي</div>
</header>

<div id="qtyModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="color: var(--main);">اسم المنتج</h3>
        <div class="qty-btns">
            <button class="qty-btn" onclick="changeQty(-1)">-</button>
            <span id="currentQty" style="font-size: 1.8rem; font-weight: 900;">1</span>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
        <textarea id="pNote" placeholder="ملاحظات (مثلاً: سبايسي، بدون بصل، عاوزه من محل معين..)"></textarea>
        <button class="btn btn-main" onclick="confirmAdd()">إضافة للسلة 🛒</button>
        <p onclick="closeModal()" style="margin-top:15px; color:#8e8e93; font-size:0.85rem; cursor:pointer;">إلغاء</p>
    </div>
</div>

<div id="home" class="page active">
    <div id="prodsHome" class="prod-grid"></div>
</div>

<div id="special" class="page">
    <h3 style="text-align:center; margin: 15px 0;">📦 طلب توصيل خاص (شحن)</h3>
    <input type="text" id="spDetails" placeholder="إيه الحاجة اللي هنوصلها؟">
    <input type="text" id="spFrom" placeholder="مكان الاستلام (منين؟)">
    <input type="text" id="spTo" placeholder="مكان التسليم (لفين؟)">
    <input type="tel" id="spPhone" placeholder="رقم موبايل المستلم">
    <button class="btn btn-main" onclick="sendSpecialOrder()">إرسال طلب التوصيل 🚀</button>
</div>

<div id="cart" class="page">
    <h3 style="margin: 15px 0;">🛒 السلة</h3>
    <div id="cartList" style="margin-bottom: 15px;"></div>
    <input type="text" id="uName" placeholder="الاسم بالكامل">
    <input type="text" id="uAddress" placeholder="العنوان بالتفصيل">
    <input type="tel" id="uPhone" placeholder="رقم الموبايل">
    <button class="btn btn-main" onclick="confirmFullOrder()">تأكيد وإرسال واتساب 💬</button>
</div>

<div id="admin-orders" class="page">
    <h3 style="text-align:center; margin: 15px 0; color: var(--main);">📈 الطلبات الواردة</h3>
    <div id="ordersDashboard"></div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><i>🏠</i><span>الرئيسية</span></a>
    <a href="#" class="nav-link" onclick="go('special', this)"><i>📦</i><span>توصيل خاص</span></a>
    <a href="#" class="nav-link" onclick="go('cart', this)"><i>🛒</i><span>السلة</span></a>
    <a href="#" class="nav-link hidden-admin" onclick="go('admin-orders', this)"><i>🔔</i><span>طلبات</span></a>
</nav>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); 
    const db = firebase.firestore();

    let cart = [], tempProduct = "", currentQtyValue = 1;

    function toggleAdmin() { if(prompt("كود الإدارة؟") === "135790") document.body.classList.toggle('admin-mode'); }

    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
        if(id === 'admin-orders') renderOrders();
    }

    // جلب المنتجات من الفايربيز
    db.collection("products").onSnapshot(s => {
        let h = '';
        s.forEach(d => {
            const p = d.data();
            h += `<div class="p-card">
                    <div class="delete-p-btn" onclick="deleteDoc('products','${d.id}')">✕</div>
                    <img src="${p.img}">
                    <div style="padding:10px; text-align:center;">
                        <p style="font-size:0.9rem; margin-bottom:8px; font-weight:bold;">${p.title}</p>
                        <button class="btn btn-main" style="padding:8px; font-size:0.8rem;" onclick="openQtyModal('${p.title}')">اطلب الآن</button>
                    </div>
                </div>`;
        });
        document.getElementById('prodsHome').innerHTML = h;
    });

    function openQtyModal(title) {
        tempProduct = title;
        currentQtyValue = 1;
        document.getElementById('pNote').value = "";
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('currentQty').innerText = currentQtyValue;
        document.getElementById('qtyModal').style.display = 'flex';
    }

    function changeQty(val) {
        currentQtyValue += val;
        if(currentQtyValue < 1) currentQtyValue = 1;
        document.getElementById('currentQty').innerText = currentQtyValue;
    }

    function closeModal() { document.getElementById('qtyModal').style.display = 'none'; }

    function confirmAdd() {
        const note = document.getElementById('pNote').value;
        cart.push({ t: tempProduct, q: currentQtyValue, n: note });
        closeModal();
        renderCart();
    }

    function renderCart() {
        document.getElementById('cartList').innerHTML = cart.map((i,idx)=>`
            <div class="cat-item">
                <div>
                    <b>${i.t}</b> (العدد: ${i.q})
                    <p style="font-size:0.75rem; color:var(--main); margin-top:4px;">${i.n ? '💬 ملاحظة: ' + i.n : ''}</p>
                </div>
                <span onclick="cart.splice(${idx},1);renderCart()" style="color:var(--danger); cursor:pointer; font-weight:bold; padding:10px;">✕</span>
            </div>
        `).join('');
    }

    async function confirmFullOrder() {
        const n = document.getElementById('uName').value, p = document.getElementById('uPhone').value, a = document.getElementById('uAddress').value;
        if(!n || !p || cart.length === 0) return alert("يا درش كمل بياناتك والطلبات!");
        
        let itemsList = cart.map((i, index) => `${index + 1}- ${i.t} (عدد: ${i.q}) ${i.n ? '\n الملاحظة: ' + i.n : ''}`).join('\n\n');
        let msg = `⚡ *أوردر جديد من نجدة أوردر*\n\n` +
                  `👤 *الاسم:* ${n}\n` +
                  `📞 *الموبايل:* ${p}\n` +
                  `📍 *العنوان:* ${a}\n\n` +
                  `📦 *الطلبات:*\n${itemsList}`;

        await db.collection("orders").add({ n, p, a, items: cart, status: "pending", createdAt: new Date() });
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
        cart = []; renderCart();
    }

    async function sendSpecialOrder() {
        const det = document.getElementById('spDetails').value, ph = document.getElementById('spPhone').value, 
              from = document.getElementById('spFrom').value, to = document.getElementById('spTo').value;
        
        if(!det || !ph || !from || !to) return alert("اكتب كل تفاصيل التوصيل!");
        
        let msg = `📦 *طلب شحن مستلزمات خاص*\n\n` +
                  `📝 *الحاجة:* ${det}\n` +
                  `🏠 *من:* ${from}\n` +
                  `📍 *إلى:* ${to}\n` +
                  `📞 *رقم المستلم:* ${ph}`;

        await db.collection("orders").add({ n: "توصيل خاص", p: ph, spDetails: det, spFrom: from, spTo: to, status: "pending", createdAt: new Date() });
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
    }

    function deleteDoc(col, id) { if(confirm("أكيد عاوز تحذف؟")) db.collection(col).doc(id).delete(); }

    function renderOrders() {
        db.collection("orders").orderBy("createdAt", "desc").onSnapshot(s => {
            let h = '';
            s.forEach(d => {
                const o = d.data();
                h += `<div class="cat-item" style="flex-direction:column; align-items:flex-start; gap:5px;">
                        <p>👤 <b>${o.n}</b> | 📞 ${o.p}</p>
                        <p style="font-size:0.8rem; color:var(--main);">📍 ${o.a || 'شحن خاص'}</p>
                        <button class="btn" style="background:var(--danger); padding:5px; width:60px;" onclick="deleteDoc('orders','${d.id}')">حذف</button>
                    </div>`;
            });
            document.getElementById('ordersDashboard').innerHTML = h || '<p style="text-align:center;">لا يوجد طلبات حالياً</p>';
        });
    }
</script>
</body>
</html>
