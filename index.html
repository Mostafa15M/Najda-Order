<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر | مصطفى حجازي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #16161a; 
            --danger: #ff3131; --gold: #ffd700; --success: #00ff88; 
            --neon-name: 0 0 10px var(--sec), 0 0 20px var(--sec);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; overflow-x: hidden; }

        header { padding: 15px 12px; background: #000; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        .left-name { 
            font-size: 1rem; color: var(--sec); font-weight: 900; flex: 1; text-align: left; 
            text-shadow: var(--neon-name); animation: glowName 2s infinite alternate; 
        }
        @keyframes glowName { from { text-shadow: 0 0 5px var(--sec); } to { text-shadow: 0 0 25px var(--sec); } }
        
        .right-brand { font-size: 1.1rem; font-weight: 900; color: var(--main); text-align: right; flex: 1; }
        
        .center-logo { 
            width: 50px; height: 50px; background: #000; border: 2px solid var(--main); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; font-size: 1.4rem; color: var(--main); 
            box-shadow: 0 0 15px var(--main); cursor: pointer; user-select: none;
        }

        .page { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--card); padding: 18px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #222; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; font-size: 1rem; }
        
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; width: auto; margin: 3px; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-success { background: var(--success); color: #000; }

        .loyalty-box { background: rgba(255, 215, 0, 0.1); border: 1px dashed var(--gold); padding: 12px; border-radius: 15px; margin-bottom: 10px; text-align: center; display: none; }
        
        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .p-item { background: var(--card); padding: 10px; border-radius: 15px; text-align: center; border: 1px solid #222; }
        .p-item img { width: 100%; height: 110px; border-radius: 12px; object-fit: cover; margin-bottom: 8px; }

        nav { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #222; z-index: 1000; }
        .nav-link { color: #666; text-decoration: none; text-align: center; font-size: 0.75rem; font-weight: bold; }
        .nav-link.active { color: var(--main); }
        .nav-link i { font-size: 1.4rem; display: block; margin-bottom: 2px; }

        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }
        
        .admin-row { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #111; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="right-brand">نجدة أوردر ⚡</div>
        <div class="center-logo" id="adminTrigger">⚡</div>
        <div class="left-name">مصطفى حجازي</div>
    </div>
</header>

<div id="home" class="page active">
    <div class="prod-grid" id="prodsHome"></div>
</div>

<div id="shipping" class="page">
    <div class="card">
        <div class="loyalty-box" id="shipLoyalty"></div>
        <h2 style="color:var(--main); text-align:center; margin-bottom:10px;">📦 شحن مستلزمات</h2>
        <input type="tel" id="shipPhone" placeholder="رقم موبايلك" oninput="checkLoyalty(this.value, 'shipLoyalty')">
        <input type="text" id="shipItem" placeholder="إيه الحاجة اللي هنوصلها؟">
        <input type="text" id="shipFrom" placeholder="مكان الاستلام">
        <input type="text" id="shipTo" placeholder="مكان التسليم">
        <button class="btn btn-main" onclick="sendShippingRequest()">اطلب المندوب 🚀</button>
    </div>
</div>

<div id="cart" class="page">
    <div class="card">
        <div class="loyalty-box" id="cartLoyalty"></div>
        <h2 style="text-align:center; margin-bottom:15px;">🛒 مراجعة الطلب</h2>
        <div id="cartItems"></div>
        <hr style="border:0.5px solid #333; margin:15px 0;">
        <input type="tel" id="custPhone" placeholder="رقم الموبايل" oninput="checkLoyalty(this.value, 'cartLoyalty')">
        <input type="text" id="custName" placeholder="الاسم بالكامل">
        <textarea id="custAddress" placeholder="العنوان بالتفصيل (الشارع / الدور / علامة مميزة)"></textarea>
        <button class="btn btn-main" onclick="confirmOrder()">تأكيد وإرسال الطلب 💬</button>
    </div>
</div>

<div id="admin-panel" class="page">
    <div class="card">
        <h3>🛍️ إضافة منتج جديد</h3>
        <input type="text" id="pTitle" placeholder="اسم المنتج">
        <input type="file" id="pImgInput" onchange="processImage(this)">
        <button class="btn btn-main" onclick="addProduct()">إضافة للمتجر ✅</button>
    </div>

    <h3>📦 إدارة المنتجات (تعديل/حذف)</h3>
    <div id="adminProdsList" style="margin-bottom:20px;"></div>

    <h3>🔔 الطلبات الواردة</h3>
    <div id="adminOrdersList"></div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="navigate('home', this)"><i>🏠</i>المتجر</a>
    <a href="#" class="nav-link" onclick="navigate('shipping', this)"><i>📦</i>شحن</a>
    <a href="#" class="nav-link" onclick="navigate('cart', this)"><i>🛒</i>السلة</a>
    <a href="#" class="nav-link admin-only" onclick="navigate('admin-panel', this)"><i>⚙️</i>الإدارة</a>
</nav>

<script>
    // Firebase Setup
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    let isAdmin = false, currentBase64 = "", cart = [];

    // نظام الضغطة المطولة للأدمن (3 ثواني)
    const adminTrigger = document.getElementById('adminTrigger');
    let pressTimer;
    const startPress = () => pressTimer = setTimeout(() => {
        if(prompt("كلمة السر يا ريس:") === "135790") { isAdmin = true; document.body.classList.add('admin-mode'); alert("نورت التحكم يا مصطفى!"); }
    }, 3000);
    adminTrigger.addEventListener('touchstart', startPress);
    adminTrigger.addEventListener('mousedown', startPress);
    adminTrigger.addEventListener('touchend', () => clearTimeout(pressTimer));
    adminTrigger.addEventListener('mouseup', () => clearTimeout(pressTimer));

    // فحص النقط/الأوردرات بناءً على الرقم
    async function checkLoyalty(phone, displayId) {
        const box = document.getElementById(displayId);
        if (phone.length >= 11) {
            const snap = await db.collection("orders").where("userPhone", "==", phone).where("status", "==", "confirmed").get();
            let count = snap.size;
            box.style.display = "block";
            box.innerHTML = count % 10 === 9 ? `<h3 style="color:var(--success)">🌟 أوردرك العاشر مجاني! 🌟</h3>` : `<h3>عدد أوردراتك السابقة: ${count} 🎯</h3>`;
            return count;
        } else { box.style.display = "none"; return 0; }
    }

    function navigate(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); el.classList.add('active');
    }

    // إدارة المنتجات (الزبون + الأدمن)
    db.collection("products").orderBy("createdAt", "desc").onSnapshot(s => {
        const prods = s.docs.map(d => ({id:d.id, ...d.data()}));
        document.getElementById('prodsHome').innerHTML = prods.map(p => `<div class="p-item"><img src="${p.img}"><h4>${p.title}</h4><button class="btn btn-main btn-sm" onclick="addToCart('${p.title}')">أضف للسلة 🛒</button></div>`).join('');
        document.getElementById('adminProdsList').innerHTML = prods.map(p => `
            <div class="admin-row">
                <span>${p.title}</span>
                <div>
                    <button class="btn btn-sm btn-main" onclick="editProduct('${p.id}', '${p.title}')">تعديل</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteDoc('products','${p.id}')">حذف</button>
                </div>
            </div>`).join('');
    });

    // إدارة الطلبات (للأدمن فقط)
    db.collection("orders").orderBy("createdAt", "desc").limit(20).onSnapshot(s => {
        document.getElementById('adminOrdersList').innerHTML = s.docs.map(d => {
            const o = d.data();
            return `
            <div class="card" style="border-right: 5px solid ${o.status === 'confirmed' ? 'var(--success)' : 'var(--main)'}">
                <p><b>العميل:</b> ${o.userName || 'شحن'} (${o.userPhone})</p>
                <p><b>العنوان:</b> ${o.address || 'غير محدد'}</p>
                <p><b>الطلب:</b> ${o.type === 'شحن' ? o.item : o.items?.join(' + ')}</p>
                <div style="margin-top:10px;">
                    <button class="btn btn-sm btn-success" onclick="updateStatus('${d.id}', 'confirmed')">توصيل ✅</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteDoc('orders','${d.id}')">مسح ❌</button>
                </div>
            </div>`;
        }).join('');
    });

    function addToCart(t) { cart.push(t); updateCartUI(); alert("تمت الإضافة ✅"); }
    function updateCartUI() {
        document.getElementById('cartItems').innerHTML = cart.map((t, i) => `<div class="admin-row"><span>${t}</span><button style="color:red; background:none; border:none;" onclick="cart.splice(${i},1); updateCartUI();">❌</button></div>`).join('');
    }

    async function confirmOrder() {
        const name = document.getElementById('custName').value, ph = document.getElementById('custPhone').value, addr = document.getElementById('custAddress').value;
        if(name && ph && addr && cart.length > 0) {
            const count = await checkLoyalty(ph, 'cartLoyalty');
            await db.collection("orders").add({type:'متجر', userName:name, userPhone:ph, address:addr, items:cart, status:'pending', createdAt:new Date()});
            let msg = `⚡ *NAGDA ORDER*\n👤 الاسم: ${name}\n📞 الرقم: ${ph}\n📍 العنوان: ${addr}\n🛒 الطلبات: ${cart.join(' + ')}`;
            if((count + 1) % 10 === 0) msg += `\n\n🔥 *10Mostafa Hegazy10* 🔥`;
            window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
            cart = []; updateCartUI();
        } else alert("كمل بياناتك!");
    }

    async function sendShippingRequest() {
        const ph = document.getElementById('shipPhone').value, item = document.getElementById('shipItem').value;
        if(ph && item) {
            const count = await checkLoyalty(ph, 'shipLoyalty');
            await db.collection("orders").add({type:'شحن', userPhone:ph, item, from:document.getElementById('shipFrom').value, to:document.getElementById('shipTo').value, status:'pending', createdAt:new Date()});
            let msg = `⚡ *NAGDA ORDER | شحن*\n📞 الرقم: ${ph}\n📦 الغرض: ${item}`;
            if((count + 1) % 10 === 0) msg += `\n\n🔥 *10Mostafa Hegazy10* 🔥`;
            window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
        }
    }

    // وظائف الأدمن (Add, Edit, Delete, Confirm)
    async function addProduct() {
        const t = document.getElementById('pTitle').value;
        if(t && currentBase64) {
            await db.collection("products").add({ title: t, img: currentBase64, createdAt: new Date() });
            document.getElementById('pTitle').value = ""; alert("تم النشر ✅");
        }
    }
    async function editProduct(id, oldT) {
        const newT = prompt("الاسم الجديد:", oldT);
        if(newT) await db.collection("products").doc(id).update({ title: newT });
    }
    async function updateStatus(id, s) { await db.collection("orders").doc(id).update({ status: s }); alert("تم التوصيل ونزلت النقطة للعميل ✅"); }
    async function deleteDoc(col, id) { if(confirm("أكيد؟")) await db.collection(col).doc(id).delete(); }
    function processImage(i) { const r = new FileReader(); r.onload = () => currentBase64 = r.result; r.readAsDataURL(i.files[0]); }
</script>
</body>
</html>
