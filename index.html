<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر | مصطفى حجازي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #9d50bb; --bg: #0a0a0c; --card: #16161a; --danger: #ff3131; --gold: #ffd700; --success: #00c851; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; overflow-x: hidden; }

        /* الهيدر المطلوب بالملي */
        header { 
            padding: 15px 12px; 
            background: #000; 
            border-bottom: 2px solid var(--main); 
            position: sticky; 
            top: 0; 
            z-index: 1000;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
        }
        .left-name { font-size: 0.85rem; color: var(--sec); font-weight: 900; flex: 1; text-align: left; }
        .right-brand { font-size: 1.1rem; font-weight: 900; color: var(--main); flex: 1; text-align: right; }
        
        .center-logo {
            width: 45px; height: 45px; background: #000; border: 2px solid var(--main);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.4rem; box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            cursor: pointer; user-select: none; z-index: 10;
        }

        .sub-title-box { text-align: center; border-top: 1px solid #1a1a1a; padding-top: 4px; }
        .sub-title { font-size: 0.8rem; color: #888; font-weight: bold; }

        /* شريط الهدية المتحرك */
        .gift-ticker {
            background: linear-gradient(90deg, #b8860b, var(--gold), #b8860b);
            color: #000; padding: 10px 0; font-weight: 900; font-size: 0.85rem;
            margin: 10px 0; overflow: hidden; white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .ticker-text { display: inline-block; animation: scroll 20s linear infinite; }
        @keyframes scroll { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        /* الصفحات */
        .page { display: none; padding: 15px; animation: slideUp 0.4s ease; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* التحكم في وضع الأدمن */
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }
        .admin-mode .user-only { display: none !important; }

        /* الكروت */
        .card { background: var(--card); padding: 15px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #222; }
        .card h2 { font-size: 1.1rem; color: var(--main); margin-bottom: 15px; border-right: 4px solid var(--sec); padding-right: 10px; }

        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; }
        .btn-done { background: var(--success); color: #fff; margin-bottom: 8px; }
        .btn-del { background: var(--danger); color: #fff; padding: 6px 15px; width: auto; font-size: 0.8rem; }

        /* المتجر */
        .cats-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .cat-btn { padding: 8px 22px; background: var(--card); border-radius: 50px; white-space: nowrap; font-size: 0.8rem; border: 1px solid #333; }
        .cat-btn.active { background: var(--main); color: #000; font-weight: bold; border-color: var(--main); }

        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .p-item { background: var(--card); padding: 12px; border-radius: 20px; text-align: center; border: 1px solid #222; position: relative; }
        .p-item img { width: 100%; height: 110px; border-radius: 15px; object-fit: cover; margin-bottom: 10px; }
        .p-item h3 { font-size: 0.85rem; height: 35px; overflow: hidden; }
        .p-item b { color: var(--main); font-size: 1.1rem; display: block; margin: 5px 0; }

        /* النافيجيشن */
        nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 12px 5px; border-top: 1px solid #222; z-index: 1000; }
        .nav-link { color: #555; text-decoration: none; text-align: center; font-size: 0.75rem; font-weight: bold; }
        .nav-link.active { color: var(--main); }
        .nav-link i { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    </style>
</head>
<body id="mainBody">

<header>
    <div class="header-top">
        <div class="left-name">مصطفى حجازي</div>
        <div class="center-logo" id="adminTrigger">⚡</div>
        <div class="right-brand">نجدة أوردر ⚡</div>
    </div>
    <div class="sub-title-box">
        <span class="sub-title">توصيل مستلزمات شخصية</span>
    </div>
</header>

<div id="home" class="page active">
    <div class="gift-ticker">
        <div class="ticker-text">
            🎁 اطلب 9 أوردرات وهديتك مجانية في العاشر! — نجدة أوردر أسرع توصيل — مصطفى حجازي في خدمتك 🎁
        </div>
    </div>
    <div class="cats-row" id="catsHome"></div>
    <div class="prod-grid" id="prodsHome"></div>
</div>

<div id="admin-orders" class="page">
    <h2 style="padding:10px;">🔔 طلبات العملاء</h2>
    <div id="ordersList"></div>
</div>

<div id="admin-cats" class="page">
    <div class="card">
        <h2>📂 إضافة قسم جديد</h2>
        <input type="text" id="catInp" placeholder="اسم القسم">
        <button class="btn btn-main" onclick="addCat()">حفظ القسم ✅</button>
    </div>
    <div id="catsManager"></div>
</div>

<div id="admin-prods" class="page">
    <div class="card">
        <h2>🛍️ إضافة منتج</h2>
        <input type="text" id="pT" placeholder="اسم المنتج">
        <input type="number" id="pP" placeholder="السعر">
        <select id="pCSel"></select>
        <input type="file" onchange="encode(this)">
        <button class="btn btn-main" onclick="addProd()">نشر المنتج 🚀</button>
    </div>
    <div id="prodsManager"></div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><i>🏠</i>المتجر</a>
    <a href="#" class="nav-link admin-only" onclick="go('admin-orders', this)"><i>🔔</i>الطلبات</a>
    <a href="#" class="nav-link admin-only" onclick="go('admin-cats', this)"><i>📂</i>الأقسام</a>
    <a href="#" class="nav-link admin-only" onclick="go('admin-prods', this)"><i>⚙️</i>المنتجات</a>
</nav>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    let isAdm = false, imgD = "";

    // تفعيل الإدارة بالضغط المطول (3 ثواني) على اللوجو في النص
    let timer;
    const trig = document.getElementById('adminTrigger');
    trig.addEventListener('mousedown', () => timer = setTimeout(switchMode, 3000));
    trig.addEventListener('touchstart', () => timer = setTimeout(switchMode, 3000));
    trig.addEventListener('mouseup', () => clearTimeout(timer));
    trig.addEventListener('touchend', () => clearTimeout(timer));

    function switchMode() {
        isAdm = !isAdm;
        document.body.classList.toggle('admin-mode', isAdm);
        alert(isAdm ? "وضع الإدارة مفعل ✅" : "تم الرجوع لوضع الزبون");
    }

    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    db.collection("categories").onSnapshot(s => {
        const cats = s.docs.map(d=>({id:d.id, ...d.data()}));
        document.getElementById('catsHome').innerHTML = `<div class="cat-btn active">الكل</div>` + cats.map(c=>`<div class="cat-btn">${c.name}</div>`).join('');
        document.getElementById('pCSel').innerHTML = cats.map(c=>`<option>${c.name}</option>`).join('');
        document.getElementById('catsManager').innerHTML = cats.map(c=>`<div class="card" style="display:flex; justify-content:space-between; align-items:center;"><span>${c.name}</span> <button class="btn-del" onclick="delDoc('categories','${c.id}')">حذف</button></div>`).join('');
    });

    db.collection("products").orderBy("createdAt", "desc").onSnapshot(s => {
        const prods = s.docs.map(d=>({id:d.id, ...d.data()}));
        document.getElementById('prodsHome').innerHTML = prods.map(p=>`<div class="p-item"><img src="${p.img}"><h3>${p.title}</h3><b>${p.price} ج.م</b></div>`).join('');
        document.getElementById('prodsManager').innerHTML = prods.map(p=>`<div class="card" style="display:flex; justify-content:space-between; align-items:center;"><span>${p.title}</span> <button class="btn-del" onclick="delDoc('products','${p.id}')">حذف</button></div>`).join('');
    });

    db.collection("orders").orderBy("createdAt", "desc").onSnapshot(s => {
        const orders = s.docs.map(d=>({id:d.id, ...d.data()}));
        document.getElementById('ordersList').innerHTML = orders.map(o => `
            <div class="card" style="border-right: 5px solid ${o.status=='done' ? 'var(--success)' : 'var(--main)'}">
                <b>👤 ${o.userName}</b> | 📞 ${o.userPhone}
                <p style="background:#000; padding:10px; border-radius:8px; margin:10px 0;">🛒 ${o.items?.join(' + ')}</p>
                <button class="btn btn-done" onclick="db.collection('orders').doc('${o.id}').update({status:'done'})">تأكيد الأوردر ✅</button>
                <button class="btn btn-del" style="width:100%" onclick="delDoc('orders','${o.id}')">حذف نهائي ❌</button>
            </div>`).join('');
    });

    async function addCat() { const n = document.getElementById('catInp').value; if(n) await db.collection("categories").add({name: n}); }
    async function addProd() {
        const t = document.getElementById('pT').value, p = document.getElementById('pP').value, c = document.getElementById('pCSel').value;
        if(t && p && imgD) await db.collection("products").add({title: t, price: p, cat: c, img: imgD, createdAt: new Date()});
    }
    function encode(el) { const r = new FileReader(); r.onload = () => imgD = r.result; r.readAsDataURL(el.files[0]); }
    async function delDoc(col, id) { if(confirm("أكيد الحذف؟")) await db.collection(col).doc(id).delete(); }
</script>
</body>
</html>
