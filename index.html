<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر | الإدارة الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #16161a; --danger: #ff3131; --success: #00ff88; --gold: #ffd700; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; }

        /* الهيدر */
        header { padding: 15px; background: #000; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .neon-text { color: var(--sec); text-shadow: 0 0 10px var(--sec); font-weight: 900; }

        /* الصفحات */
        .page { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* الكروت */
        .card { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid #222; margin-bottom: 15px; }
        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .p-item { background: var(--card); padding: 10px; border-radius: 15px; text-align: center; border: 1px solid #222; }
        .p-item img { width: 100%; height: 100px; border-radius: 10px; object-fit: cover; }

        /* لوحة التحكم وطلبات الإدارة */
        .order-brief { background: #000; padding: 15px; border-radius: 15px; border-right: 5px solid var(--main); cursor: pointer; margin-bottom: 10px; }
        .order-detail-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 3000; padding: 20px; display: none; overflow-y: auto; }

        /* المدخلات */
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }

        /* الناف بار */
        nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #222; z-index: 1000; }
        .nav-link { color: #555; text-decoration: none; text-align: center; font-size: 0.8rem; }
        .nav-link.active { color: var(--main); }

        .loyalty-msg { background: rgba(255, 215, 0, 0.1); border: 1px dashed var(--gold); padding: 10px; border-radius: 10px; text-align: center; color: var(--gold); margin-bottom: 10px; display: none; }
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }
    </style>
</head>
<body>

<header>
    <div style="color:var(--main); font-weight:900;">نجدة أوردر ⚡</div>
    <div id="adminTrigger" style="width:40px; height:40px; border:2px solid var(--main); border-radius:50%; display:flex; justify-content:center; align-items:center; cursor:pointer;">⚡</div>
    <div class="neon-text">مصطفى حجازي</div>
</header>

<div id="orderFullDetails" class="order-detail-page">
    <button onclick="closeOrderDetails()" style="background:none; color:var(--main); border:none; font-size:1.2rem; margin-bottom:20px;">⬅️ رجوع للطلبات</button>
    <div id="fullDetailsContent"></div>
</div>

<div id="home" class="page active"><div class="prod-grid" id="prodsHome"></div></div>

<div id="cart" class="page">
    <div class="card">
        <div id="loyaltyArea" class="loyalty-msg"></div>
        <h3>🛒 السلة</h3>
        <div id="cartItems"></div>
        <input type="tel" id="custPhone" placeholder="رقم الموبايل" oninput="checkUserPoints(this.value)">
        <input type="text" id="custName" placeholder="الاسم">
        <textarea id="custAddress" placeholder="العنوان"></textarea>
        <button class="btn btn-main" onclick="confirmOrder()">تأكيد عبر واتساب</button>
    </div>
</div>

<div id="admin-panel" class="page">
    <div class="card">
        <h3>🛍️ إضافة منتج</h3>
        <input type="text" id="pTitle" placeholder="اسم المنتج">
        <input type="file" id="pFile" onchange="encodeImage(this)">
        <button class="btn btn-main" onclick="uploadProduct()">نشر المنتج</button>
    </div>

    <h3>📦 إدارة المنتجات الحالية</h3>
    <div id="adminProductsList" style="margin-bottom:20px;"></div>

    <h3>🔔 الطلبات الواردة</h3>
    <div id="adminOrdersList"></div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="navigate('home', this)">المنزل</a>
    <a href="#" class="nav-link" onclick="navigate('cart', this)">السلة</a>
    <a href="#" class="nav-link admin-only" onclick="navigate('admin-panel', this)">الإدارة</a>
</nav>

<script>
    // الإعدادات
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    let isAdmin = false, currentImg = "", cart = [];

    // وضع الأدمن
    const trigger = document.getElementById('adminTrigger');
    let press;
    trigger.addEventListener('touchstart', () => press = setTimeout(() => {
        if(prompt("الباسورد:") === "135790") { isAdmin = true; document.body.classList.add('admin-mode'); alert("أهلاً يا مصطفى!"); }
    }, 3000));
    trigger.addEventListener('touchend', () => clearTimeout(press));

    // جلب المنتجات للمتجر وللإدارة
    function loadData() {
        db.collection("products").onSnapshot(s => {
            const prods = s.docs.map(d => ({id:d.id, ...d.data()}));
            // للمتجر
            document.getElementById('prodsHome').innerHTML = prods.map(p => `
                <div class="p-item" onclick="addToCart('${p.title}')">
                    <img src="${p.img}">
                    <h4>${p.title}</h4>
                    <small>اضغط للطلب</small>
                </div>`).join('');
            // للإدارة (حذف/تعديل)
            document.getElementById('adminProductsList').innerHTML = prods.map(p => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <span>${p.title}</span>
                    <button class="btn btn-danger" style="width:auto; padding:5px 10px;" onclick="deleteItem('products','${p.id}')">حذف</button>
                </div>`).join('');
        });
    }
    loadData();

    // السلة والنقاط
    async function checkUserPoints(phone) {
        if(phone.length >= 11) {
            const snap = await db.collection("orders").where("userPhone", "==", phone).where("status", "==", "confirmed").get();
            const points = snap.size;
            const area = document.getElementById('loyaltyArea');
            area.style.display = "block";
            if (points % 10 === 9) area.innerHTML = "🌟 مبروك! أوردرك العاشر توصيله مجاني!";
            else area.innerHTML = `🎯 نقاطك الحالية: ${points}`;
        }
    }

    function addToCart(t) {
        const qty = prompt("الكمية؟");
        const note = prompt("ملاحظات؟ (منين / إزاي)");
        if(qty) { cart.push({t, qty, note}); renderCart(); }
    }

    function renderCart() {
        document.getElementById('cartItems').innerHTML = cart.map((i, idx) => `
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span>${i.t} (${i.qty})</span>
                <span onclick="cart.splice(${idx},1); renderCart()" style="color:red">❌</span>
            </div>`).join('');
    }

    // إدارة الطلبات وتفاصيلها
    db.collection("orders").orderBy("createdAt", "desc").onSnapshot(s => {
        document.getElementById('adminOrdersList').innerHTML = s.docs.map(d => {
            const o = d.data();
            return `
                <div class="order-brief" onclick="showOrderFull('${d.id}')">
                    <b>${o.userName}</b> - ${o.userPhone}
                    <div style="font-size:0.8rem; color:#aaa;">الحالة: ${o.status === 'confirmed' ? '✅ مؤكد' : '⏳ جاري'}</div>
                </div>`;
        }).join('');
    });

    async function showOrderFull(id) {
        const doc = await db.collection("orders").doc(id).get();
        const o = doc.data();
        let items = o.items ? o.items.map(i => `<li>${i.t} (الكمية: ${i.qty}) <br> <small>ملاحظة: ${i.note}</small></li>`).join('') : "طلب شحن خاص";
        
        document.getElementById('fullDetailsContent').innerHTML = `
            <div class="card">
                <h2>تفاصيل طلب: ${o.userName}</h2>
                <p>📞 الهاتف: ${o.userPhone}</p>
                <p>📍 العنوان: ${o.address || 'شحن خاص'}</p>
                <hr>
                <h4>الأصناف:</h4>
                <ul>${items}</ul>
                <hr>
                <button class="btn btn-main" onclick="updateOrderStatus('${id}', 'confirmed')">تأكيد وتوصيل ✅</button>
                <button class="btn btn-danger" style="margin-top:10px;" onclick="deleteItem('orders','${id}'); closeOrderDetails();">مسح الطلب ❌</button>
            </div>`;
        document.getElementById('orderFullDetails').style.display = "block";
    }

    function closeOrderDetails() { document.getElementById('orderFullDetails').style.display = "none"; }

    async function updateOrderStatus(id, status) {
        await db.collection("orders").doc(id).update({ status });
        alert("تم تأكيد الطلب بنجاح!");
        closeOrderDetails();
    }

    // وظائف أساسية
    async function confirmOrder() {
        const p = document.getElementById('custPhone').value;
        const n = document.getElementById('custName').value;
        if(p && n && cart.length > 0) {
            await db.collection("orders").add({ userName: n, userPhone: p, address: document.getElementById('custAddress').value, items: cart, status: 'pending', createdAt: new Date() });
            window.open(`https://wa.me/201140293628?text=طلب جديد من ${n}`);
            cart = []; renderCart();
        }
    }

    async function uploadProduct() {
        const t = document.getElementById('pTitle').value;
        if(t && currentImg) {
            await db.collection("products").add({ title: t, img: currentImg });
            alert("تم النشر!");
        }
    }

    async function deleteItem(col, id) { if(confirm("أكيد؟")) await db.collection(col).doc(id).delete(); }
    function encodeImage(i) { const r = new FileReader(); r.onload = () => currentImg = r.result; r.readAsDataURL(i.files[0]); }
    function navigate(id, el) { 
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
</html>
