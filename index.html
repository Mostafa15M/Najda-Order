<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nagda Order Elite | مصطفى حجازي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff; --bg: #030712; --card: #111827;
            --text: #f9fafb; --dim: #9ca3af; --neon-pink: #ff007a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 120px; overflow-x: hidden; }

        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo h1 { font-size: 2.2rem; font-weight: 900; background: linear-gradient(to bottom, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .dev-tag { font-size: 0.7rem; letter-spacing: 2px; color: var(--accent); font-weight: 700; opacity: 0.8; }

        .hero-action { 
            margin: 20px; padding: 25px; border-radius: 20px; 
            background: linear-gradient(45deg, #1e1b4b, #312e81);
            border-left: 5px solid var(--accent); cursor: pointer;
        }

        .cats-bar { display: flex; gap: 10px; overflow-x: auto; padding: 20px; scrollbar-width: none; }
        .pill { 
            padding: 8px 25px; background: var(--card); border-radius: 50px; 
            font-size: 0.85rem; font-weight: 700; white-space: nowrap; border: 1px solid rgba(255,255,255,0.05);
        }
        .pill.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .p-card { background: var(--card); border-radius: 20px; overflow: hidden; position: relative; }
        .p-card img { width: 100%; height: 150px; object-fit: cover; }
        .p-card-info { padding: 12px; text-align: center; }
        .btn-main { 
            width: 100%; padding: 12px; border-radius: 12px; border: none; 
            font-weight: 900; cursor: pointer; background: var(--accent); color: #000;
        }

        .bottom-nav { 
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(15px);
            border-radius: 20px; display: flex; justify-content: space-around; padding: 15px;
            border: 1px solid rgba(255,255,255,0.1); z-index: 2000;
        }
        .nav-item { color: var(--dim); font-size: 0.8rem; font-weight: 700; cursor: pointer; position: relative; }
        .nav-item.active { color: var(--accent); }
        .badge { 
            position: absolute; top: -10px; right: -10px; background: var(--neon-pink); 
            color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 0.6rem;
            display: flex; align-items: center; justify-content: center;
        }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; align-items: flex-end; justify-content: center;
        }
        .modal-content { 
            background: var(--card); width: 100%; border-radius: 30px 30px 0 0; padding: 30px;
            border-top: 2px solid var(--accent); animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        input, select, textarea { 
            width: 100%; padding: 15px; border-radius: 12px; background: #000;
            border: 1px solid rgba(255,255,255,0.1); color: #fff; margin-bottom: 12px; outline: none;
        }

        .admin-box { background: #1f2937; padding: 20px; border-radius: 20px; margin-bottom: 25px; border: 1px dashed var(--accent); }
        .admin-item { background: #000; padding: 10px; margin-top: 8px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header onclick="adminCheck()">
        <div class="logo">
            <p class="dev-tag">DESIGNED BY</p>
            <h1>نجدة<span>.</span>ORDER</h1>
            <p style="color:var(--accent); font-weight: 900;">MOSTAFA HEGAZY</p>
        </div>
    </header>

    <div id="shopPage" class="page">
        <div class="hero-action" onclick="openSpecial()" style="margin:20px;">
            <h3 style="color:#fff">مشوار نجدة الخاص ⚡</h3>
            <p style="color:var(--dim); font-size: 0.8rem;">وصل أماناتك لأي مكان</p>
        </div>
        <div class="cats-bar" id="catsBar"></div>
        <div class="grid" id="shopGrid"></div>
    </div>

    <div id="cartPage" class="page" style="display:none; padding:20px;">
        <h2 style="margin-bottom:20px;">سلة طلباتك 🛒</h2>
        <div id="cartList"></div>
        <div id="checkoutForm" style="display:none; margin-top:20px;">
            <input type="text" id="uName" placeholder="الاسم">
            <input type="tel" id="uPhone" placeholder="رقم الهاتف">
            <input type="text" id="uAddr" placeholder="العنوان">
            <button class="btn-main" style="padding:18px;" onclick="completeOrder()">تأكيد الطلب وانهاء السلة ✅</button>
        </div>
    </div>

    <div id="adminPage" class="page" style="display:none; padding:20px;">
        <h2 style="color:var(--accent); margin-bottom:20px;">لوحة الإدارة الكاملة ⚙️</h2>
        
        <div class="admin-box">
            <h4>📁 إدارة الأقسام</h4><br>
            <div style="display:flex; gap:5px;">
                <input type="text" id="newCatName" placeholder="اسم القسم الجديد">
                <button class="btn-main" style="width:80px;" onclick="addCategory()">إضافة</button>
            </div>
            <div id="adminCatsList"></div>
        </div>

        <div class="admin-box">
            <h4>🍔 إضافة منتج جديد</h4><br>
            <input type="text" id="pTitle" placeholder="اسم المنتج">
            <input type="file" accept="image/*" onchange="imgProcess(this)">
            <select id="pUnit"><option value="كيلو">كيلو</option><option value="قطعة">قطعة</option></select>
            <select id="pCatSelect"></select>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                <input type="checkbox" id="pAllowPrice" style="width:20px; height:20px;">
                <label>تفعيل الطلب بالسعر</label>
            </div>
            <button class="btn-main" onclick="saveProduct()">حفظ المنتج</button>
        </div>
        <div id="adminProductList"></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="btnShop" onclick="nav('shop')">🏠 المتجر</div>
        <div class="nav-item" id="btnCart" onclick="nav('cart')">🛒 السلة <div id="badge" class="badge" style="display:none">0</div></div>
        <div class="nav-item" id="btnAdmin" style="display:none" onclick="nav('admin')">⚙️ الإدارة</div>
    </nav>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="mTitle" style="color:var(--accent); margin-bottom:15px;"></h2>
            <div id="stdFields">
                <div style="text-align:center; font-size:2rem; color:var(--accent); font-weight:900;" id="qtyText">0.25 كيلو</div>
                <input type="range" id="qtySlider" min="0.25" max="10" step="0.25" oninput="handleSlider(this.value)">
                <div id="priceSection" style="display:none; margin-top:15px;">
                    <input type="text" id="manualQty" placeholder="أو اطلب بمبلغ محدد (مثلاً بـ 50 ج)">
                </div>
                <input type="text" id="mSource" placeholder="من مكان محدد؟" style="margin-top:15px;">
            </div>
            <div id="spcFields" style="display:none;">
                <textarea id="mDesc" placeholder="اكتب طلبك.."></textarea>
                <input type="text" id="mFrom" placeholder="منين؟">
                <input type="text" id="mTo" placeholder="لفين؟">
            </div>
            <button class="btn-main" onclick="confirmAdd()">إضافة للسلة</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:var(--dim); margin-top:15px;">إلغاء</button>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('n_p_final')) || [];
        let cats = JSON.parse(localStorage.getItem('n_c_final')) || ['الكل', 'خضروات', 'مطاعم'];
        let cart = [];
        let tempImg = "";
        let selectedItem = null;
        let adminClicks = 0;

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id + 'Page').style.display = 'block';
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('btn' + id.charAt(0).toUpperCase() + id.slice(1)).classList.add('active');
            if(id === 'shop') renderShop();
            if(id === 'admin') renderAdmin();
            if(id === 'cart') renderCart();
        }

        function adminCheck() {
            adminClicks++;
            if(adminClicks > 5) { if(prompt("أدخل الكود:")==="135790") { document.getElementById('btnAdmin').style.display='block'; nav('admin'); } adminClicks=0; }
        }

        function renderShop(f = 'الكل') {
            document.getElementById('catsBar').innerHTML = cats.map(c => `<div class="pill ${f===c?'active':''}" onclick="renderShop('${c}')">${c}</div>`).join('');
            const grid = document.getElementById('shopGrid'); grid.innerHTML = "";
            products.filter(p => f === 'الكل' || p.cat === f).forEach(p => {
                grid.innerHTML += `<div class="p-card"><img src="${p.img}"><div class="p-card-info"><h4>${p.title}</h4><button class="btn-main" onclick="openModal(${JSON.stringify(p).replace(/"/g, '&quot;')})">اطلب</button></div></div>`;
            });
        }

        function addCategory() {
            let name = document.getElementById('newCatName').value.trim();
            if(name && !cats.includes(name)) {
                cats.push(name);
                localStorage.setItem('n_c_final', JSON.stringify(cats));
                document.getElementById('newCatName').value = "";
                renderAdmin();
            }
        }

        function deleteCat(index) {
            if(cats[index] === 'الكل') return alert("لا يمكن مسح هذا القسم");
            cats.splice(index, 1);
            localStorage.setItem('n_c_final', JSON.stringify(cats));
            renderAdmin();
        }

        function renderAdmin() {
            document.getElementById('pCatSelect').innerHTML = cats.filter(c => c !== 'الكل').map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('adminCatsList').innerHTML = cats.map((c, i) => `<div class="admin-item"><span>${c}</span><span style="color:red" onclick="deleteCat(${i})">مسح</span></div>`).join('');
            document.getElementById('adminProductList').innerHTML = products.map((p, i) => `<div class="admin-item"><span>${p.title}</span><span style="color:red" onclick="products.splice(${i},1); localStorage.setItem('n_p_final',JSON.stringify(products)); renderAdmin();">مسح</span></div>`).join('');
        }

        function openModal(item) {
            selectedItem = item;
            document.getElementById('mTitle').innerText = item.title;
            document.getElementById('priceSection').style.display = item.allowPrice ? 'block' : 'none';
            document.getElementById('stdFields').style.display = 'block';
            document.getElementById('spcFields').style.display = 'none';
            document.getElementById('modal').style.display = 'flex';
            handleSlider(0.25);
        }

        function handleSlider(v) { document.getElementById('qtyText').innerText = v + " " + selectedItem.unit; }
        function openSpecial() { 
            document.getElementById('mTitle').innerText = "مشوار خاص";
            document.getElementById('stdFields').style.display = 'none';
            document.getElementById('spcFields').style.display = 'block';
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function confirmAdd() {
            if(document.getElementById('spcFields').style.display === 'block') {
                cart.push({ type: 'مشوار', desc: document.getElementById('mDesc').value });
            } else {
                let qty = document.getElementById('manualQty').value || document.getElementById('qtySlider').value + " " + selectedItem.unit;
                cart.push({ type: 'منتج', name: selectedItem.title, qty, source: document.getElementById('mSource').value || "أي مكان" });
            }
            closeModal(); updateBadge();
        }

        function updateBadge() {
            document.getElementById('badge').innerText = cart.length;
            document.getElementById('badge').style.display = cart.length ? 'flex' : 'none';
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            if(!cart.length) { list.innerHTML = "<p style='text-align:center; padding:50px;'>السلة فاضية</p>"; document.getElementById('checkoutForm').style.display='none'; return; }
            document.getElementById('checkoutForm').style.display='block';
            list.innerHTML = cart.map((i, idx) => `<div class="admin-item"><div>${i.name || i.desc}</div><div style="color:red" onclick="cart.splice(${idx},1); renderCart(); updateBadge();">حذف</div></div>`).join('');
        }

        function completeOrder() {
            let msg = `*طلب نجدة أوردر*%0A`;
            cart.forEach(i => msg += `- ${i.name || i.type}: ${i.qty || i.desc}%0A`);
            window.open(`https://wa.me/201140293628?text=${msg}`);
            cart = []; updateBadge(); nav('shop');
        }

        function imgProcess(el) {
            const r = new FileReader(); r.onload = (e) => tempImg = e.target.result;
            r.readAsDataURL(el.files[0]);
        }

        function saveProduct() {
            const t = document.getElementById('pTitle').value;
            const c = document.getElementById('pCatSelect').value;
            if(!t || !tempImg) return alert("اكمل البيانات");
            products.push({ title: t, cat: c, img: tempImg, unit: document.getElementById('pUnit').value, allowPrice: document.getElementById('pAllowPrice').checked });
            localStorage.setItem('n_p_final', JSON.stringify(products));
            renderAdmin(); renderShop();
            alert("تم الحفظ!");
        }

        renderShop();
    </script>
</body>
</html>
