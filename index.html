<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #1c1c1e; --danger: #ff453a; --success: #32d74b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; }

        header { padding: 15px 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo-text { font-weight: 900; font-size: 1.1rem; background: linear-gradient(var(--main), var(--sec)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .gift-banner { background: linear-gradient(45deg, var(--main), var(--sec)); padding: 10px; text-align: center; font-weight: bold; font-size: 0.85rem; border-radius: 12px; margin: 10px 15px; }

        nav { position: fixed; bottom: 0; width: 100%; background: #0a0a0c; border-top: 1px solid #2c2c2e; display: flex; justify-content: space-around; padding: 10px 0 25px; z-index: 3000; }
        .nav-link { color: #8e8e93; text-decoration: none; text-align: center; flex: 1; font-size: 0.8rem; }
        .nav-link i { font-size: 1.3rem; display: block; margin-bottom: 3px; }
        .nav-link.active { color: var(--main); }

        .page { display: none; padding: 0 15px; animation: slideUp 0.3s; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* البحث والأقسام */
        .search-box { margin: 10px 0; position: relative; }
        .search-box input { padding-right: 40px; margin-bottom: 5px; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .cat-chip { background: #222; padding: 6px 15px; border-radius: 20px; white-space: nowrap; font-size: 0.85rem; border: 1px solid #333; }
        .cat-chip.active { background: var(--main); color: #000; border-color: var(--main); font-weight: bold; }

        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .p-card { background: var(--card); border-radius: 18px; overflow: hidden; border: 1px solid #2c2c2e; position: relative; }
        .p-card img { width: 100%; height: 110px; object-fit: cover; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 4000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 360px; border: 1px solid var(--main); }
        
        input, textarea, select { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #333; background: #1c1c1e; color: #fff; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: white; }
        
        .admin-section { background: #151517; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .hidden-admin { display: none !important; }
        .admin-mode .hidden-admin { display: block !important; }
        .order-card { background: #1c1c1e; border: 1px solid #333; padding: 12px; border-radius: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo-text">نجدة أوردر ⚡</div>
    <div class="admin-btn" ondblclick="toggleAdmin()">مصطفى حجازي</div>
</header>

<div class="gift-banner">🎁 اطلب 9 أوردرات والعاشر توصيله مجاناً! 🎁</div>

<div id="qtyModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">اسم المنتج</h3>
        <input type="text" id="customQty" placeholder="الكمية (مثلاً: 1 أو نص)" value="1" style="margin-top:15px; text-align:center; font-weight:bold; border-color:var(--main);">
        <textarea id="pNote" placeholder="أي ملاحظات إضافية؟"></textarea>
        <button class="btn btn-main" onclick="confirmAdd()">إضافة للسلة ✅</button>
        <p onclick="closeModal()" style="margin-top:10px; color:#8e8e93; text-align:center; cursor:pointer;">إلغاء</p>
    </div>
</div>

<div id="home" class="page active">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن أكلة أو منتج..." oninput="filterProducts()">
    </div>
    <div id="categoriesFilter" class="cat-bar"></div>
    <div id="prodsHome" class="prod-grid"></div>
</div>

<div id="special" class="page">
    <h3 style="text-align:center; margin: 20px 0;">📦 شحن وتوصيل خاص</h3>
    <input type="text" id="spDetails" placeholder="الأغراض المطلوب نقلها">
    <input type="text" id="spFrom" placeholder="نقطة الاستلام">
    <input type="text" id="spTo" placeholder="نقطة التسليم">
    <input type="tel" id="spPhone" placeholder="رقم الموبايل">
    <button class="btn btn-main" onclick="sendSpecialOrder()">طلب مندوب شحن 🚀</button>
</div>

<div id="cart" class="page">
    <h3 style="margin: 20px 0;">🛒 طلباتك</h3>
    <div id="cartList"></div>
    <div id="loyaltyStatus" style="display:none; background:#1c1c1e; padding:15px; border-radius:15px; border: 1px solid var(--success); text-align:center; margin-bottom:15px;">
        <p id="loyaltyMsg"></p>
    </div>
    <input type="text" id="uName" placeholder="الاسم">
    <input type="text" id="uAddress" placeholder="العنوان بالتفصيل">
    <input type="tel" id="uPhone" placeholder="رقم الموبايل" oninput="checkLoyalty(this.value)">
    <button class="btn btn-main" onclick="confirmFullOrder()">تأكيد وإرسال واتساب 💬</button>
</div>

<div id="admin-page" class="page">
    <h3 style="margin: 20px 0; color: var(--main);">⚙️ لوحة التحكم</h3>
    
    <div class="admin-section">
        <h4>📨 الطلبات الجديدة</h4>
        <div id="adminOrdersList"></div>
    </div>

    <div class="admin-section">
        <h4>✨ إضافة منتج</h4>
        <input type="text" id="newPTitle" placeholder="اسم المنتج">
        <select id="newPCat"></select>
        <input type="file" id="newPImg" accept="image/*">
        <button class="btn btn-main" onclick="uploadProduct()">حفظ</button>
    </div>

    <div class="admin-section">
        <h4>📁 الأقسام</h4>
        <input type="text" id="newCatName" placeholder="قسم جديد">
        <button class="btn btn-main" onclick="addCategory()">إضافة قسم</button>
        <div id="catsManagerList" style="margin-top:10px;"></div>
    </div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><i>🏠</i><span>الرئيسية</span></a>
    <a href="#" class="nav-link" onclick="go('special', this)"><i>📦</i><span>توصيل</span></a>
    <a href="#" class="nav-link" onclick="go('cart', this)"><i>🛒</i><span>السلة</span></a>
    <a href="#" class="nav-link hidden-admin" onclick="go('admin-page', this)"><i>⚙️</i><span>الإدارة</span></a>
</nav>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let cart = [], currentProduct = "", allProducts = [], selectedCat = "الكل";

    function toggleAdmin() { if(prompt("الباسورد؟") === "135790") document.body.classList.toggle('admin-mode'); }

    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
        if(id === 'admin-page') loadOrders();
    }

    // جلب المنتجات والأقسام
    db.collection("categories").onSnapshot(s => {
        let cats = [{name:'الكل'}];
        s.forEach(d => cats.push(d.data()));
        renderCats(cats);
    });

    function renderCats(cats) {
        let h = '', opts = '';
        cats.forEach(c => {
            h += `<div class="cat-chip ${selectedCat === c.name ? 'active' : ''}" onclick="filterCat('${c.name}')">${c.name}</div>`;
            if(c.name !== 'الكل') opts += `<option value="${c.name}">${c.name}</option>`;
        });
        document.getElementById('categoriesFilter').innerHTML = h;
        document.getElementById('newPCat').innerHTML = opts;
    }

    db.collection("products").orderBy("createdAt", "desc").onSnapshot(s => {
        allProducts = [];
        s.forEach(d => allProducts.push({id: d.id, ...d.data()}));
        filterProducts();
    });

    function filterCat(cat) { selectedCat = cat; filterProducts(); }

    function filterProducts() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allProducts.filter(p => {
            const matchCat = (selectedCat === "الكل" || p.cat === selectedCat);
            const matchSearch = p.title.toLowerCase().includes(query);
            return matchCat && matchSearch;
        });

        let h = '';
        filtered.forEach(p => {
            h += `<div class="p-card">
                <div class="admin-mode" style="position:absolute; top:5px; left:5px; display:none;" onclick="deleteDoc('products','${p.id}')">🗑️</div>
                <img src="${p.img}">
                <div style="padding:10px; text-align:center;">
                    <p style="font-size:0.85rem; font-weight:bold;">${p.title}</p>
                    <button class="btn btn-main" style="padding:6px; margin-top:5px; font-size:0.75rem;" onclick="openQtyModal('${p.title}')">اطلب</button>
                </div>
            </div>`;
        });
        document.getElementById('prodsHome').innerHTML = h;
    }

    function openQtyModal(title) {
        currentProduct = title;
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('qtyModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('qtyModal').style.display = 'none'; }

    function confirmAdd() {
        cart.push({ t: currentProduct, q: document.getElementById('customQty').value, n: document.getElementById('pNote').value });
        closeModal();
        renderCart();
    }

    function renderCart() {
        document.getElementById('cartList').innerHTML = cart.map((i,idx)=>`
            <div style="background:#222; padding:10px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between;">
                <span>${i.t} (${i.q})</span>
                <span onclick="cart.splice(${idx},1);renderCart()" style="color:red;">✕</span>
            </div>
        `).join('');
    }

    async function checkLoyalty(phone) {
        if(phone.length >= 11) {
            const snap = await db.collection("orders").where("p", "==", phone).where("status", "==", "done").get();
            const count = snap.size;
            document.getElementById('loyaltyStatus').style.display = 'block';
            document.getElementById('loyaltyMsg').innerText = count >= 9 ? "🎁 مبروك! الأوردر ده هدية توصيل مجاني" : `عندك ${count} أوردرات ناجحة. فاضلك ${9-count} للهدية!`;
        }
    }

    async function confirmFullOrder() {
        const n = document.getElementById('uName').value, p = document.getElementById('uPhone').value, a = document.getElementById('uAddress').value;
        if(!n || !p || cart.length === 0) return alert("كمل بياناتك!");
        await db.collection("orders").add({ n, p, a, items: cart, status: "pending", createdAt: new Date() });
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent("أوردر جديد من: " + n)}`);
        cart = []; renderCart();
    }

    // الإدارة
    function loadOrders() {
        db.collection("orders").where("status", "==", "pending").onSnapshot(s => {
            let h = '';
            s.forEach(d => {
                const o = d.data();
                h += `<div class="order-card">
                    <p>👤 <b>${o.n}</b> | 📞 ${o.p}</p>
                    <p style="font-size:0.8rem; color:var(--main);">${o.items.map(i=>i.t+'('+i.q+')').join(', ')}</p>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn" style="background:var(--success); color:#000; flex:1;" onclick="updateStatus('${d.id}', 'done')">موافقة ✅</button>
                        <button class="btn" style="background:var(--danger); flex:1;" onclick="updateStatus('${d.id}', 'canceled')">إلغاء ❌</button>
                    </div>
                </div>`;
            });
            document.getElementById('adminOrdersList').innerHTML = h || 'لا يوجد طلبات جديدة';
        });
    }

    async function updateStatus(id, status) {
        await db.collection("orders").doc(id).update({ status: status });
        alert(status === 'done' ? "تمت الموافقة والحفظ في سجل العميل" : "تم إلغاء الطلب");
    }

    async function uploadProduct() {
        const title = document.getElementById('newPTitle').value, cat = document.getElementById('newPCat').value, file = document.getElementById('newPImg').files[0];
        if(!title || !file) return alert("اختار صورة واسم");
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async (e) => {
            await db.collection("products").add({ title, cat, img: e.target.result, createdAt: new Date() });
            alert("تم الحفظ");
        }
    }

    async function addCategory() {
        const name = document.getElementById('newCatName').value;
        if(name) await db.collection("categories").add({ name });
    }

    function deleteDoc(col, id) { if(confirm("حذف؟")) db.collection(col).doc(id).delete(); }
</script>
</body>
</html>
