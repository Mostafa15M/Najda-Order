<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نجدة أوردر ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --main: #00d2ff; --sec: #bd00ff; --bg: #0a0a0c; --card: #16161a; --danger: #ff3131; --gold: #ffd700; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 90px; }

        header { padding: 15px; background: #000; border-bottom: 2px solid var(--main); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .neon-text { color: var(--sec); text-shadow: 0 0 10px var(--sec); font-weight: 900; }

        /* شريط البحث */
        .search-box { position: relative; margin: 10px 0; }
        .search-box input { padding-right: 45px; border-color: var(--main); background: #000; color: #fff; width: 100%; padding: 12px; border-radius: 15px; border: 1px solid #333; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--main); box-shadow: 0 0 10px var(--main); }
        .search-box::before { content: '🔍'; position: absolute; right: 15px; top: 12px; font-size: 1.2rem; }

        .page { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--card); padding: 20px; border-radius: 25px; border: 1px solid #222; margin-bottom: 15px; }
        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .p-item { background: var(--card); padding: 12px; border-radius: 20px; text-align: center; border: 1px solid #222; }
        .p-item img { width: 100%; height: 120px; border-radius: 15px; object-fit: cover; }

        /* ستايل زرار الصور المخصص */
        .file-upload { position: relative; display: block; background: rgba(189, 0, 255, 0.1); border: 2px dashed var(--sec); padding: 15px; text-align: center; border-radius: 15px; margin: 10px 0; cursor: pointer; }
        .file-upload input { position: absolute; opacity: 0; width: 100%; height: 100%; top: 0; left: 0; cursor: pointer; }
        .file-upload span { color: var(--sec); font-weight: bold; }

        .btn { width: 100%; padding: 16px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-main { background: linear-gradient(45deg, var(--main), var(--sec)); color: #fff; }

        nav { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #222; backdrop-filter: blur(10px); z-index: 1000; }
        .nav-link { color: #555; text-decoration: none; text-align: center; font-size: 0.75rem; flex: 1; }
        .nav-link.active { color: var(--main); }
        .nav-link span { font-size: 1.5rem; display: block; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; padding: 20px; display: none; overflow-y: auto; }
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: flex !important; }
    </style>
</head>
<body>

<header>
    <div style="color:var(--main); font-weight:900;">نجدة أوردر ⚡</div>
    <div class="neon-text" id="adminToggle">مصطفى حجازي</div>
</header>

<div id="orderOverlay" class="overlay">
    <button onclick="document.getElementById('orderOverlay').style.display='none'" style="background:none; border:none; color:var(--main); margin-bottom:20px;">⬅️ رجوع للطلبات</button>
    <div id="orderInfo"></div>
</div>

<div id="home" class="page active">
    <div class="search-box">
        <input type="text" id="pSearch" placeholder="ابحث عن منتج..." oninput="filterP()">
    </div>
    <div class="prod-grid" id="hProds"></div>
</div>

<div id="special" class="page">
    <div class="card">
        <h3 style="text-align:center; color:var(--main); margin-bottom:15px;">📦 طلب شحن خاص</h3>
        <input type="text" id="spT" placeholder="إيه الحاجة اللي هنوصلها؟">
        <input type="text" id="spF" placeholder="مكان الاستلام (منين؟)">
        <input type="text" id="spTo" placeholder="مكان التسليم (لفين؟)">
        <input type="text" id="spN" placeholder="اسم المستلم">
        <input type="tel" id="spPh" placeholder="رقم موبايل المستلم">
        <button class="btn btn-main" onclick="sendSp()">إرسال طلب الشحن 🚀</button>
    </div>
</div>

<div id="cart" class="page">
    <div class="card">
        <h3 style="text-align:center; margin-bottom:15px;">🛒 مراجعة السلة</h3>
        <div id="cItems" style="margin:15px 0;"></div>
        <input type="tel" id="uPh" placeholder="رقم موبايلك">
        <input type="text" id="uN" placeholder="اسمك الكريم">
        <button class="btn btn-main" onclick="sendCart()">تأكيد وإرسال واتساب 💬</button>
    </div>
</div>

<div id="admin" class="page">
    <div class="card">
        <h4>🛍️ إضافة منتج جديد</h4>
        <input type="text" id="pn" placeholder="اسم المنتج">
        <div class="file-upload">
            <span id="fl">📸 اضغط لاختيار صورة</span>
            <input type="file" onchange="hImg(this)">
        </div>
        <button class="btn btn-main" onclick="saveP()">نشر المنتج الآن</button>
    </div>

    <h4>🔔 أحدث الطلبات</h4>
    <div class="search-box">
        <input type="text" id="oSearch" placeholder="ابحث باسم العميل أو رقم التليفون..." oninput="filterO()">
    </div>
    <div id="oList"></div>
</div>

<nav>
    <a href="#" class="nav-link active" onclick="go('home', this)"><span>🏠</span>المنزل</a>
    <a href="#" class="nav-link" onclick="go('special', this)"><span>📦</span>طلب خاص</a>
    <a href="#" class="nav-link" onclick="go('cart', this)"><span>🛒</span>السلة</a>
    <a href="#" class="nav-link admin-only" id="adminNavLink" onclick="go('admin', this)"><span>⚙️</span>الإدارة</a>
</nav>

<script>
    // بيانات الفايربيس (تأكد من صحتها)
    const firebaseConfig = { apiKey: "AIzaSyC9ieBxgZ31LMk9AP2IH0mbi8YzQLk2WXY", authDomain: "nagdaorder.firebaseapp.com", projectId: "nagdaorder", storageBucket: "nagdaorder.firebasestorage.app", messagingSenderId: "99058164922", appId: "1:99058164922:web:7063d1686dc82a7ac30e83" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    let allP = [], allO = [], imgB64 = "", cart = [];

    // وضع الأدمن بلمسة مطولة
    let pressTimer;
    document.getElementById('adminToggle').addEventListener('touchstart', () => pressTimer = setTimeout(() => {
        if(prompt("كلمة سر الإدارة:") === "135790") document.body.classList.add('admin-mode');
    }, 3000));
    document.getElementById('adminToggle').addEventListener('touchend', () => clearTimeout(pressTimer));

    function sync() {
        db.collection("products").onSnapshot(s => {
            allP = s.docs.map(d => ({id:d.id, ...d.data()}));
            renderP(allP);
        });
        db.collection("orders").where("status", "==", "pending").orderBy("createdAt", "desc").onSnapshot(s => {
            allO = s.docs.map(d => ({id:d.id, ...d.data()}));
            renderO(allO);
        });
    }
    sync();

    // فلاتر البحث
    function filterP() {
        const t = document.getElementById('pSearch').value.toLowerCase();
        renderP(allP.filter(p => p.title.toLowerCase().includes(t)));
    }
    function filterO() {
        const t = document.getElementById('oSearch').value.toLowerCase();
        renderO(allO.filter(o => (o.uN && o.uN.toLowerCase().includes(t)) || (o.uPh && o.uPh.includes(t)) || (o.spN && o.spN.toLowerCase().includes(t)) || (o.spPh && o.spPh.includes(t))));
    }

    function renderP(arr) { document.getElementById('hProds').innerHTML = arr.map(p => `<div class="p-item" onclick="addC('${p.title}')"><img src="${p.img}"><p>${p.title}</p></div>`).join(''); }
    function renderO(arr) { document.getElementById('oList').innerHTML = arr.map(o => `<div class="card" onclick="vO('${o.id}')" style="border-right:4px solid var(--main)"><b>${o.uN || o.spN}</b><br>${o.uPh || o.spPh}</div>`).join(''); }

    async function vO(id) {
        const o = allO.find(x => x.id === id);
        let h = `<div class="card"><h3>تفاصيل الطلب</h3>`;
        if(o.type==='special') {
            h += `<p>📦 الحاجة: ${o.spT}</p><p>🚩 من: ${o.spF}</p><p>📍 لـ: ${o.spTo}</p><p>👤 المستلم: ${o.spN}</p><p>📞 هاتف: ${o.spPh}</p>`;
        } else {
            h += `<p>👤 العميل: ${o.uN}</p><p>📞 هاتف: ${o.uPh}</p><ul>${o.items.map(i=>`<li>${i.t} (ج:${i.q})</li>`).join('')}</ul>`;
        }
        h += `<button class="btn btn-main" style="margin-top:15px;" onclick="done('${id}')">تم التوصيل (تأكيد) ✅</button></div>`;
        document.getElementById('orderInfo').innerHTML = h;
        document.getElementById('orderOverlay').style.display = "block";
    }

    // إرسال السلة مع الكود السري العريض في الآخر
    async function sendCart() {
        const n = document.getElementById('uN').value, p = document.getElementById('uPh').value;
        if(n && p && cart.length > 0) {
            const snap = await db.collection("orders").where("uPh", "==", p).where("status", "==", "done").get();
            let secretCode = (snap.size % 10 === 9) ? "\n\n*10Mostafa-Hegazy10*" : "";
            
            await db.collection("orders").add({ type: 'shop', uN: n, uPh: p, items: cart, status: 'pending', createdAt: new Date() });
            
            let msg = `⚡ *NAGDA ORDER*\n👤 العميل: ${n}\n📞 الهاتف: ${p}\n🛒 الطلبات:\n` + 
                      cart.map(i=>`- ${i.t} (${i.q})`).join('\n') + secretCode;
            
            window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
            cart = []; renderC();
        } else alert("كمل بياناتك والسلة الأول!");
    }

    // إرسال شحن خاص مع الكود السري
    async function sendSp() {
        const ph = document.getElementById('spPh').value;
        const snap = await db.collection("orders").where("uPh", "==", ph).where("status", "==", "done").get();
        let secretCode = (snap.size % 10 === 9) ? "\n\n*10Mostafa-Hegazy10*" : "";

        const d = { type: 'special', spT: document.getElementById('spT').value, spF: document.getElementById('spF').value, spTo: document.getElementById('spTo').value, spN: document.getElementById('spN').value, spPh: ph, status: 'pending', createdAt: new Date() };
        await db.collection("orders").add(d);
        
        let msg = `📦 *طلب شحن خاص*\n🎁 الشيء: ${d.spT}\n🚩 من: ${d.spF}\n📍 لـ: ${d.spTo}\n👤 المستلم: ${d.spN}\n📞 هاتف: ${ph}` + secretCode;
        window.open(`https://wa.me/201140293628?text=${encodeURIComponent(msg)}`);
    }

    async function done(id) { await db.collection("orders").doc(id).update({status: 'done'}); document.getElementById('orderOverlay').style.display='none'; }
    function hImg(i) { const r = new FileReader(); r.onload = (e) => { imgB64 = e.target.result; document.getElementById('fl').innerText = "✅ تم اختيار الصورة"; }; r.readAsDataURL(i.files[0]); }
    async function saveP() { if(imgB64) { await db.collection("products").add({ title: document.getElementById('pn').value, img: imgB64, createdAt: new Date() }); alert("تم النشر!"); location.reload(); } }
    function addC(t) { const q = prompt("الكمية؟"); if(q) { cart.push({t, q}); renderC(); } }
    function renderC() { document.getElementById('cItems').innerHTML = cart.map(i=>`<p>✅ ${i.t} (${i.q})</p>`).join(''); }
    function go(id, el) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active')); el.classList.add('active'); }
</script>
</body>
</html>
